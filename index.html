<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>KIH Phlebotomy · Companion</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   KIH PHLEBOTOMY COMPANION — COMPLETE CSS
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg-0:#FFFFFF;
  --bg-1:#F9FAFB;
  --bg-2:#F3F4F6;
  --bg-glass:#FFFFFF;
  --bg-glass-2:#F9FAFB;
  --bg-glass-3:#F3F4F6;
  --border:#E5E7EB;
  --border-2:#D1D5DB;
  --border-3:#9CA3AF;
  --text:#111827;
  --text-muted:#6B7280;
  --text-dim:#9CA3AF;
  --primary:#14B8A6;
  --primary-2:#0D9488;
  --primary-grad:linear-gradient(135deg,#14B8A6,#0D9488);
  --primary-glow:rgba(20,184,166,0.25);
  --success:#10B981;
  --success-l:#34D399;
  --danger:#EF4444;
  --danger-l:#F87171;
  --warning:#F59E0B;
  --warning-l:#FBBF24;
  --radius:12px;
  --radius-lg:16px;
  --radius-xl:24px;
  --nav-h:70px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
  --shadow:0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.12);
  --ease:cubic-bezier(0.4,0,0.2,1);
}

html,body{
  background:var(--bg-0);
  color:var(--text);
  min-height:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body{padding-bottom:calc(var(--nav-h) + 20px)}

/* ─── UTILITY ─── */
.hidden{display:none !important}
.flex{display:flex}
.flex-center{display:flex;align-items:center;justify-content:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.text-muted{color:var(--text-muted)}
.text-dim{color:var(--text-dim)}
.text-center{text-align:center}
.bold{font-weight:600}
.num-mono{font-family:'JetBrains Mono',monospace}

/* ─── LOGIN ─── */
.login-screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:2000;
  background:var(--bg-0);
}
.login-card{
  width:100%;max-width:400px;
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  padding:32px 24px;
  box-shadow:var(--shadow-lg);
}
.login-logo{
  width:72px;height:72px;
  margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;
  background:var(--primary);
  border-radius:20px;
  color:#fff;
  overflow:hidden;
}
.login-logo img{width:100%;height:100%;object-fit:contain}
.login-card h1{
  font-size:24px;font-weight:700;
  text-align:center;
  color:var(--text);
  margin-bottom:6px;
}
.login-card .subtitle{
  text-align:center;
  color:var(--text-muted);
  font-size:13.5px;
  margin-bottom:24px;
}
.input-group{margin-bottom:16px}
.input-group label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--text);
  margin-bottom:6px;
}
.input-group input,
.input-group select,
.input-group textarea{
  width:100%;
  padding:12px 14px;
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  outline:none;
  transition:all .15s ease;
}
.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-glow);
}
.input-group input::placeholder,
.input-group textarea::placeholder{color:var(--text-dim)}

.checkbox-row{
  display:flex;align-items:center;gap:10px;
  margin:14px 0 18px;
  color:var(--text-muted);
  font-size:14px;
  cursor:pointer;
  user-select:none;
}
.checkbox-row input[type="checkbox"]{
  width:18px;height:18px;
  accent-color:var(--primary);
  cursor:pointer;
}

.btn-primary{
  width:100%;
  padding:14px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:600;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s ease;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(0.98)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}

.btn-secondary{
  width:100%;
  padding:14px;
  background:transparent;
  color:var(--text-muted);
  font-size:14px;
  font-weight:500;
  border:1px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  font-family:inherit;
  margin-top:10px;
  transition:all .15s ease;
}
.btn-secondary:hover{background:var(--bg-1);color:var(--text)}

.login-footer{
  margin-top:20px;
  text-align:center;
  color:var(--text-dim);
  font-size:12px;
}

/* ─── HEADER ─── */
.app-header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--bg-0);
  border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  background:var(--primary);
  border-radius:8px;
  color:#fff;
  overflow:hidden;
}
.header-logo img{width:100%;height:100%;object-fit:contain}
.header-title{font-size:15px;font-weight:700}
.online-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--success-l);
  margin-left:2px;
}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text-muted);
  font-size:16px;
  cursor:pointer;
  position:relative;
  transition:all .15s ease;
}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}
.bell-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:16px;height:16px;
  padding:0 4px;
  background:var(--danger);
  color:#fff;
  font-size:9px;font-weight:700;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.user-avatar{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:50%;
  font-size:13px;font-weight:700;
  cursor:pointer;
  color:var(--text);
}
.logout-link{
  color:var(--danger);
  font-size:13px;font-weight:500;
  cursor:pointer;
  padding:8px 10px;
  border-radius:8px;
}
.logout-link:hover{background:rgba(239,68,68,0.08)}

/* ─── MAIN CONTENT ─── */
.app-content{
  padding:16px;
  max-width:100%;
  margin:0 auto;
}

/* ─── CARDS ─── */
.card{
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  transition:all .15s ease;
}
.card:hover{box-shadow:var(--shadow);border-color:var(--border-2)}

.card-title{
  font-size:16px;font-weight:600;
  margin-bottom:6px;
  display:flex;align-items:center;gap:8px;
  color:var(--text);
}
.card-sub{color:var(--text-muted);font-size:13.5px;line-height:1.5}

/* ─── BADGES ─── */
.badge{
  display:inline-flex;align-items:center;
  padding:3px 10px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:20px;
  font-size:11.5px;font-weight:500;
  color:var(--text-muted);
  white-space:nowrap;
}
.badge-primary{background:rgba(20,184,166,0.1);border-color:rgba(20,184,166,0.3);color:var(--primary)}
.badge-success{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#059669}
.badge-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#DC2626}
.badge-warning{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:#D97706}

/* ─── BUTTONS ─── */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-sm{
  padding:8px 14px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:13px;font-weight:500;
  font-family:inherit;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s ease;
  white-space:nowrap;
}
.btn-sm:hover{background:var(--bg-2);border-color:var(--border-2)}
.btn-sm:active{transform:scale(0.97)}
.btn-sm:disabled{opacity:0.5;cursor:not-allowed}

.btn-accent{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-accent:hover{filter:brightness(1.08)}
.btn-success{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#059669}
.btn-success:hover{background:rgba(16,185,129,0.2)}
.btn-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#DC2626}
.btn-danger:hover{background:rgba(239,68,68,0.2)}
.btn-block{width:100%;justify-content:center;padding:12px}

/* ─── BIG BUTTONS ─── */
.big-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:var(--radius-lg);
  font-family:inherit;
  font-size:16px;font-weight:600;
  color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:12px;
  transition:all .15s ease;
  background:var(--primary);
}
.big-btn:hover{filter:brightness(1.08)}
.big-btn:active{transform:scale(0.98)}
.big-btn-draw{background:#10B981}
.big-btn-emergency{background:#EF4444}

/* ─── BOTTOM NAV ─── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg-0);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px 10px;
  z-index:100;
  overflow-x:auto;
}
.nav-item{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  padding:6px 6px;
  min-width:52px;
  color:var(--text-dim);
  font-size:10px;font-weight:500;
  cursor:pointer;
  border-radius:8px;
  transition:all .15s ease;
  flex-shrink:0;
}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item.active{color:var(--primary);background:rgba(20,184,166,0.1)}

/* ─── TOAST ─── */
.toast{
  position:fixed;top:70px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  min-width:240px;max-width:90vw;
  padding:12px 18px;
  background:var(--text);
  color:var(--bg-0);
  border-radius:10px;
  font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);
  z-index:3000;
  opacity:0;
  pointer-events:none;
  transition:all .2s ease;
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#10B981;color:#fff}
.toast.error{background:#EF4444;color:#fff}
.toast.warning{background:#F59E0B;color:#fff}

/* ─── MODAL ─── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.5);
  z-index:1000;
  display:none;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal-sheet{
  width:100%;
  max-width:640px;
  max-height:92vh;
  overflow-y:auto;
  background:var(--bg-0);
  border-radius:20px 20px 0 0;
  padding:20px 18px 30px;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0.8}to{transform:translateY(0);opacity:1}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.modal-header h2{font-size:18px;font-weight:600;flex:1}
.modal-close{
  width:36px;height:36px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:50%;
  color:var(--text-muted);
  font-size:16px;
  cursor:pointer;
  font-family:inherit;
}
.modal-close:hover{background:var(--bg-2);color:var(--text)}

/* ─── SEARCH BAR ─── */
.search-bar{
  width:100%;
  padding:11px 14px;
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:40px;
  color:var(--text);
  font-size:13.5px;
  font-family:inherit;
  outline:none;
  margin-bottom:12px;
}
.search-bar:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}

/* ─── TAB BAR ─── */
.tab-bar{
  display:flex;gap:6px;
  overflow-x:auto;
  padding:4px 0 10px;
  margin-bottom:8px;
  scrollbar-width:none;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:40px;
  color:var(--text-muted);
  font-size:13px;font-weight:500;
  font-family:inherit;
  cursor:pointer;
  white-space:nowrap;
}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* ─── PROGRESS ─── */
.progress-bar{
  height:6px;
  background:var(--bg-2);
  border-radius:6px;
  overflow:hidden;
  margin:8px 0;
}
.progress-fill{
  height:100%;
  background:var(--primary);
  border-radius:6px;
  transition:width .3s ease;
}

/* ─── LIST ROWS ─── */
.list-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:8px;
  transition:all .15s ease;
}
.list-row:hover{background:var(--bg-1);border-color:var(--border-2)}

/* ─── STAT BOX ─── */
.stat-box{
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 10px;
  text-align:center;
}
.stat-box .num{font-size:24px;font-weight:700;line-height:1.1;color:var(--text)}
.stat-box .lbl{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em}

/* ─── STEP LIST ─── */
.step-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}
.step-item:last-child{border-bottom:none}
.step-check{
  width:24px;height:24px;
  flex-shrink:0;
  border:2px solid var(--border-2);
  border-radius:8px;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
  color:transparent;
  cursor:pointer;
}
.step-check.done{background:var(--success);border-color:var(--success);color:#fff}
.step-content{flex:1}
.step-title{font-size:14px;font-weight:500}
.step-time{font-size:11px;color:var(--success);margin-top:3px}

/* ─── EMERGENCY CARD ─── */
.emergency-card{
  background:var(--bg-0);
  border:1px solid var(--border);
  border-left:3px solid #EF4444;
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
}
.emergency-card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.emergency-steps{list-style:none;color:var(--text-muted);font-size:13px;line-height:1.6}
.emergency-steps li{padding-left:14px;position:relative;margin-bottom:4px}
.emergency-steps li::before{content:'●';position:absolute;left:0;color:#EF4444;font-size:7px;top:6px}

/* ─── EMPTY STATE ─── */
.empty-state{
  text-align:center;
  padding:30px 16px;
  color:var(--text-muted);
}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:0.4}
.empty-state .icon + div{font-size:13px}

/* ─── AVATAR ─── */
.avatar{
  width:38px;height:38px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:50%;
  font-weight:600;
  font-size:13px;
  color:var(--text);
}

/* ─── DIVIDER ─── */
.divider{height:1px;background:var(--border);margin:14px 0}

/* ─── ROSTER TABLE ─── */
.roster-table{width:100%;border-collapse:collapse;font-size:11px}
.roster-table th{padding:8px 4px;color:var(--text-dim);font-weight:600;font-size:10px;text-transform:uppercase;text-align:center}
.roster-table th:first-child{text-align:left}
.roster-table td{padding:6px 4px;text-align:center;border-top:1px solid var(--border);font-size:11px}
.roster-table td:first-child{text-align:left;font-weight:500;white-space:nowrap}
.shift-pill{display:inline-block;padding:3px 6px;border-radius:5px;font-size:9.5px;font-weight:600;color:#fff;min-width:22px}
.shift-M{background:#10B981}
.shift-E{background:#6366F1}
.shift-N{background:#8B5CF6}
.shift-N12{background:#EC4899}
.shift-E4{background:#3B82F6}
.shift-D{background:#EC4899}
.shift-X{background:#6B7280}
.shift-OFF{background:#374151}
.shift-PH{background:#F59E0B}

/* ─── DESKTOP SIDEBAR ─── */
@media (min-width:1024px){
  body{padding-bottom:0}
  .app-header{padding:12px 24px}
  .bottom-nav{display:none !important}
  
  .kih-sidebar{
    display:flex !important;
    position:fixed;top:60px;left:0;bottom:0;width:220px;
    background:var(--bg-0);
    border-right:1px solid var(--border);
    flex-direction:column;padding:16px 10px;
    z-index:90;overflow-y:auto;
  }
  .kih-sidebar-logo{
    display:flex;align-items:center;gap:10px;
    padding:6px 10px 16px;border-bottom:1px solid var(--border);
    margin-bottom:10px;
  }
  .kih-sidebar-logo-icon{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:var(--primary);border-radius:8px;
    font-size:18px;color:#fff;overflow:hidden;
  }
  .kih-sidebar-logo-text{font-size:14px;font-weight:700;line-height:1.2}
  .kih-sidebar-logo-text small{display:block;font-size:10px;font-weight:400;color:var(--text-muted);margin-top:1px}
  
  .kih-sidebar-nav{display:flex;flex-direction:column;gap:2px}
  .kih-nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:8px;
    color:var(--text-muted);font-size:13.5px;font-weight:500;
    cursor:pointer;transition:all .15s ease;
  }
  .kih-nav-item:hover{background:var(--bg-1);color:var(--text)}
  .kih-nav-item.active{background:var(--primary);color:#fff}
  .kih-nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}

  return new Date(date).toLocaleDateString('en-PK', { weekday: 'long' });
}

function isSunday(date) {
  return new Date(date).getDay() === 0;
}

function isHoliday(date, holidays = State.holidays) {
  const key = typeof date === 'string' ? date : new Date(date).toISOString().split('T')[0];
  return holidays.some(h => h.date === key);
}

function dateRange(start, end) {
  const dates = [];
  let cur = new Date(start);
  const last = new Date(end);
  while (cur <= last) {
    dates.push(cur.toISOString().split('T')[0]);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

  const p = name.trim().split(/\s+/);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function normalizeMobile(m) {
  if (!m) return '';
  let s = String(m).replace(/\D/g, '');
  if (s.startsWith('92')) s = '0' + s.slice(2);
  if (!s.startsWith('0')) s = '0' + s;
  return s;
}

  const s = normalizeMobile(m);
  if (s.length === 11) return `${s.slice(0,4)} ${s.slice(4)}`;

}

/* ─── LOCAL DB ─── */
const LocalDB = {
  KEY_PREFIX: 'kih_db_',
  get(key, def = []) {
    try {
      const raw = localStorage.getItem(this.KEY_PREFIX + key);
      return raw ? JSON.parse(raw) : def;
    } catch { return def; }
  },
  set(key, val) {
    try {
      localStorage.setItem(this.KEY_PREFIX + key, JSON.stringify(val));
      return true;
    } catch(e) { return false; }
  },
  push(key, item) {
    const arr = this.get(key, []);
    if (!item._id) item._id = uid();
    if (!item.createdAt) item.createdAt = Date.now();
    arr.push(item);
    this.set(key, arr);
    return item;
  },
  update(key, id, updates) {
    const arr = this.get(key, []);
    const idx = arr.findIndex(x => x._id === id);
    if (idx === -1) return null;
    arr[idx] = { ...arr[idx], ...updates, updatedAt: Date.now() };
    this.set(key, arr);
    return arr[idx];
  },
  remove(key, id) {
    const arr = this.get(key, []);
    const filtered = arr.filter(x => x._id !== id);
    this.set(key, filtered);
    return filtered;
  }
};

const SESSION_KEY = 'kih_session_v3';
const SESSION_TTL = 30 * 24 * 60 * 60 * 1000;

function saveSession(user) {
  const data = { user, expires: Date.now() + SESSION_TTL };
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  State.session = data;
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (Date.now() > d.expires) { localStorage.removeItem(SESSION_KEY); return null; }
    return d;
  } catch { return null; }
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  State.session = null;
  State.user = null;
}

function canManage() { return isAdmin() && !isGuest(); }
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   PART 2 — AUTH + LOAD DATA + RENDER + MODALS
   ═══════════════════════════════════════════════════════════ */

/* ─── AUTH: LOGIN ─── */
async function doLogin() {
  const mobileInput = $('loginMobile');
  const passwordInput = $('loginPassword');
  const keep = $('keepSignedIn');
  const btn = $('loginBtn');
  
  if (!mobileInput || !passwordInput) return;
  
  const mobile = normalizeMobile(mobileInput.value.trim());
  const password = passwordInput.value.trim();
  
  if (!mobile || mobile.length < 10) { toast('Enter valid mobile number', 'error'); return; }
  if (!password) { toast('Enter password', 'error'); return; }
  
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span><span>Signing in...</span>';
  }
  
  let staffList = LocalDB.get('staff', []);
  if (staffList.length === 0) {
    LocalDB.set('staff', [DEFAULT_ADMIN]);
    staffList = [DEFAULT_ADMIN];
  }
  
  const user = staffList.find(s => 
    normalizeMobile(s.mobile) === mobile && 
    s.password === password && 
    s.active !== false
  );
  
  if (!user) {
    toast('Invalid mobile or password', 'error');
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<span>🔓</span><span>Sign In</span>';
    }
    return;
  }
  
  State.user = user;
  if (keep && keep.checked) saveSession(user);
  else clearSession();
  
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<span>🔓</span><span>Sign In</span>';
  }
  
  showApp();
  toast(`Welcome, ${user.name.split(' ')[0]}!`, 'success');
}

function doGuestLogin() {
  const guest = {
    _id: 'guest_' + Date.now(),
    name: 'Guest User',
    mobile: '0000000000',
    designation: 'phleb',
    role: 'staff',
    guest: true,
    active: true
  };
  State.user = guest;
  clearSession();
  showApp();
  toast('Continuing as guest');
}

function doLogout() {
  if (!confirm('Logout from the app?')) return;
  clearSession();
  State.user = null;
  
  const loginScreen = $('loginScreen');
  const appHeader = $('appHeader');
  const appContent = $('appContent');
  const bottomNav = $('bottomNav');
  const sidebar = $('kihSidebar');
  
  if (loginScreen) loginScreen.style.display = 'flex';
  if (appHeader) appHeader.classList.add('hidden');
  if (appContent) appContent.classList.add('hidden');
  if (bottomNav) bottomNav.classList.add('hidden');
  if (sidebar) sidebar.remove();
  
  const mobileInput = $('loginMobile');
  const passwordInput = $('loginPassword');
  if (mobileInput) mobileInput.value = '03001234567';
  if (passwordInput) passwordInput.value = '';
  
  toast('Logged out');
}

/* ─── SHOW APP ─── */
function showApp() {
  const loginScreen = $('loginScreen');
  const appHeader = $('appHeader');
  const appContent = $('appContent');
  const bottomNav = $('bottomNav');
  
  if (loginScreen) loginScreen.style.display = 'none';
  if (appHeader) appHeader.classList.remove('hidden');
  if (appContent) appContent.classList.remove('hidden');
  if (bottomNav) bottomNav.classList.remove('hidden');
  
  const initials = getInitials(State.user?.name || 'User');
  const avatar = $('userAvatar');
  if (avatar) {
    avatar.textContent = initials;
    avatar.title = State.user?.name || 'User';
  }
  
  updateOnlineDot();
  loadInitialData();
  applyLogo();
  render();
  
  if (window.innerWidth >= 1024) setTimeout(buildSidebar, 100);
}

function updateOnlineDot() {
  const dot = $('onlineDot');
  if (!dot) return;
  dot.style.background = navigator.onLine ? 'var(--success-l)' : 'var(--danger)';
}

function applyLogo() {
  const logo = localStorage.getItem('kih_hospital_logo');
  if (!logo) return;
  const loginLogo = $('loginLogo');
  if (loginLogo) loginLogo.innerHTML = `<img src="${logo}">`;
  const headerLogo = $('headerLogo');
  if (headerLogo) headerLogo.innerHTML = `<img src="${logo}">`;
  const sidebarLogoIcon = document.querySelector('.kih-sidebar-logo-icon');
  if (sidebarLogoIcon) sidebarLogoIcon.innerHTML = `<img src="${logo}">`;
}

/* ─── LOAD INITIAL DATA ─── */
function loadInitialData() {
  let staff = LocalDB.get('staff', []);
  if (staff.length === 0) {
    LocalDB.set('staff', [DEFAULT_ADMIN]);
    staff = [DEFAULT_ADMIN];
  }
  State.staff = staff;
  
  let tests = LocalDB.get('tests', []);
  if (tests.length === 0) { tests = getDefaultTests(); LocalDB.set('tests', tests); }
  State.tests = tests;
  
  let emergency = LocalDB.get('emergency', []);
  if (emergency.length === 0) { emergency = getDefaultEmergency(); LocalDB.set('emergency', emergency); }
  State.emergencyCards = emergency;
  
  let difficult = LocalDB.get('difficult', []);
  if (difficult.length === 0) { difficult = getDefaultDifficult(); LocalDB.set('difficult', difficult); }
  State.difficultDraws = difficult;
  
  let scripts = LocalDB.get('scripts', []);
  if (scripts.length === 0) { scripts = getDefaultScripts(); LocalDB.set('scripts', scripts); }
  State.scripts = scripts;
  
  let policies = LocalDB.get('policies', []);
  if (policies.length === 0) { policies = getDefaultPolicies(); LocalDB.set('policies', policies); }
  State.policies = policies;
  
  let shifts = LocalDB.get('shiftsSimple', []);
  if (shifts.length === 0) { shifts = JSON.parse(JSON.stringify(DEFAULT_SHIFTS)); LocalDB.set('shiftsSimple', shifts); }
  State.shiftsSimple = shifts;
  
  State.historyForms = LocalDB.get('historyForms', []);
  State.notifications = LocalDB.get('notifications', []);
  State.swapRequests = LocalDB.get('swaps', []);
  State.leaveRequests = LocalDB.get('leave', []);
  State.attendance = LocalDB.get('attendance', []);
  State.cplActivities = LocalDB.get('cpl', []);
  State.rejections = LocalDB.get('rejections', []);
  State.holidays = LocalDB.get('holidays', []);
  
  State.unreadCount = State.notifications.filter(n => !n.read).length;
  updateBell();
}

function updateBell() {
  const b = $('bellBadge');
  if (!b) return;
  if (State.unreadCount > 0) {
    b.textContent = State.unreadCount > 99 ? '99+' : State.unreadCount;
    b.classList.remove('hidden');
  } else {
    b.classList.add('hidden');
  }
}

/* ─── MODAL CORE ─── */
function openModal(html) {
  const sheet = $('modalSheet');
  const overlay = $('modalOverlay');
  if (!sheet || !overlay) return;
  sheet.innerHTML = html;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const overlay = $('modalOverlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

window.closeModal = closeModal;

document.addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ─── RENDER ─── */
function render() {
  const main = $('appContent');
  if (!main) return;
  
  $$('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === State.activeTab);
  });
  
  const renderers = {
    home: renderHome,
    tests: renderTests,
    protocols: renderProtocols,
    roster: renderRoster,
    swap: renderSwap,
    learn: renderLearn,
    attend: renderAttend,
    cpl: renderCPL,
    more: renderMore
  };
  
  const fn = renderers[State.activeTab] || renderHome;
  main.innerHTML = fn();
  
  attachHandlers();
  window.scrollTo(0, 0);
}

function attachHandlers() {
  $$('.nav-item').forEach(el => {
    el.onclick = () => {
      State.activeTab = el.dataset.tab;
      render();
      if (window.innerWidth >= 1024) {
        const sidebar = document.getElementById('kihSidebar');
        if (sidebar) {
          sidebar.querySelectorAll('.kih-nav-item').forEach(x => 
            x.classList.toggle('active', x.dataset.tab === State.activeTab)
          );
        }
      }
    };
  });
  
  $$('[data-quick]').forEach(el => {
    el.onclick = () => {
      const q = el.dataset.quick;
      State.activeTab = 'protocols';
      State.protocolTab = q;
      render();
    };
  });
  
  $$('[data-ptab]').forEach(el => {
    el.onclick = () => {
      State.protocolTab = el.dataset.ptab;
      render();
    };
  });
}

function filterItems(cls, q) {
  const query = q.toLowerCase();
  $$('.' + cls).forEach(el => {
    el.style.display = el.dataset.name.includes(query) ? 'block' : 'none';
  });
}

/* ─── HOME ─── */

    <button class="big-btn big-btn-draw" onclick="State.activeTab='roster';render()">

/* ─── TESTS ─── */
function getTubeIcon(tubeName) {
  const name = (tubeName || '').toLowerCase();
  const tubeSVG = (capColor, bodyColor = '#f0f0f0') => `
    <svg width="28" height="56" viewBox="0 0 32 64" fill="none">
      <rect x="4" y="0" width="24" height="10" rx="3" fill="${capColor}"/>
      <rect x="4" y="10" width="24" height="52" rx="4" stroke="#4B5563" stroke-width="1.5" fill="rgba(255,255,255,0.05)"/>
      <rect x="6" y="32" width="20" height="28" rx="3" fill="${bodyColor}" opacity="0.7"/>
      <rect x="7" y="14" width="3" height="40" rx="1.5" fill="rgba(255,255,255,0.15)"/>
    </svg>
  `;
  
  if (name.includes('edta') || name.includes('lavender')) return tubeSVG('#A78BFA', '#C4B5FD');
  if (name.includes('citrate') || name.includes('blue')) return tubeSVG('#60A5FA', '#93C5FD');
  if (name.includes('sst') || name.includes('gold')) return tubeSVG('#FBBF24', '#FDE68A');
  if (name.includes('heparin') || name.includes('green')) return tubeSVG('#10B981', '#6EE7B7');
  if (name.includes('fluoride') || name.includes('grey') || name.includes('gray')) return tubeSVG('#9CA3AF', '#D1D5DB');
  if (name.includes('plain') || name.includes('red')) return tubeSVG('#EF4444', '#FCA5A5');
  if (name.includes('culture')) return tubeSVG('#F3F4F6', '#FEF3C7');
  return tubeSVG('#6B7280', '#9CA3AF');
}

/* ─── PROTOCOLS ─── */
function renderProtocols() {
  const tabs = [
    { id: 'order', label: 'Order of Draw' },
    { id: 'difficult', label: 'Difficult Draw' },
    { id: 'scripts', label: 'Scripts' },
    { id: 'rejection', label: 'Rejection' }
  ];
  
  let body = '';

  else if (State.protocolTab === 'difficult') body = renderDifficultDraw();
  else if (State.protocolTab === 'scripts') body = renderScripts();
  else if (State.protocolTab === 'rejection') body = renderRejection();
  
  return `
    <div class="tab-bar">
      ${tabs.map(t => `<div class="tab ${State.protocolTab===t.id?'active':''}" data-ptab="${t.id}">${t.label}</div>`).join('')}

}

function copyToClipboard(text, msg) {
  navigator.clipboard.writeText(text).then(() => toast(msg, 'success')).catch(() => toast('Copy failed', 'error'));
}

/* ─── ROSTER ─── */
function renderRoster() {
  const hasRoster = State.rosterData && Object.keys(State.rosterData).length > 0;
  
  return `
    <div class="card">
      <div class="flex-between">
        <div class="card-title">📅 Roster</div>
        <button class="btn-sm btn-accent" onclick="openAutoGenWizard()">⚡ Auto Generate</button>
      </div>
      <div class="card-sub">${State.rosterPeriod ? `${fmtDisplay(State.rosterPeriod.start)} → ${fmtDisplay(State.rosterPeriod.end)}` : 'No roster yet'}</div>
    </div>
    
    ${hasRoster ? renderRosterGrid() : renderEmptyRoster()}
  `;
}

function renderEmptyRoster() {
  return `
    <div class="card">
      <div class="empty-state">
        <div class="icon">📅</div>
        <div style="font-weight:600;margin-bottom:6px">No roster yet</div>
        <div style="font-size:13px">Tap "Auto Generate" to create this month's roster</div>
      </div>
    </div>
    
    ${DESIGNATIONS.map(d => {
      const count = State.staff.filter(s => s.designation === d.id && s.active !== false).length;
      return `
        <div class="card">
          <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
            <span style="font-size:20px">${d.icon}</span>
            <span>${d.name}</span>
            <span style="margin-left:auto;font-size:12px;color:var(--text-muted)">${count} staff</span>
          </div>
          <div style="font-size:13px;color:var(--text-muted);text-align:center;padding:16px">
            Roster not generated yet
          </div>
        </div>
      `;
    }).join('')}
  `;
}

function renderRosterGrid() {
  if (!State.rosterData || !State.rosterPeriod) return renderEmptyRoster();
  
  const dates = dateRange(State.rosterPeriod.start, State.rosterPeriod.end);
  const staffList = State.staff.filter(s => s.active !== false);
  
  const rosterStaffIds = new Set();
  dates.forEach(d => {
    Object.keys(State.rosterData[d] || {}).forEach(id => rosterStaffIds.add(id));
  });
  const displayStaff = staffList.filter(s => rosterStaffIds.has(s._id));
  
  return `
    <div class="card" style="padding:8px;overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px;min-width:${dates.length * 30 + 120}px">
        <thead>
          <tr style="background:var(--bg-1)">
            <th style="padding:8px 6px;text-align:left;border-bottom:1px solid var(--border);position:sticky;left:0;background:var(--bg-1);font-weight:600;font-size:11.5px;z-index:2">Staff</th>
            ${dates.map(d => {
              const isSun = isSunday(d);
              const isHol = isHoliday(d);
              return `
                <th style="padding:6px 2px;border-bottom:1px solid var(--border);font-weight:600;font-size:9.5px;text-align:center;${isSun || isHol ? 'background:rgba(245,158,11,0.1)' : ''}">
                  ${new Date(d).getDate()}<br>
                  <span style="font-size:8px;color:${isSun || isHol ? '#F59E0B' : 'var(--text-dim)'}">${dayShort(d).slice(0,2)}</span>
                </th>
              `;
            }).join('')}
          </tr>
        </thead>
        <tbody>
          ${displayStaff.map(staff => {
            const offCount = dates.filter(d => State.rosterData[d]?.[staff._id] === 'OFF').length;
            const phCount = dates.filter(d => State.rosterData[d]?.[staff._id] === 'PH').length;
            
            return `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:6px;font-size:11.5px;position:sticky;left:0;background:var(--bg-0);font-weight:500;white-space:nowrap;z-index:1">
                  ${esc(staff.name.split(' ')[0])}
                  <span style="font-size:9.5px;color:var(--text-dim);margin-left:4px">${offCount}O${phCount > 0 ? ' '+phCount+'P' : ''}</span>
                </td>
                ${dates.map(date => {
                  const code = State.rosterData[date]?.[staff._id] || 'X';
                  const colors = { M: '#10B981', E: '#6366F1', N: '#8B5CF6', N12: '#EC4899', E4: '#3B82F6', D: '#EC4899', X: '#6B7280', OFF: '#374151', PH: '#F59E0B', L: '#F43F5E' };
                  const color = colors[code] || '#6B7280';
                  return `<td style="padding:3px 1px;text-align:center"><span style="display:inline-block;padding:2px 4px;border-radius:4px;background:${color};color:#fff;font-size:9px;font-weight:600;min-width:20px">${code}</span></td>`;
                }).join('')}
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    </div>
    
    <div class="card">
      <div style="font-size:12px;font-weight:600;margin-bottom:10px">📖 Legend</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:11px">
        ${Object.entries({ M: 'Morning', E: 'Evening', N: 'Night', N12: 'Ext Night', E4: 'Short Eve', D: 'Day Duty', X: 'Standby', OFF: 'Off', PH: 'PH', L: 'Leave' }).map(([code, name]) => {
          const colors = { M: '#10B981', E: '#6366F1', N: '#8B5CF6', N12: '#EC4899', E4: '#3B82F6', D: '#EC4899', X: '#6B7280', OFF: '#374151', PH: '#F59E0B', L: '#F43F5E' };
          return `<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:${colors[code]}"></span>${code} = ${name}</span>`;
        }).join('')}
      </div>
    </div>
    
    <div class="btn-row">
      <button class="btn-sm" style="flex:1;justify-content:center;padding:10px" onclick="printRoster()">🖨️ Print</button>
      <button class="btn-sm" style="flex:1;justify-content:center;padding:10px" onclick="exportRosterCSV()">📥 CSV</button>
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:10px" onclick="openAutoGenWizard()">🔄 Regenerate</button>
    </div>
  `;
}

/* ─── SWAP ─── */
function renderSwap() {
  const pending = State.swapRequests.filter(s => s.status === 'pending');
  const approved = State.swapRequests.filter(s => s.status === 'approved');
  const rejected = State.swapRequests.filter(s => s.status === 'rejected');
  
  return `
    <div class="card">
      <div class="flex-between">
        <div class="card-title">🔄 Shift Swap</div>
        <button class="btn-sm btn-accent" onclick="openSwapModal()">+ New</button>
      </div>
    </div>
    
    ${pending.length > 0 ? `<div class="card"><div class="card-title" style="font-size:14px">⏳ Pending (${pending.length})</div>${pending.map(s => renderSwapItem(s)).join('')}</div>` : ''}
    ${approved.length > 0 ? `<div class="card"><div class="card-title" style="font-size:14px">✅ Approved (${approved.length})</div>${approved.map(s => renderSwapItem(s)).join('')}</div>` : ''}
    ${rejected.length > 0 ? `<div class="card"><div class="card-title" style="font-size:14px">❌ Rejected (${rejected.length})</div>${rejected.map(s => renderSwapItem(s)).join('')}</div>` : ''}
    
    ${State.swapRequests.length === 0 ? `
      <div class="card">
        <div class="empty-state">
          <div class="icon">🔄</div>
          <div style="font-weight:600;margin-bottom:6px">No swap requests</div>
          <div>Tap "+ New" to create a swap request</div>
        </div>
      </div>
    ` : ''}
  `;
}

function renderSwapItem(s) {
  const badgeClass = s.status === 'approved' ? 'badge-success' : s.status === 'rejected' ? 'badge-danger' : 'badge-warning';
  const canApprove = isAdmin() && s.status === 'pending';
  
  return `
    <div class="list-row" style="flex-direction:column;align-items:stretch;gap:8px;padding:12px">
      <div class="flex-between">
        <span style="font-weight:600;font-size:14px">${esc(s.from)} → ${esc(s.to)}</span>
        <span class="badge ${badgeClass}">${esc(s.status)}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text-muted)">
        👤 ${esc(s.requestedBy || 'Unknown')} · with ${esc(s.with || 'Unknown')}
      </div>
      ${canApprove ? `
        <div class="btn-row" style="margin-top:0">
          <button class="btn-sm btn-success" onclick="approveSwap('${s._id}')">✅ Approve</button>
          <button class="btn-sm btn-danger" onclick="rejectSwap('${s._id}')">❌ Reject</button>
        </div>
      ` : ''}
    </div>
  `;
}

/* ─── LEARN ─── */
function renderLearn() {
  return `
    <div class="card">
      <div class="card-title">📚 Training Quizzes</div>
      <div class="card-sub">Test your phlebotomy knowledge</div>
      <div class="mt12">
        <div class="list-row">
          <div><div style="font-weight:600;font-size:14px">Order of Draw</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">10 questions</div></div>
          <span class="badge">New</span>
        </div>
        <div class="list-row">
          <div><div style="font-weight:600;font-size:14px">Difficult Draw</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">10 questions</div></div>
          <span class="badge">New</span>
        </div>
        <div class="list-row">
          <div><div style="font-weight:600;font-size:14px">Emergency Response</div><div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">10 questions</div></div>
          <span class="badge">New</span>
        </div>
      </div>
      <button class="btn-sm btn-accent btn-block mt12" onclick="openQuizModal()">▶ Start Quiz</button>
    </div>
  `;
}

/* ─── ATTEND ─── */
function renderAttend() {
  const today = new Date().toDateString();
  const todayRec = State.attendance.find(a => a.date === today && a.staffId === State.user?._id);
  const history = State.attendance.filter(a => a.staffId === State.user?._id).slice(-7).reverse();
  
  return `
    <div class="card">
      <div class="card-title">✅ Attendance</div>
      <div class="card-sub">${fmtDate()}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
        <button class="btn-sm btn-success btn-block" ${todayRec?'disabled':''} onclick="markAttendance('present')">🟢 Present</button>
        <button class="btn-sm btn-danger btn-block" ${todayRec?'disabled':''} onclick="markAttendance('absent')">🔴 Absent</button>
      </div>
      ${todayRec ? `<div class="list-row mt12"><span>Today</span><span class="badge ${todayRec.status==='present'?'badge-success':'badge-danger'}">${esc(todayRec.status)}</span></div>` : ''}
    </div>
    
    <div class="card">
      <div class="card-title" style="font-size:14px">📅 Recent</div>
      ${history.length === 0 
        ? '<div class="empty-state" style="padding:20px"><div style="font-size:13px">No records yet</div></div>'
        : history.map(a => `<div class="list-row"><span style="font-size:13px">${esc(a.date)}</span><span class="badge ${a.status==='present'?'badge-success':'badge-danger'}">${esc(a.status)}</span></div>`).join('')
      }
    </div>
  `;
}

function markAttendance(status) {
  const rec = {
    _id: uid(),
    date: new Date().toDateString(),
    status,
    staffId: State.user?._id,
    staff: State.user?.name || 'User',
    time: fmtTime(),
    createdAt: Date.now()
  };
  LocalDB.push('attendance', rec);
  State.attendance.push(rec);
  render();
  toast('Marked ' + status, 'success');
}

/* ─── CPL ─── */
function renderCPL() {
  const myActivities = State.cplActivities.filter(a => a.staffId === State.user?._id);
  const total = myActivities.reduce((s, a) => s + (+a.credits || 0), 0);
  const goal = 40;
  const pct = Math.min(100, (total / goal) * 100);
  
  return `
    <div class="card">
      <div class="card-title">📈 CPL Tracker</div>
      <div class="flex-between mt12">
        <span style="font-size:13px">Credits earned</span>
        <strong class="num-mono">${total} / ${goal}</strong>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="mt16">
        ${myActivities.length === 0 
          ? '<div class="empty-state" style="padding:20px"><div style="font-size:13px">No activities yet</div></div>'
          : myActivities.map(a => `
            <div class="list-row">
              <div>
                <div style="font-weight:600;font-size:13.5px">${esc(a.title)}</div>
              </div>
              <span class="badge badge-success">+${esc(a.credits)}</span>
            </div>
          `).join('')
        }
      </div>
      <button class="btn-sm btn-accent btn-block mt12" onclick="openAddCPLModal()">+ Add Activity</button>
    </div>
  `;
}

/* ─── MORE ─── */
function renderMore() {
  return `
    <div class="card">
      <div class="card-title">⋯ More</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        ${canManage() ? `
          <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openManageContentModal()">
            <span style="margin-right:10px">⚙️</span> Manage Content
          </button>
        ` : ''}
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openHistoryFormsModal()">
          <span style="margin-right:10px">📁</span> History Forms
        </button>
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openStaffManagementModal()">
          <span style="margin-right:10px">👥</span> Staff Management
        </button>
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openLeaveModal()">
          <span style="margin-right:10px">🏖️</span> Leave Management
        </button>
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openPoliciesModal()">
          <span style="margin-right:10px">📜</span> Policies
        </button>
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openTATModal()">
          <span style="margin-right:10px">⏱️</span> Report Timing
        </button>
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openNotificationsModal()">
          <span style="margin-right:10px">🔔</span> Notifications
        </button>
        <button class="btn-sm btn-block" style="justify-content:flex-start;padding:12px 14px" onclick="openSettingsModal()">
          <span style="margin-right:10px">⚙️</span> Settings & Setup
        </button>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title">ℹ️ About</div>
      <div class="card-sub mt8">
        KIH Phlebotomy Companion v3.0<br>
        Single-file · Demo Mode<br>
        ${State.user?.role === 'admin' ? '👑 Admin Access' : '👤 Staff Access'}
      </div>
    </div>
  `;
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   PART 3 — SHIFT MANAGEMENT + STAFF ASSIGNMENT + WIZARD
   ═══════════════════════════════════════════════════════════ */

/* ═══ SHIFT MANAGEMENT ═══ */
window.loadShiftsSimple = function() {
  let shifts = LocalDB.get('shiftsSimple', []);
  if (shifts.length === 0 || shifts[0].staffMonFri === undefined) {
    shifts = JSON.parse(JSON.stringify(DEFAULT_SHIFTS));
    LocalDB.set('shiftsSimple', shifts);
  }
  State.shiftsSimple = shifts;
  return shifts;
};

window.saveShiftsSimple = function(shifts) {
  LocalDB.set('shiftsSimple', shifts);
  State.shiftsSimple = shifts;
};

window.openShiftManagement = function() {
  if (!canManage()) { toast('Admin only', 'error'); return; }
  const shifts = State.shiftsSimple || loadShiftsSimple();
  
  openModal(`
    <div class="modal-header">
      <h2>⚙️ Shift Management</h2>
      <button class="modal-close" onclick="openManageContentModal()">✕</button>
    </div>
    
    <div style="background:var(--bg-1);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);line-height:1.5">
      Configure timings and staff requirements for <strong>Mon-Fri</strong>, <strong>Saturday</strong>, and <strong>Sunday/Holiday</strong>.
    </div>
    
    <button class="btn-sm btn-accent btn-block mb12" style="justify-content:center;padding:12px" onclick="openAddShiftModal()">
      + Add New Shift
    </button>
    
    ${shifts.map(s => `
      <div class="list-row" style="flex-direction:column;align-items:stretch;gap:10px;padding:14px;margin-bottom:8px">
        <div class="flex-between">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:12px;height:12px;border-radius:50%;background:${s.color}"></div>
            <div>
              <div style="font-weight:600;font-size:14px">
                ${esc(s.name)} <span style="color:var(--text-dim);font-size:11px">(${esc(s.code)})</span>
                ${s.isSpecial ? '<span class="badge badge-warning" style="font-size:9px;padding:2px 6px;margin-left:4px">SPECIAL</span>' : ''}
              </div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:3px">
                ${s.start !== '-' ? `🕐 ${esc(s.start)} – ${esc(s.end)} · ${s.duration}h` : 'No timing'}
                ${s.gender !== 'Any' ? ` · ${s.gender} only` : ''}
              </div>
            </div>
          </div>
        </div>
        
        ${!['X','OFF','PH'].includes(s.code) ? `
          <div style="background:var(--bg-1);border-radius:8px;padding:10px;font-size:11.5px">
            <div style="color:var(--text-dim);font-size:10.5px;font-weight:600;margin-bottom:6px">REQUIREMENTS</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">
              <div>
                <div style="color:var(--text-dim);font-size:10px">Mon-Fri</div>
                <div style="font-weight:700;font-size:16px;color:#3B82F6">${s.staffMonFri || 0}</div>
              </div>
              <div>
                <div style="color:var(--text-dim);font-size:10px">Saturday</div>
                <div style="font-weight:700;font-size:16px;color:#F59E0B">${s.staffSat || 0}</div>
              </div>
              <div>
                <div style="color:var(--text-dim);font-size:10px">Sun/Hol</div>
                <div style="font-weight:700;font-size:16px;color:#EF4444">${s.staffSun || 0}</div>
              </div>
            </div>
          </div>
        ` : ''}
        
        <div class="btn-row" style="margin-top:0">
          <button class="btn-sm" onclick="openEditShiftModal('${s._id}')">✏️ Edit</button>
          <button class="btn-sm btn-danger" onclick="deleteShiftSimple('${s._id}')">🗑️ Delete</button>
        </div>
      </div>
    `).join('')}
    
    <div class="btn-row mt12">
      <button class="btn-sm" style="flex:1;justify-content:center;padding:12px" onclick="resetShiftsDefault()">
        🔄 Reset to Defaults
      </button>
    </div>
  `);
};

window.openAddShiftModal = function() {
  const shifts = State.shiftsSimple || loadShiftsSimple();
  const usedCodes = shifts.map(s => s.code).join(', ');
  
  openModal(`
    <div class="modal-header">
      <h2>+ Add New Shift</h2>
      <button class="modal-close" onclick="openShiftManagement()">✕</button>
    </div>
    
    <div class="input-group">
      <label>Shift Code * (unique)</label>
      <input id="sh_code" placeholder="e.g. E2" maxlength="5" style="text-transform:uppercase">
      <div style="font-size:11px;color:var(--text-dim);margin-top:4px">Used: ${usedCodes}</div>
    </div>
    
    <div class="input-group">
      <label>Shift Name *</label>
      <input id="sh_name" placeholder="e.g. Extended Evening">
    </div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="input-group">
        <label>Start Time</label>
        <input id="sh_start" type="time" value="08:00">
      </div>
      <div class="input-group">
        <label>End Time</label>
        <input id="sh_end" type="time" value="16:00">
      </div>
    </div>
    
    <div class="input-group">
      <label>Color</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="sh_color_row">
        ${['#10B981','#6366F1','#8B5CF6','#EC4899','#3B82F6','#F59E0B','#EF4444','#6B7280'].map((c, i) => `
          <div class="sh-color-option" data-color="${c}" onclick="selectShiftColor('${c}')" style="width:36px;height:36px;border-radius:8px;background:${c};cursor:pointer;border:3px solid ${i === 0 ? 'var(--text)' : 'transparent'}"></div>
        `).join('')}
      </div>
      <input type="hidden" id="sh_color" value="#10B981">
    </div>
    
    <div class="input-group">
      <label>Gender Rule</label>
      <select id="sh_gender">
        <option>Any</option>
        <option>Male</option>
        <option>Female</option>
      </select>
    </div>
    
    <div class="divider"></div>
    <div style="font-size:13px;font-weight:600;margin-bottom:10px">📊 Staff Requirements</div>
    
    <div class="input-group">
      <label>🟦 Monday – Friday</label>
      <input id="sh_staffMonFri" type="number" min="0" max="50" value="0">
    </div>
    <div class="input-group">
      <label>🟨 Saturday</label>
      <input id="sh_staffSat" type="number" min="0" max="50" value="0">
    </div>
    <div class="input-group">
      <label>🟧 Sunday / Holiday</label>
      <input id="sh_staffSun" type="number" min="0" max="50" value="0">
    </div>
    
    <label class="checkbox-row">
      <input type="checkbox" id="sh_special">
      <span>Special Shift (on-demand only)</span>
    </label>
    
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px" onclick="saveNewShift()">💾 Save</button>
      <button class="btn-sm" onclick="openShiftManagement()">Cancel</button>
    </div>
  `);
};

window.selectShiftColor = function(color) {
  document.querySelectorAll('.sh-color-option').forEach(el => {
    el.style.border = el.dataset.color === color ? '3px solid var(--text)' : '3px solid transparent';
  });
  $('sh_color').value = color;
};

window.saveNewShift = function() {
  const code = $('sh_code').value.trim().toUpperCase();
  const name = $('sh_name').value.trim();
  const start = $('sh_start').value;
  const end = $('sh_end').value;
  const color = $('sh_color').value;
  const gender = $('sh_gender').value;
  const staffMonFri = parseInt($('sh_staffMonFri').value) || 0;
  const staffSat = parseInt($('sh_staffSat').value) || 0;
  const staffSun = parseInt($('sh_staffSun').value) || 0;
  const isSpecial = $('sh_special').checked;
  
  if (!code) { toast('Enter code', 'error'); return; }
  if (!name) { toast('Enter name', 'error'); return; }
  if (!/^[A-Z0-9]{1,5}$/.test(code)) { toast('Code: 1-5 chars', 'error'); return; }
  
  const shifts = State.shiftsSimple || loadShiftsSimple();
  if (shifts.find(s => s.code === code)) { toast('Code already exists', 'error'); return; }
  
  const startH = parseInt(start.split(':')[0]);
  const endH = parseInt(end.split(':')[0]);
  const duration = endH > startH ? endH - startH : (24 - startH) + endH;
  
  shifts.push({
    _id: 'sh_' + code + '_' + Date.now(),
    code, name, start, end, duration, color, gender,
    staffMonFri, staffSat, staffSun, isSpecial,
    active: true, createdAt: Date.now()
  });
  
  saveShiftsSimple(shifts);
  toast(`✅ ${name} added`, 'success');
  openShiftManagement();
};

window.updateShift = function(id) {
  const shifts = State.shiftsSimple || loadShiftsSimple();
  const idx = shifts.findIndex(x => x._id === id);
  if (idx === -1) return;
  
  const code = $('sh_code').value.trim().toUpperCase();
  const name = $('sh_name').value.trim();
  if (!code || !name) { toast('Fill required fields', 'error'); return; }
  if (shifts.find(s => s.code === code && s._id !== id)) { toast('Code already exists', 'error'); return; }
  
  const start = $('sh_start').value;
  const end = $('sh_end').value;
  const startH = parseInt(start.split(':')[0]);
  const endH = parseInt(end.split(':')[0]);
  const duration = endH > startH ? endH - startH : (24 - startH) + endH;
  
  shifts[idx] = {
    ...shifts[idx],
    code, name, start, end, duration,
    color: $('sh_color').value,
    gender: $('sh_gender').value,
    staffMonFri: parseInt($('sh_staffMonFri').value) || 0,
    staffSat: parseInt($('sh_staffSat').value) || 0,
    staffSun: parseInt($('sh_staffSun').value) || 0,
    isSpecial: $('sh_special').checked,
    updatedAt: Date.now()
  };
  
  saveShiftsSimple(shifts);
  toast('✅ Updated', 'success');
  openShiftManagement();
};

window.saveItem = function(type, id) {
  const isNew = !id;
  const getVal = (id) => { const el = $(id); return el ? el.value.trim() : ''; };
  
  let item = { _id: id || uid(), updatedAt: Date.now() };
  if (isNew) item.createdAt = Date.now();
  
  if (type === 'tests') {
    item.name = getVal('f_name'); item.tube = getVal('f_tube');
    item.order = +getVal('f_order') || 1; item.volume = getVal('f_volume');
    item.tat = getVal('f_tat'); item.urgent = getVal('f_urgent'); item.category = getVal('f_category');
    if (!item.name || !item.tube) { toast('Fill required fields', 'error'); return; }
  } else if (type === 'emergency') {
    item.title = getVal('f_title');
    item.steps = getVal('f_steps').split('\n').map(s => s.trim()).filter(Boolean);
    if (!item.title || item.steps.length === 0) { toast('Fill required fields', 'error'); return; }
  } else if (type === 'difficult') {
    item.title = getVal('f_title'); item.problem = getVal('f_problem'); item.solution = getVal('f_solution');
    if (!item.title || !item.problem || !item.solution) { toast('Fill all', 'error'); return; }
  } else if (type === 'scripts') {
    item.title = getVal('f_title'); item.en = getVal('f_en'); item.ur = getVal('f_ur');
    if (!item.title || !item.en) { toast('Fill required', 'error'); return; }
  } else if (type === 'policies') {
    item.title = getVal('f_title'); item.body = getVal('f_body');
    if (!item.title || !item.body) { toast('Fill required', 'error'); return; }
  }
  
  const key = type === 'emergency' ? 'emergency' : type === 'difficult' ? 'difficult' : type;
  let arr = LocalDB.get(key, []);
  
  if (isNew) arr.push(item);
  else {
    const idx = arr.findIndex(x => x._id === id);
    if (idx >= 0) arr[idx] = { ...arr[idx], ...item };
    else arr.push(item);
  }
  LocalDB.set(key, arr);
  
  if (type === 'tests') State.tests = arr;
  else if (type === 'emergency') State.emergencyCards = arr;
  else if (type === 'difficult') State.difficultDraws = arr;
  else if (type === 'scripts') State.scripts = arr;
  else if (type === 'policies') State.policies = arr;
  
  toast(isNew ? 'Added' : 'Updated', 'success');
  openManageList(type, '');
};

window.deleteItem = function(type, id) {
  if (!confirm('Delete this item?')) return;
  const key = type === 'emergency' ? 'emergency' : type === 'difficult' ? 'difficult' : type;
  let arr = LocalDB.get(key, []);
  arr = arr.filter(x => x._id !== id);
  LocalDB.set(key, arr);
  
  if (type === 'tests') State.tests = arr;
  else if (type === 'emergency') State.emergencyCards = arr;
  else if (type === 'difficult') State.difficultDraws = arr;
  else if (type === 'scripts') State.scripts = arr;
  else if (type === 'policies') State.policies = arr;
  
  toast('Deleted', 'success');
  openManageList(type, '');
};

window.updateSecondaryOptions = function() {
  const primary = $('s_primaryShift')?.value;
  if (!primary) return;
  const shifts = (State.shiftsSimple || loadShiftsSimple()).filter(s => !['X','OFF','PH'].includes(s.code));
  
  $$('.secondary-shift-row').forEach(row => {
    const code = row.dataset.shift;
    const checkbox = row.querySelector('input');
    const label = row.querySelector('span');
    const shift = shifts.find(s => s.code === code);
    if (!shift) return;
    
    if (code === primary) {
      checkbox.checked = false;
      checkbox.disabled = true;
      row.style.opacity = '0.4';
      label.innerHTML = `${shift.name} (${shift.code}) <span style="color:var(--text-dim);font-size:10px">(Primary)</span>`;
    } else {
      checkbox.disabled = false;
      row.style.opacity = '1';
      label.innerHTML = `${shift.name} (${shift.code})`;
    }
  });
  updateShiftPreview();
};

window.updateShiftPreview = function() {
  const primary = $('s_primaryShift')?.value || 'M';
  const secondary = Array.from($$('.s-secondary:checked')).map(el => el.value).filter(v => v !== primary);
  const shifts = (State.shiftsSimple || loadShiftsSimple()).filter(s => !['X','OFF','PH'].includes(s.code));
  const primaryShift = shifts.find(s => s.code === primary);
  
  let html = `<div style="font-weight:600;color:var(--primary);margin-bottom:8px">📋 Shift Priority</div>
    <div style="padding:8px 10px;background:rgba(20,184,166,0.12);border:1px solid var(--primary);border-radius:8px;margin-bottom:6px">
      <strong style="color:var(--primary)">1st:</strong> ${primaryShift ? primaryShift.name + ' (' + primaryShift.code + ')' : primary}
    </div>`;
  
  secondary.forEach((code, i) => {
    const s = shifts.find(x => x.code === code);
    const ord = i === 0 ? '2nd' : i === 1 ? '3rd' : (i + 2) + 'th';
    html += `<div style="padding:8px 10px;background:var(--bg-0);border:1px solid var(--border);border-radius:8px;margin-bottom:6px"><strong>${ord}:</strong> ${s ? s.name + ' (' + s.code + ')' : code}</div>`;
  });
  
  if (secondary.length === 0) html += `<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px">No secondary shifts</div>`;
  
  const previewEl = $('s_shiftPreview');
  if (previewEl) previewEl.innerHTML = html;
};

window.saveStaffV2 = function(desId, id) {
  const isNew = !id;
  const name = $('s_name').value.trim();
  const mobile = normalizeMobile($('s_mobile').value.trim());
  const password = $('s_password').value.trim();
  const primaryShift = $('s_primaryShift').value;
  const secondaryShifts = Array.from($$('.s-secondary:checked')).map(el => el.value).filter(v => v !== primaryShift);
  const station = $('s_station').value.trim();
  const notifications = $('s_notifications').checked;
  const adminEl = $('s_admin');
  const isAdmin = adminEl ? adminEl.checked : false;
  const specialOffDates = window._specialOffDates || [];
  
  if (!name) { toast('Enter name', 'error'); return; }
  if (!mobile || mobile.length !== 11) { toast('Enter valid 11-digit mobile', 'error'); return; }
  if (!primaryShift) { toast('Select primary shift', 'error'); return; }
  
  const existing = State.staff.find(s => normalizeMobile(s.mobile) === mobile && s._id !== id);
  if (existing) { toast('Mobile already registered', 'error'); return; }
  
  if (isNew && (!password || password.length < 6)) { toast('Password must be 6+ chars', 'error'); return; }
  
  let staff = LocalDB.get('staff', []);
  
  const staffData = {
    name, mobile, designation: desId,
    role: isAdmin ? 'admin' : 'staff',
    fixedShift: primaryShift, shift: primaryShift,
    multiShifts: secondaryShifts,
    specialOffDates, station, notifications, active: true
  };
  
  if (isNew) {
    const newStaff = { _id: uid(), ...staffData, password, createdAt: Date.now() };
    staff.push(newStaff);
    State.staff.push(newStaff);
  } else {
    const idx = staff.findIndex(x => x._id === id);
    const updates = { ...staffData };
    if (password && password.length >= 6) updates.password = password;
    if (idx >= 0) staff[idx] = { ...staff[idx], ...updates };
    const sidx = State.staff.findIndex(x => x._id === id);
    if (sidx >= 0) State.staff[sidx] = { ...State.staff[sidx], ...updates };
  }
  
  LocalDB.set('staff', staff);
  toast(isNew ? `✅ ${name} added` : `✅ Updated`, 'success');
  openDesignationSection(desId);
};

window.deleteStaff = function(id, desId) {
  if (!confirm('Delete this staff member?')) return;
  if (id === State.user?._id) { toast('Cannot delete yourself', 'error'); return; }
  let staff = LocalDB.get('staff', []);
  staff = staff.filter(x => x._id !== id);
  LocalDB.set('staff', staff);
  State.staff = State.staff.filter(x => x._id !== id);
  toast('Deleted', 'success');
  openDesignationSection(desId);
};

/* ═══ QUIZ ═══ */
window.openQuizModal = function() {
  const questions = [
    { q: 'What is the correct order of draw?', opts: ['EDTA → SST → Citrate', 'Blood Culture → Citrate → SST → Heparin → EDTA → Fluoride', 'SST → EDTA → Citrate', 'Fluoride → EDTA → SST'], ans: 1 },
    { q: 'Tourniquet should not be left on for more than:', opts: ['30 sec', '1 minute', '2 minutes', '5 minutes'], ans: 1 },
    { q: 'Which tube for CBC?', opts: ['SST Gold', 'EDTA Lavender', 'Citrate Blue', 'Fluoride Grey'], ans: 1 },
    { q: 'Angle for venipuncture:', opts: ['5-10°', '15-30°', '45°', '90°'], ans: 1 },
    { q: 'After needle stick injury, first action:', opts: ['Report supervisor', 'Wash with soap and water 5 min', 'Take PEP', 'Fill incident form'], ans: 1 }
  ];
  
  let idx = 0, score = 0;
  
  function renderQ() {
    if (idx >= questions.length) {
      $('modalSheet').innerHTML = `
        <div class="modal-header"><h2>Quiz Complete</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div style="text-align:center;padding:28px 0">
          <div style="font-size:56px">${score >= questions.length * 0.7 ? '🎉' : '📚'}</div>
          <h2 style="margin:16px 0;font-size:32px">${score} / ${questions.length}</h2>
          <div style="color:var(--text-muted)">${score >= questions.length * 0.7 ? 'Great job!' : 'Keep practicing!'}</div>
        </div>
        <button class="btn-primary" onclick="closeModal()">Close</button>
      `;
      return;
    }
    
    const q = questions[idx];
    $('modalSheet').innerHTML = `
      <div class="modal-header"><h2>Q${idx + 1}/${questions.length}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="font-size:15px;font-weight:500;margin-bottom:16px;line-height:1.5">${esc(q.q)}</div>
      ${q.opts.map((o, i) => `<button class="btn-sm btn-block mb8" style="justify-content:flex-start;padding:12px" onclick="window._quizAns(${i},${q.ans})">${esc(o)}</button>`).join('')}
      <div class="progress-bar mt16"><div class="progress-fill" style="width:${(idx / questions.length) * 100}%"></div></div>
    `;
  }
  
  window._quizAns = (chosen, correct) => {
    if (chosen === correct) score++;
    idx++;
    renderQ();
  };
  
  renderQ();
};

/* ═══ 6-STEP WIZARD ═══ */
const WIZ = {
  step: 1, periodStart: null, periodEnd: null, holidays: [], mode: 'auto',
  grid: {}, locked: {}, offCount: {}, phCount: {}, cplConversions: [],
  conflictLog: [], warnings: [], staffList: [], periodDates: []
};
window.WIZ = WIZ;

function calcPeriod(refDate = new Date()) {
  const startDay = 26, endDay = 25;
  const today = refDate.getDate();
  let start, end;
  if (today >= startDay) {
    start = new Date(refDate.getFullYear(), refDate.getMonth(), startDay);
    end = new Date(refDate.getFullYear(), refDate.getMonth() + 1, endDay);
  } else {
    start = new Date(refDate.getFullYear(), refDate.getMonth() - 1, startDay);
    end = new Date(refDate.getFullYear(), refDate.getMonth(), endDay);
  }
  return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
}

window.openAutoGenWizard = function() {
  if (!canManage()) { toast('Admin only', 'error'); return; }
  WIZ.step = 1;
  WIZ.holidays = [];
  WIZ.mode = 'auto';
  WIZ.grid = {}; WIZ.locked = {}; WIZ.offCount = {}; WIZ.phCount = {};
  WIZ.cplConversions = []; WIZ.conflictLog = []; WIZ.warnings = [];
  WIZ.staffList = State.staff.filter(s => s.active !== false);
  
  const period = calcPeriod(new Date());
  WIZ.periodStart = period.start;
  WIZ.periodEnd = period.end;
  WIZ.periodDates = dateRange(WIZ.periodStart, WIZ.periodEnd);
  renderWizard();
};

window.renderWizard = function() {
  const renderers = { 1: tplStep1, 2: tplStep2, 3: tplStep3, 4: tplStep4, 5: tplStep5, 6: tplStep6 };
  openModal((renderers[WIZ.step] || tplStep1)());
};

function tplStepIndicator() {
  const steps = ['Period', 'Holidays', 'Mode', 'Rules', 'Conflicts', 'Preview'];
  return `

        const done = WIZ.step > num;
        return `
          <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
            <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:${done ? '#10B981' : active ? 'var(--primary)' : 'var(--bg-2)'};color:${done || active ? '#fff' : 'var(--text-dim)'}">

            </div>
            <span style="font-size:11px;font-weight:500;color:${active ? 'var(--primary)' : 'var(--text-dim)'};white-space:nowrap">${label}</span>
            ${i < steps.length - 1 ? `<span style="color:var(--border-2);margin:0 4px">›</span>` : ''}

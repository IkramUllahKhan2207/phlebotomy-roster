<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0F1A">
<title>KIH Phlebotomy · Companion</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   KIH PHLEBOTOMY COMPANION · 2026 MODERN DESIGN
   PART 1 of 5 — COMPLETE CSS
   ═══════════════════════════════════════════════════════════ */

/* ─── RESET & ROOT ─────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  /* Backgrounds */
  --bg-0:#0B0F1A;
  --bg-1:#0F1422;
  --bg-2:#141A2B;
  --bg-glass:rgba(255,255,255,0.04);
  --bg-glass-2:rgba(255,255,255,0.06);
  --bg-glass-3:rgba(255,255,255,0.08);
  
  /* Borders */
  --border:rgba(255,255,255,0.08);
  --border-2:rgba(255,255,255,0.12);
  --border-3:rgba(255,255,255,0.18);
  
  /* Text */
  --text:#F9FAFB;
  --text-muted:#9CA3AF;
  --text-dim:#6B7280;
  
  /* Brand */
  --primary:#6366F1;
  --primary-2:#8B5CF6;
  --primary-grad:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);
  --primary-glow:rgba(99,102,241,0.4);
  
  /* Accents */
  --cyan:#06B6D4;
  --pink:#EC4899;
  --success:#10B981;
  --success-l:#34D399;
  --danger:#EF4444;
  --danger-l:#F87171;
  --warning:#F59E0B;
  --warning-l:#FBBF24;
  
  /* Shift colors */
  --shift-M:#10B981;
  --shift-E:#6366F1;
  --shift-N:#8B5CF6;
  --shift-X:#6B7280;
  --shift-OFF:#374151;
  --shift-PH:#F59E0B;
  --shift-D:#EC4899;
  
  /* Designation colors */
  --des-phleb:#EF4444;
  --des-sr:#F59E0B;
  --des-jr:#6366F1;
  --des-tech:#10B981;
  
  /* Sizing */
  --radius-sm:12px;
  --radius:18px;
  --radius-lg:24px;
  --radius-xl:32px;
  --nav-h:78px;
  
  /* Shadows */
  --shadow-sm:0 2px 8px rgba(0,0,0,0.3);
  --shadow:0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg:0 16px 48px rgba(0,0,0,0.5);
  --shadow-glow:0 0 24px var(--primary-glow);
  
  /* Animation */
  --ease:cubic-bezier(0.4,0,0.2,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-fast:150ms;
  --dur:250ms;
  --dur-slow:400ms;
}

html,body{
  background:var(--bg-0);
  color:var(--text);
  min-height:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}

body{
  padding-bottom:calc(var(--nav-h) + 20px);
  background:
    radial-gradient(ellipse at top left, rgba(99,102,241,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(139,92,246,0.12) 0%, transparent 50%),
    var(--bg-0);
  background-attachment:fixed;
}

/* ─── TYPOGRAPHY ──────────────────────────────────────── */
h1,h2,h3,h4{font-weight:700;letter-spacing:-0.02em;line-height:1.2}
h1{font-size:26px}
h2{font-size:20px}
h3{font-size:17px}
h4{font-size:15px}
.num-mono{font-family:'JetBrains Mono',monospace;font-feature-settings:'tnum'}

/* ─── UTILITY ─────────────────────────────────────────── */
.hidden{display:none !important}
.flex{display:flex}
.flex-center{display:flex;align-items:center;justify-content:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-col{display:flex;flex-direction:column}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}
.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.text-muted{color:var(--text-muted)}
.text-dim{color:var(--text-dim)}
.text-center{text-align:center}
.bold{font-weight:600}
.semibold{font-weight:500}

/* ─── LOGIN SCREEN ────────────────────────────────────── */
.login-screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:2000;
  background:
    radial-gradient(circle at 20% 30%, rgba(99,102,241,0.25) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(139,92,246,0.2) 0%, transparent 50%),
    var(--bg-0);
  animation:fadeIn 0.5s var(--ease);
}

.login-card{
  width:100%;max-width:400px;
  background:var(--bg-glass-2);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border-2);
  border-radius:var(--radius-xl);
  padding:36px 28px;
  box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.08);
  animation:slideUp 0.5s var(--ease-spring);
  position:relative;
  overflow:hidden;
}

.login-card::before{
  content:'';
  position:absolute;top:-50%;left:-50%;
  width:200%;height:200%;
  background:conic-gradient(from 0deg, transparent 0%, var(--primary-glow) 30%, transparent 60%);
  animation:rotate 8s linear infinite;
  opacity:0.15;
  pointer-events:none;
}

.login-card>*{position:relative;z-index:1}

.login-logo{
  width:72px;height:72px;
  margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;
  background:var(--primary-grad);
  border-radius:24px;
  box-shadow:0 8px 32px var(--primary-glow);
  animation:pulse 3s ease-in-out infinite;
}

.login-card h1{
  font-size:26px;font-weight:800;
  text-align:center;
  background:var(--primary-grad);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:6px;
  letter-spacing:-0.03em;
}

.login-card .subtitle{
  text-align:center;
  color:var(--text-muted);
  font-size:13.5px;
  margin-bottom:28px;
}

.input-group{margin-bottom:16px}

.input-group label{
  display:block;
  font-size:13px;
  font-weight:500;
  color:var(--text-muted);
  margin-bottom:8px;
}

.input-group input,
.input-group select,
.input-group textarea{
  width:100%;
  padding:14px 16px;
  background:var(--bg-glass);
  border:1px solid var(--border-2);
  border-radius:var(--radius);
  color:var(--text);
  font-size:15px;
  font-family:inherit;
  outline:none;
  transition:all var(--dur) var(--ease);
}

.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{
  border-color:var(--primary);
  background:var(--bg-glass-2);
  box-shadow:0 0 0 4px rgba(99,102,241,0.15);
}

.input-group input::placeholder,
.input-group textarea::placeholder{color:var(--text-dim)}

.checkbox-row{
  display:flex;align-items:center;gap:10px;
  margin:16px 0 20px;
  color:var(--text-muted);
  font-size:14px;
  cursor:pointer;
  user-select:none;
}

.checkbox-row input[type="checkbox"]{
  width:20px;height:20px;
  accent-color:var(--primary);
  cursor:pointer;
}

.btn-primary{
  width:100%;
  padding:16px;
  background:var(--primary-grad);
  color:#fff;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  font-family:inherit;
  box-shadow:0 8px 24px var(--primary-glow);
  transition:all var(--dur) var(--ease);
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;
  overflow:hidden;
}

.btn-primary::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
  opacity:0;
  transition:opacity var(--dur) var(--ease);
}

.btn-primary:hover::before{opacity:1}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}

.btn-secondary{
  width:100%;
  padding:16px;
  background:transparent;
  color:var(--text-muted);
  font-size:15px;
  font-weight:500;
  border:1px solid var(--border-2);
  border-radius:var(--radius);
  cursor:pointer;
  font-family:inherit;
  transition:all var(--dur) var(--ease);
  margin-top:10px;
}

.btn-secondary:hover{
  background:var(--bg-glass);
  color:var(--text);
}

.login-footer{
  margin-top:24px;
  text-align:center;
  color:var(--text-dim);
  font-size:12px;
}

/* ─── APP HEADER ──────────────────────────────────────── */
.app-header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:rgba(11,15,26,0.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  background:var(--primary-grad);
  border-radius:12px;
  box-shadow:0 4px 12px var(--primary-glow);
}
.header-title{
  font-size:16px;font-weight:700;
  letter-spacing:-0.02em;
}
.online-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--success-l);
  box-shadow:0 0 8px var(--success-l);
  margin-left:4px;
  animation:pulse-dot 2s ease-in-out infinite;
}

.header-right{display:flex;align-items:center;gap:10px}

.icon-btn{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-glass-2);
  border:1px solid var(--border-2);
  border-radius:14px;
  color:var(--text);
  font-size:18px;
  cursor:pointer;
  position:relative;
  transition:all var(--dur) var(--ease);
}

.icon-btn:active{transform:scale(0.92)}
.icon-btn:hover{background:var(--bg-glass-3)}

.bell-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:18px;height:18px;
  padding:0 5px;
  background:var(--danger);
  color:#fff;
  font-size:10px;font-weight:700;
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(239,68,68,0.5);
  animation:pulse 2s ease-in-out infinite;
}

.user-avatar{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-glass-2);
  border:1px solid var(--border-2);
  border-radius:50%;
  font-size:14px;font-weight:700;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
}

.user-avatar:active{transform:scale(0.92)}

.logout-link{
  color:var(--danger-l);
  font-size:13px;font-weight:500;
  cursor:pointer;
  padding:8px 12px;
  border-radius:10px;
  transition:background var(--dur) var(--ease);
}
.logout-link:hover{background:rgba(239,68,68,0.1)}

/* ─── MAIN CONTENT ────────────────────────────────────── */
.app-content{
  padding:20px 16px;
  max-width:640px;
  margin:0 auto;
  animation:fadeIn 0.4s var(--ease);
}

/* ─── GLASS CARDS ─────────────────────────────────────── */
.card{
  background:var(--bg-glass);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.04);
  transition:all var(--dur) var(--ease);
}

.card-hover:hover{
  background:var(--bg-glass-2);
  border-color:var(--border-2);
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.card-title{
  font-size:17px;font-weight:700;
  margin-bottom:6px;
  display:flex;align-items:center;gap:8px;
  letter-spacing:-0.02em;
}

.card-sub{
  color:var(--text-muted);
  font-size:13.5px;
  line-height:1.55;
}

/* ─── BADGES ──────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  padding:4px 11px;
  background:var(--bg-glass-2);
  border:1px solid var(--border-2);
  border-radius:40px;
  font-size:11.5px;font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  letter-spacing:0.01em;
}

.badge-primary{background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.3);color:#A5B4FC}
.badge-success{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.3);color:#6EE7B7}
.badge-danger{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.3);color:#FCA5A5}
.badge-warning{background:rgba(245,158,11,0.15);border-color:rgba(245,158,11,0.3);color:#FCD34D}
.badge-cyan{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.3);color:#67E8F9}

/* ─── BUTTONS ─────────────────────────────────────────── */
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.btn-sm{
  padding:10px 16px;
  background:var(--bg-glass-2);
  border:1px solid var(--border-2);
  border-radius:40px;
  color:var(--text);
  font-size:13.5px;font-weight:500;
  font-family:inherit;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all var(--dur) var(--ease);
  white-space:nowrap;
}

.btn-sm:active{transform:scale(0.95)}
.btn-sm:hover{background:var(--bg-glass-3);border-color:var(--border-3)}

.btn-accent{
  background:var(--primary-grad);
  border-color:transparent;
  color:#fff;
  box-shadow:0 4px 12px var(--primary-glow);
}
.btn-accent:hover{filter:brightness(1.1)}

.btn-success{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.4);color:#6EE7B7}
.btn-success:hover{background:rgba(16,185,129,0.25)}

.btn-danger{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#FCA5A5}
.btn-danger:hover{background:rgba(239,68,68,0.25)}

.btn-block{width:100%;justify-content:center;padding:14px}

/* ─── BIG BUTTONS ─────────────────────────────────────── */
.big-btn{
  width:100%;
  padding:20px;
  border:none;
  border-radius:var(--radius-lg);
  font-family:inherit;
  font-size:17px;font-weight:700;
  color:#fff;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
  transition:all var(--dur) var(--ease);
  letter-spacing:-0.01em;
}

.big-btn::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
  opacity:0;
  transition:opacity var(--dur) var(--ease);
}
.big-btn:hover::before{opacity:1}
.big-btn:active{transform:scale(0.98)}

.big-btn-draw{
  background:linear-gradient(135deg,#059669,#10B981);
  box-shadow:0 8px 24px rgba(16,185,129,0.4);
}

.big-btn-emergency{
  background:linear-gradient(135deg,#DC2626,#EF4444);
  box-shadow:0 8px 24px rgba(239,68,68,0.4);
}

/* ─── BOTTOM NAV ──────────────────────────────────────── */
.bottom-nav{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:600px;
  height:var(--nav-h);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:8px 6px;
  background:rgba(15,20,34,0.85);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border-2);
  border-radius:24px;
  box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.06);
  z-index:100;
}

.nav-item{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;
  padding:8px 4px;
  min-width:50px;
  color:var(--text-dim);
  font-size:10px;font-weight:500;
  cursor:pointer;
  border-radius:14px;
  transition:all var(--dur) var(--ease);
  position:relative;
}

.nav-item .nav-icon{
  font-size:20px;line-height:1;
  transition:transform var(--dur) var(--ease-spring);
}

.nav-item.active{
  color:var(--primary);
  background:rgba(99,102,241,0.12);
}

.nav-item.active .nav-icon{transform:scale(1.15)}
.nav-item.active::before{
  content:'';
  position:absolute;top:-2px;
  width:6px;height:6px;
  background:var(--primary);
  border-radius:50%;
  box-shadow:0 0 10px var(--primary);
}

/* ─── TOAST ───────────────────────────────────────────── */
.toast{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  min-width:240px;max-width:90vw;
  padding:14px 20px;
  background:rgba(20,26,43,0.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-2);
  border-radius:16px;
  color:var(--text);
  font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);
  z-index:3000;
  opacity:0;
  pointer-events:none;
  transition:all var(--dur) var(--ease-spring);
  display:flex;align-items:center;gap:10px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast.success{border-color:rgba(16,185,129,0.4);background:rgba(16,185,129,0.15)}
.toast.error{border-color:rgba(239,68,68,0.4);background:rgba(239,68,68,0.15)}
.toast.warning{border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.15)}

/* ─── MODAL ───────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:1000;
  display:none;
  align-items:flex-end;justify-content:center;
  animation:fadeIn var(--dur) var(--ease);
}

.modal-overlay.active{display:flex}

.modal-sheet{
  width:100%;
  max-width:640px;
  max-height:90vh;
  overflow-y:auto;
  background:linear-gradient(180deg, rgba(20,26,43,0.98) 0%, rgba(15,20,34,1) 100%);
  border:1px solid var(--border-2);
  border-bottom:none;
  border-radius:28px 28px 0 0;
  padding:20px 18px 32px;
  animation:slideUpModal var(--dur-slow) var(--ease-spring);
  position:relative;
}

.modal-sheet::before{
  content:'';
  position:absolute;top:8px;left:50%;
  transform:translateX(-50%);
  width:40px;height:4px;
  background:var(--border-3);
  border-radius:2px;
}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
  padding-top:4px;
}

.modal-header h2{
  font-size:19px;font-weight:700;
  flex:1;
}

.modal-close{
  width:38px;height:38px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-glass-2);
  border:1px solid var(--border-2);
  border-radius:50%;
  color:var(--text-muted);
  font-size:18px;
  cursor:pointer;
  transition:all var(--dur) var(--ease);
  font-family:inherit;
}

.modal-close:hover{
  background:rgba(239,68,68,0.15);
  border-color:rgba(239,68,68,0.4);
  color:var(--danger-l);
  transform:rotate(90deg);
}

.modal-close:active{transform:rotate(90deg) scale(0.9)}

<script>

/* ═══════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════════

const State = {

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

function toast(msg, type = '') {
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast ' + type, 2600);
}

function uid() {
  return '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function nowTs() {
  return Date.now();
}

function fmtTime(d = new Date()) {
  return d.toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit' });
}

function fmtDate(d = new Date()) {
  return d.toLocaleDateString('en-PK', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('en-PK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function fmtDisplay(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' });
}

function dayShort(date) {
  return new Date(date).toLocaleDateString('en-PK', { weekday: 'short' });
}

function dayNameFor(date) {
  return new Date(date).toLocaleDateString('en-PK', { weekday: 'long' });
}

function isSunday(date) {
  return new Date(date).getDay() === 0;
}

function isHoliday(date, holidays = State.holidays) {
  const key = typeof date === 'string' ? date : new Date(date).toISOString().split('T')[0];
  return holidays.some(h => h.date === key);
}

function dateRange(start, end) {
  const dates = [];
  let cur = new Date(start);
  const last = new Date(end);
  while (cur <= last) {
    dates.push(cur.toISOString().split('T')[0]);
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

function getInitials(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return ((p[0]?.[0] || '') + (p[1]?.[0] || '')).toUpperCase() || '?';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function normalizeMobile(m) {
  if (!m) return '';
  let s = String(m).replace(/\D/g, '');
  if (s.startsWith('92')) s = '0' + s.slice(2);
  if (!s.startsWith('0')) s = '0' + s;
  return s;
}

function formatMobile(m) {
  const s = normalizeMobile(m);
  if (s.length === 11) return `${s.slice(0,4)} ${s.slice(4)}`;
  return s;
}

function staffName(id) {
  const s = State.staff.find(x => x._id === id);
  return s ? s.name : 'Unknown';
}

function findStaff(id) {
  return State.staff.find(x => x._id === id);
}

function objToArr(obj) {
  if (!obj) return [];
  return Object.entries(obj).map(([k, v]) => ({ _id: k, ...v }));
}

function generateId(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/* ═══════════════════════════════════════════════════════════
   LOCAL DB (demo mode — localStorage)
   ═══════════════════════════════════════════════════════════ */
const LocalDB = {
  KEY_PREFIX: 'kih_db_',
  
  get(key, def = []) {
    try {
      const raw = localStorage.getItem(this.KEY_PREFIX + key);
      return raw ? JSON.parse(raw) : def;
    } catch { return def; }
  },
  
  set(key, val) {
    try {
      localStorage.setItem(this.KEY_PREFIX + key, JSON.stringify(val));
      return true;
    } catch(e) {
      console.warn('LocalDB set failed:', e);
      return false;
    }
  },
  
  push(key, item) {
    const arr = this.get(key, []);
    if (!item._id) item._id = uid();
    if (!item.createdAt) item.createdAt = Date.now();
    arr.push(item);
    this.set(key, arr);
    return item;
  },
  
  update(key, id, updates) {
    const arr = this.get(key, []);
    const idx = arr.findIndex(x => x._id === id);
    if (idx === -1) return null;
    arr[idx] = { ...arr[idx], ...updates, updatedAt: Date.now() };
    this.set(key, arr);
    return arr[idx];
  },
  
  remove(key, id) {
    const arr = this.get(key, []);
    const filtered = arr.filter(x => x._id !== id);
    this.set(key, filtered);
    return filtered;
  }
};

/* ═══════════════════════════════════════════════════════════
   SESSION PERSISTENCE (30 days)
   ═══════════════════════════════════════════════════════════ */
const SESSION_KEY = 'kih_session_v3';
const SESSION_TTL = 30 * 24 * 60 * 60 * 1000;

function saveSession(user) {
  const data = { user, expires: Date.now() + SESSION_TTL };
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  State.session = data;
}

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (Date.now() > d.expires) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return d;
  } catch { return null; }
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  State.session = null;
  State.user = null;
}

async function doLogin() {
  const mobileInput = $('loginMobile');
  const passwordInput = $('loginPassword');
  const keep = $('keepSignedIn');
  
  if (!mobileInput || !passwordInput) return;
  
  const mobile = normalizeMobile(mobileInput.value.trim());
  const password = passwordInput.value.trim();
  
  if (!mobile || mobile.length < 10) {
    toast('Enter valid mobile number', 'error');
    return;
  }
  if (!password) {
    toast('Enter password', 'error');
    return;
  }
  
  const btn = $('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span><span>Signing in...</span>';
  
  // Get all staff
  let staffList = LocalDB.get('staff', []);
  if (staffList.length === 0) {
    // Seed default admin on first login
    LocalDB.set('staff', [DEFAULT_ADMIN]);
    staffList = [DEFAULT_ADMIN];
  }
  
  // Find user by mobile
  const user = staffList.find(s => normalizeMobile(s.mobile) === mobile && s.active !== false);
  
  if (!user) {
    btn.disabled = false;
    btn.innerHTML = '<span>🔓</span><span>Sign In</span>';
    toast('Mobile number not registered. Contact admin.', 'error');
    return;
  }
  
  if (user.password !== password) {
    btn.disabled = false;
    btn.innerHTML = '<span>🔓</span><span>Sign In</span>';
    toast('Incorrect password', 'error');
    return;
  }
  
  // Success
  State.user = user;
  if (keep && keep.checked) {
    saveSession(user);
  } else {
    clearSession();
    State.user = user;
  }
  
  btn.disabled = false;
  btn.innerHTML = '<span>🔓</span><span>Sign In</span>';
  
  showApp();
  toast(`Welcome, ${user.name.split(' ')[0]}!`, 'success');
}

    <svg width="28" height="56" viewBox="0 0 32 64" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- Liquid inside -->
      <rect x="6" y="32" width="20" height="28" rx="3" fill="${bodyColor}" opacity="0.7"/>
      <!-- Shine -->
      <rect x="7" y="14" width="3" height="40" rx="1.5" fill="rgba(255,255,255,0.15)"/>
    </svg>
  `;
  
  if (name.includes('edta') || name.includes('lavender') || name.includes('purple')) 
    return tubeSVG('#A78BFA', '#C4B5FD');
  if (name.includes('citrate') || name.includes('blue'))

  if (name.includes('sst') || name.includes('gold') || name.includes('yellow')) 
    return tubeSVG('#FBBF24', '#FDE68A');
  if (name.includes('heparin') || name.includes('green')) 
    return tubeSVG('#10B981', '#6EE7B7');
  if (name.includes('fluoride') || name.includes('grey') || name.includes('gray')) 
    return tubeSVG('#9CA3AF', '#D1D5DB');
  if (name.includes('plain') || name.includes('red')) 
    return tubeSVG('#EF4444', '#FCA5A5');
  if (name.includes('culture')) 
    return tubeSVG('#F3F4F6', '#FEF3C7');
  return tubeSVG('#6B7280', '#9CA3AF');
}

function renderRejection() {
  const reasons = [
    { _id: 'hemo', title: 'Hemolysis (Blood Burst)', how: 'Serum/plasma appears red', why: 'Thin needle, shaking, high vacuum, vein collapse, tourniquet too long', prevent: '21G-23G needle, gentle invert, slow pull, tourniquet 1 min', action: 'Recollect sample' },
    { _id: 'clot', title: 'Clotting', how: 'Clots in EDTA tube', why: 'Not mixed, under-mixed, dirty tube, slow fill', prevent: 'Mix immediately 8-10 times, proper order, check expiry', action: 'Recollect with new tube' },
    { _id: 'short', title: 'Short Volume', how: 'Low blood level in tube', why: 'Low vacuum, needle out, vein collapse, dehydrated', prevent: 'Check expiry, stable needle, give patient water', action: 'Recollect sample' },
    { _id: 'wrong', title: 'Wrong Tube', how: 'Incorrect tube color', why: 'Wrong order of draw, color confusion, poor training', prevent: 'Check protocol card, memorize order, confirm', action: 'Recollect with correct tube' },
    { _id: 'label', title: 'Mislabeled', how: 'Wrong label on tube', why: 'Forgot label, wrong patient, no time written', prevent: 'Bedside label, confirm 3 times, write time', action: 'Recollect from patient' },
    { _id: 'delay', title: 'Delayed Transport', how: 'Sample arrived late', why: 'Traffic, late transport, wrong storage', prevent: 'Send immediately, cold chain, time limit', action: 'New sample' },
    { _id: 'contam', title: 'Contaminated', how: 'Positive culture with skin flora', why: 'Skin not cleaned properly, dirty tube, missed hand hygiene', prevent: '30 sec spirit swab, wait dry, sterile technique', action: 'New sample' }
  ];
  
  const stats = {};
  State.rejections.forEach(r => { stats[r.reason] = (stats[r.reason]||0)+1; });
  const top = Object.entries(stats).sort((a,b) => b[1]-a[1]).slice(0, 3);
  
  return `
    <div class="card" style="border-left:4px solid var(--danger)">
      <div class="card-title">📊 Rejection Statistics</div>
      <div class="card-sub mt8">
        Total reported: <strong>${State.rejections.length}</strong>
        ${top.length ? `<br>Top: ${top.map(([k,v]) => `<strong style="color:var(--danger)">${esc(k)}</strong> (${v})`).join(' · ')}` : ''}
      </div>
      <button class="btn-sm btn-danger mt12" onclick="openReportRejectionModal()">🚫 Report Rejection</button>
    </div>
    
    <input class="search-bar" placeholder="🔍 Search reasons..." oninput="filterItems('rejection-item', this.value)">
    
    <div id="rejectionList">
      ${reasons.map(r => `
        <div class="card rejection-item" data-name="${esc(r.title.toLowerCase())}">
          <div class="flex-between">
            <div class="card-title" style="font-size:15px">${esc(r.title)}</div>
            <button class="btn-sm" style="padding:6px 10px" onclick="toggleFav('${r._id}');render()">${isFav(r._id)?'★':'☆'}</button>
          </div>
          <div class="mt12" style="font-size:13.5px;line-height:1.7;color:var(--text-muted)">
            <p><strong style="color:var(--primary)">🔍 Detect:</strong> ${esc(r.how)}</p>
            <p class="mt8"><strong style="color:var(--danger)">⚠️ Why:</strong> ${esc(r.why)}</p>
            <p class="mt8"><strong style="color:var(--success-l)">🛡️ Prevent:</strong> ${esc(r.prevent)}</p>
            <p class="mt8"><strong style="color:var(--warning)">✅ Action:</strong> ${esc(r.action)}</p>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function copyToClipboard(text, msg) {
  navigator.clipboard.writeText(text)
    .then(() => toast(msg, 'success'))
    .catch(() => toast('Copy failed', 'error'));
}

function renderSwap() {
  const pending = State.swapRequests.filter(s => s.status === 'pending');

        <div class="card-title" style="font-size:15px">⏳ Pending (${pending.length})</div>

    ` : ''}
    
    ${approved.length > 0 ? `
      <div class="card">
        <div class="card-title" style="font-size:15px">✅ Approved (${approved.length})</div>
        ${approved.map(s => renderSwapItem(s)).join('')}
      </div>
    ` : ''}
    
    ${rejected.length > 0 ? `
      <div class="card">
        <div class="card-title" style="font-size:15px">❌ Rejected (${rejected.length})</div>

}

function renderSwapItem(s) {
  const badgeClass = s.status === 'approved' ? 'badge-success' : s.status === 'rejected' ? 'badge-danger' : 'badge-warning';
  const canApprove = isAdmin() && s.status === 'pending';
  
  return `
    <div class="list-row" style="flex-direction:column;align-items:stretch;gap:8px;padding:14px">
      <div class="flex-between">
        <span style="font-weight:600;font-size:14px">${esc(s.from)} → ${esc(s.to)}</span>

          <button class="btn-sm btn-danger" onclick="rejectSwap('${s._id}')">❌ Reject</button>
        </div>
      ` : ''}
    </div>
  `;
}

  const rec = {

    status,
    staffId: State.user?._id,
    staff: State.user?.name || 'User',
    time: fmtTime(),
    createdAt: Date.now()
  };
  LocalDB.push('attendance', rec);
  State.attendance.push(rec);
  render();
  toast('Marked ' + status, 'success');
}

<script>
/* ═══════════════════════════════════════════════════════════
   KIH PHLEBOTOMY COMPANION · PART 4B of 5
   MODAL FUNCTIONS
   ═══════════════════════════════════════════════════════════ */

/* ─── MODAL CORE ──────────────────────────────────────── */
function openModal(html) {
  const sheet = $('modalSheet');
  const overlay = $('modalOverlay');
  if (!sheet || !overlay) return;
  sheet.innerHTML = html;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const overlay = $('modalOverlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

window.closeModal = closeModal;

// Close on overlay click
document.addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// Close on ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* ═══════════════════════════════════════════════════════════
   START DRAW MODAL (15 steps)
   ═══════════════════════════════════════════════════════════ */
const DRAW_STEPS = [
  'Verify order (test name, patient name)',
  'Identify patient (name, MR number, DOB — 3 times)',
  'Prepare equipment (needle, tube, cotton, spirit swab, bandage)',
  'Hand hygiene (sanitizer, gloves)',
  'Apply tourniquet (3-4 inch above, max 1 minute)',
  'Select vein (antecubital area)',
  'Clean site (spirit swab, circular, 30 sec)',
  'Insert needle (15-30 degree angle)',
  'Fill tubes (follow order of draw)',
  'Remove tourniquet',
  'Remove needle (cotton, pressure)',
  'Label tube (patient name, time, initials)',
  'Mix (invert 8-10 times)',
  'Sit patient (5-10 min rest)',
  'Send to lab (time stamp)'
];

let drawState = {
  active: false,
  steps: [],
  patient: '',
  notes: '',
  startTime: null
};

function openStartDrawModal() {
  if (!drawState.active || drawState.steps.length === 0) {
    drawState.steps = DRAW_STEPS.map((t, i) => ({ id: i + 1, text: t, done: false, time: null }));
    drawState.active = true;
    drawState.startTime = Date.now();
  }
  
  const done = drawState.steps.filter(s => s.done).length;
  const pct = (done / DRAW_STEPS.length) * 100;
  
  openModal(`
    <div class="modal-header">
      <h2>🩸 Start Draw</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    
    <div class="input-group">
      <label>Patient Name / MR Number</label>
      <input id="drawPatient" placeholder="Patient name or MR#" value="${esc(drawState.patient)}" oninput="drawState.patient=this.value">
    </div>
    
    <div class="input-group">
      <label>Notes (optional)</label>
      <textarea id="drawNotes" rows="2" placeholder="Any special observations..." oninput="drawState.notes=this.value">${esc(drawState.notes)}</textarea>
    </div>
    
    <div class="flex-between mt12 mb8">
      <span style="font-size:13px;color:var(--text-muted)">Progress</span>
      <strong class="num-mono" style="font-size:13px">${done}/${DRAW_STEPS.length}</strong>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width:${pct}%"></div>
    </div>
    
    <div style="max-height:42vh;overflow-y:auto;margin-top:14px">
      ${drawState.steps.map((s, i) => `
        <div class="step-item">
          <div class="step-check ${s.done ? 'done' : ''}" onclick="toggleDrawStep(${i})">✓</div>
          <div class="step-content">
            <div class="step-title">${i + 1}. ${esc(s.text)}</div>
            ${s.time ? `<div class="step-time">✅ ${esc(s.time)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
    
    <div class="btn-row mt16">
      <button class="btn-sm btn-success" style="flex:1;justify-content:center;padding:14px" onclick="completeDraw()">✅ Complete Draw</button>
      <button class="btn-sm" onclick="closeModal()">Save & Close</button>
    </div>
  `);
}

function toggleDrawStep(i) {
  const s = drawState.steps[i];
  s.done = !s.done;
  s.time = s.done ? fmtTime() : null;
  openStartDrawModal();
}

function completeDraw() {
  const done = drawState.steps.filter(s => s.done).length;
  const total = drawState.steps.length;
  
  if (done < total) {
    if (!confirm(`Only ${done}/${total} steps done. Complete anyway?`)) return;
  }
  
  const data = {
    _id: uid(),
    patient: drawState.patient || 'Unknown',
    staffId: State.user?._id,
    staff: State.user?.name || 'Guest',
    completedAt: Date.now(),
    stepsDone: done,
    totalSteps: total,
    notes: drawState.notes,
    createdAt: Date.now()
  };
  
  LocalDB.push('draws', data);
  
  // Add notification
  LocalDB.push('notifications', {
    _id: uid(),
    title: 'Draw completed',
    body: `Patient: ${data.patient} (${done}/${total} steps)`,
    read: false,
    type: 'draw',
    createdAt: Date.now()
  });
  
  drawState = { active: false, steps: [], patient: '', notes: '', startTime: null };
  
  closeModal();
  render();
  toast('✅ Sample collected!', 'success');
}

/* ─── MANAGE LIST ─────────────────────────────────────── */
function openManageList(type, title) {

/* ─── EDIT ITEM ───────────────────────────────────────── */
function openEditItem(type, id) {
  const dataMap = {
    tests: State.tests,
    emergency: State.emergencyCards,
    difficult: State.difficultDraws,
    scripts: State.scripts,
    policies: State.policies
  };
  const data = dataMap[type] || [];
  const item = id ? data.find(x => x._id === id) : null;
  const isNew = !item;
  
  let fieldsHTML = '';
  
  if (type === 'tests') {
    fieldsHTML = `
      <div class="input-group"><label>Test Name *</label><input id="f_name" value="${esc(item?.name || '')}" placeholder="e.g. CBC"></div>
      <div class="input-group"><label>Tube *</label><input id="f_tube" value="${esc(item?.tube || '')}" placeholder="e.g. EDTA (Lavender)"></div>
      <div class="input-group"><label>Order of Draw</label><input id="f_order" type="number" value="${esc(item?.order || 5)}" placeholder="1-6"></div>
      <div class="input-group"><label>Volume</label><input id="f_volume" value="${esc(item?.volume || '')}" placeholder="e.g. 2-3 mL"></div>
      <div class="input-group"><label>Routine TAT</label><input id="f_tat" value="${esc(item?.tat || '')}" placeholder="e.g. 2 hrs"></div>
      <div class="input-group"><label>Urgent TAT</label><input id="f_urgent" value="${esc(item?.urgent || '')}" placeholder="e.g. 30 min"></div>
      <div class="input-group"><label>Category</label><input id="f_category" value="${esc(item?.category || '')}" placeholder="e.g. Hematology"></div>
    `;
  } else if (type === 'emergency') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}" placeholder="e.g. 🩸 Needle Stick Injury"></div>
      <div class="input-group"><label>Steps (one per line) *</label><textarea id="f_steps" rows="6" placeholder="Step 1&#10;Step 2&#10;Step 3">${esc((item?.steps || []).join('\n'))}</textarea></div>
    `;
  } else if (type === 'difficult') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}" placeholder="e.g. Rolling Vein"></div>
      <div class="input-group"><label>Problem *</label><textarea id="f_problem" rows="2" placeholder="Describe the problem">${esc(item?.problem || '')}</textarea></div>
      <div class="input-group"><label>Solution *</label><textarea id="f_solution" rows="3" placeholder="How to handle">${esc(item?.solution || '')}</textarea></div>
    `;
  } else if (type === 'scripts') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}" placeholder="e.g. First-Time Patient"></div>
      <div class="input-group"><label>English *</label><textarea id="f_en" rows="4" placeholder="English script">${esc(item?.en || '')}</textarea></div>
      <div class="input-group"><label>Urdu</label><textarea id="f_ur" rows="4" placeholder="اردو" style="direction:rtl">${esc(item?.ur || '')}</textarea></div>
    `;
  } else if (type === 'policies') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}" placeholder="Policy title"></div>
      <div class="input-group"><label>Body *</label><textarea id="f_body" rows="6" placeholder="Policy details">${esc(item?.body || '')}</textarea></div>
    `;
  }
  
  openModal(`
    <div class="modal-header">
      <h2>${isNew ? '+ Add' : '✏️ Edit'}</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    
    ${fieldsHTML}
    
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:14px" onclick="saveItem('${type}', '${id || ''}')">💾 Save</button>
      <button class="btn-sm" onclick="openManageList('${type}', '')">Cancel</button>
    </div>
  `);
}

/* ─── SAVE ITEM ───────────────────────────────────────── */
function saveItem(type, id) {
  const isNew = !id;
  const getVal = (id) => { const el = $(id); return el ? el.value.trim() : ''; };
  
  let item = { _id: id || uid(), updatedAt: Date.now() };
  if (isNew) item.createdAt = Date.now();
  
  if (type === 'tests') {
    item.name = getVal('f_name');
    item.tube = getVal('f_tube');
    item.order = +getVal('f_order') || 1;
    item.volume = getVal('f_volume');
    item.tat = getVal('f_tat');
    item.urgent = getVal('f_urgent');
    item.category = getVal('f_category');
    if (!item.name || !item.tube) { toast('Fill required fields', 'error'); return; }
  } else if (type === 'emergency') {
    item.title = getVal('f_title');
    item.steps = getVal('f_steps').split('\n').map(s => s.trim()).filter(Boolean);
    if (!item.title || item.steps.length === 0) { toast('Fill required fields', 'error'); return; }
  } else if (type === 'difficult') {
    item.title = getVal('f_title');
    item.problem = getVal('f_problem');
    item.solution = getVal('f_solution');
    if (!item.title || !item.problem || !item.solution) { toast('Fill all fields', 'error'); return; }
  } else if (type === 'scripts') {
    item.title = getVal('f_title');
    item.en = getVal('f_en');
    item.ur = getVal('f_ur');
    if (!item.title || !item.en) { toast('Fill required fields', 'error'); return; }
  } else if (type === 'policies') {
    item.title = getVal('f_title');
    item.body = getVal('f_body');
    if (!item.title || !item.body) { toast('Fill required fields', 'error'); return; }
  }
  
  // Save to LocalDB
  const key = type === 'emergency' ? 'emergency' : type === 'difficult' ? 'difficult' : type;
  let arr = LocalDB.get(key, []);
  
  if (isNew) {
    arr.push(item);
  } else {
    const idx = arr.findIndex(x => x._id === id);
    if (idx >= 0) arr[idx] = { ...arr[idx], ...item };
    else arr.push(item);
  }
  LocalDB.set(key, arr);
  
  // Refresh in-memory
  if (type === 'tests') State.tests = arr;
  else if (type === 'emergency') State.emergencyCards = arr;
  else if (type === 'difficult') State.difficultDraws = arr;
  else if (type === 'scripts') State.scripts = arr;
  else if (type === 'policies') State.policies = arr;
  
  toast(isNew ? 'Added successfully' : 'Updated', 'success');
  openManageList(type, '');
}

/* ─── DELETE ITEM ─────────────────────────────────────── */
function deleteItem(type, id) {
  if (!confirm('Are you sure you want to delete this item?')) return;
  
  const key = type === 'emergency' ? 'emergency' : type === 'difficult' ? 'difficult' : type;
  let arr = LocalDB.get(key, []);
  arr = arr.filter(x => x._id !== id);
  LocalDB.set(key, arr);
  
  // Refresh in-memory
  if (type === 'tests') State.tests = arr;
  else if (type === 'emergency') State.emergencyCards = arr;
  else if (type === 'difficult') State.difficultDraws = arr;
  else if (type === 'scripts') State.scripts = arr;
  else if (type === 'policies') State.policies = arr;
  
  toast('Deleted', 'success');
  openManageList(type, '');
}

function openHistoryFormsModal() {

    </div>
    
    <div class="input-group">

      <button class="btn-sm" onclick="openHistoryFormsModal()">Cancel</button>
    </div>
  `);

function submitForm() {
  const title = $('uf_title').value.trim();
  const patient = $('uf_patient').value.trim();
  const mr = $('uf_mr').value.trim();
  const category = $('uf_category').value;
  const notes = $('uf_notes').value.trim();
  const fileInput = $('uf_file');
  
  if (!title) { toast('Enter form title', 'error'); return; }
  if (!fileInput.files || !fileInput.files[0]) { toast('Select a file', 'error'); return; }
  
  const file = fileInput.files[0];
  if (file.size > 5 * 1024 * 1024) { toast('File too large (max 5MB)', 'error'); return; }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const form = {
      _id: uid(),
      title,
      patientName: patient,
      mrNumber: mr,
      category,
      notes,
      fileName: file.name,
      fileType: file.type,
      fileSize: file.size,
      fileData: e.target.result, // base64
      uploadedBy: State.user?.name || 'Admin',
      uploadedById: State.user?._id,
      createdAt: Date.now()
    };
    
    try {
      LocalDB.push('historyForms', form);
      State.historyForms.push(form);
      toast('Form uploaded', 'success');
      openHistoryFormsModal();
    } catch (err) {
      toast('Storage full — file too large', 'error');
    }
  };
  reader.readAsDataURL(file);
}

function viewForm(id) {
  const form = State.historyForms.find(f => f._id === id);
  if (!form) { toast('Form not found', 'error'); return; }
  
  const isPDF = form.fileType === 'application/pdf';
  
  openModal(`
    <div class="modal-header">
      <h2>📄 ${esc(form.title)}</h2>

function saveStaff(desId, id) {
  const isNew = !id;
  const name = $('s_name').value.trim();
  const mobile = normalizeMobile($('s_mobile').value.trim());
  const password = $('s_password').value.trim();
  const shift = $('s_shift').value;
  const station = $('s_station').value.trim();
  const notifications = $('s_notifications').checked;
  const adminEl = $('s_admin');
  const isAdmin = adminEl ? adminEl.checked : false;
  
  if (!name) { toast('Enter name', 'error'); return; }
  if (!mobile || mobile.length !== 11) { toast('Enter valid 11-digit mobile', 'error'); return; }
  
  // Check duplicate mobile (if new or mobile changed)
  const existing = State.staff.find(s => normalizeMobile(s.mobile) === mobile && s._id !== id);
  if (existing) { toast('Mobile already registered', 'error'); return; }
  
  if (isNew && (!password || password.length < 6)) {
    toast('Password must be 6+ chars', 'error'); return;
  }
  
  let staff = LocalDB.get('staff', []);
  
  if (isNew) {
    const newStaff = {
      _id: uid(),
      name,
      mobile,
      password,
      designation: desId,
      role: isAdmin ? 'admin' : 'staff',
      shift,
      station,
      notifications,
      active: true,
      createdAt: Date.now()
    };
    staff.push(newStaff);
    State.staff.push(newStaff);
  } else {
    const idx = staff.findIndex(x => x._id === id);
    const updates = { name, mobile, shift, station, notifications, role: isAdmin ? 'admin' : 'staff' };
    if (password && password.length >= 6) updates.password = password;
    if (idx >= 0) staff[idx] = { ...staff[idx], ...updates };
    
    const sidx = State.staff.findIndex(x => x._id === id);
    if (sidx >= 0) State.staff[sidx] = { ...State.staff[sidx], ...updates };
  }
  
  LocalDB.set('staff', staff);
  toast(isNew ? 'Staff added' : 'Staff updated', 'success');
  openDesignationSection(desId);
}

function deleteStaff(id, desId) {
  if (!confirm('Delete this staff member?')) return;
  if (id === State.user?._id) { toast('Cannot delete yourself', 'error'); return; }
  
  let staff = LocalDB.get('staff', []);
  staff = staff.filter(x => x._id !== id);
  LocalDB.set('staff', staff);
  State.staff = State.staff.filter(x => x._id !== id);
  
  toast('Staff deleted', 'success');
  openDesignationSection(desId);
}

function openSwapModal() {

    <div class="input-group"><label>Reason (optional)</label><textarea id="sw_reason" rows="2"></textarea></div>
    
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:14px" onclick="submitSwap()">📤 Submit</button>
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function submitSwap() {
  const from = $('sw_from').value.trim();
  const to = $('sw_to').value.trim();
  const withWho = $('sw_with').value.trim();
  const reason = $('sw_reason').value.trim();
  
  if (!from || !to || !withWho) { toast('Fill all required fields', 'error'); return; }
  
  const swap = {
    _id: uid(),
    from,
    to,
    with: withWho,
    reason,
    status: 'pending',
    requestedBy: State.user?.name || 'User',
    requestedById: State.user?._id,
    createdAt: Date.now()
  };
  
  LocalDB.push('swaps', swap);
  State.swapRequests.push(swap);
  
  // Add notification
  LocalDB.push('notifications', {
    _id: uid(),
    title: 'New Swap Request',
    body: `${State.user?.name}: ${from} → ${to}`,
    read: false,
    type: 'swap',
    createdAt: Date.now()
  });
  
  toast('Swap request submitted', 'success');
  closeModal();
  if (State.activeTab === 'swap') render();
}

function approveSwap(id) {
  if (!confirm('Approve this swap request?')) return;
  const idx = State.swapRequests.findIndex(s => s._id === id);
  if (idx === -1) return;
  
  State.swapRequests[idx].status = 'approved';
  State.swapRequests[idx].approvedBy = State.user?.name;
  State.swapRequests[idx].approvedAt = Date.now();
  
  LocalDB.update('swaps', id, {
    status: 'approved',
    approvedBy: State.user?.name,
    approvedAt: Date.now()
  });
  
  LocalDB.push('notifications', {
    _id: uid(),
    title: '✅ Swap Approved',
    body: `${State.swapRequests[idx].from} → ${State.swapRequests[idx].to}`,
    read: false,
    type: 'swap_approved',
    createdAt: Date.now()
  });
  
  toast('Swap approved', 'success');
  render();
}

function rejectSwap(id) {
  if (!confirm('Reject this swap request?')) return;
  const idx = State.swapRequests.findIndex(s => s._id === id);
  if (idx === -1) return;
  
  State.swapRequests[idx].status = 'rejected';
  State.swapRequests[idx].rejectedBy = State.user?.name;
  State.swapRequests[idx].rejectedAt = Date.now();
  
  LocalDB.update('swaps', id, {
    status: 'rejected',
    rejectedBy: State.user?.name,
    rejectedAt: Date.now()
  });
  
  toast('Swap rejected', 'warning');
  render();
}

function openQuizModal() {
  const questions = [
    { q: 'What is the correct order of draw?', opts: ['EDTA → SST → Citrate', 'Blood Culture → Citrate → SST → Heparin → EDTA → Fluoride', 'SST → EDTA → Citrate', 'Fluoride → EDTA → SST'], ans: 1 },
    { q: 'Tourniquet should not be left on for more than:', opts: ['30 sec', '1 minute', '2 minutes', '5 minutes'], ans: 1 },
    { q: 'Which tube for CBC?', opts: ['SST Gold', 'EDTA Lavender', 'Citrate Blue', 'Fluoride Grey'], ans: 1 },
    { q: 'Angle for venipuncture:', opts: ['5-10°', '15-30°', '45°', '90°'], ans: 1 },
    { q: 'After needle stick injury, first action:', opts: ['Report supervisor', 'Wash with soap and water 5 min', 'Take PEP', 'Fill incident form'], ans: 1 }
  ];
  
  let idx = 0, score = 0;
  
  function renderQ() {
    if (idx >= questions.length) {
      $('modalSheet').innerHTML = `
        <div class="modal-header">
          <h2>Quiz Complete</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="text-align:center;padding:28px 0">
          <div style="font-size:56px">${score >= questions.length * 0.7 ? '🎉' : '📚'}</div>
          <h2 style="margin:16px 0;font-size:32px">${score} / ${questions.length}</h2>
          <div style="color:var(--text-muted)">${score >= questions.length * 0.7 ? 'Great job!' : 'Keep practicing!'}</div>
        </div>
        <button class="btn-primary" onclick="closeModal()">Close</button>
      `;
      return;
    }
    
    const q = questions[idx];
    $('modalSheet').innerHTML = `
      <div class="modal-header">
        <h2>Q${idx + 1}/${questions.length}</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div style="font-size:15px;font-weight:500;margin-bottom:16px;line-height:1.5">${esc(q.q)}</div>
      ${q.opts.map((o, i) => `
        <button class="btn-sm btn-block mb8" style="justify-content:flex-start;padding:14px" onclick="window._quizAns(${i},${q.ans})">${esc(o)}</button>
      `).join('')}
      <div class="progress-bar mt16">
        <div class="progress-fill" style="width:${(idx / questions.length) * 100}%"></div>
      </div>
    `;
  }
  
  window._quizAns = (chosen, correct) => {
    if (chosen === correct) score++;
    idx++;
    renderQ();
  };
  
  renderQ();
}

<script>
/* ═══════════════════════════════════════════════════════════
   KIH PHLEBOTOMY COMPANION · PART 5A of 5
   AUTO ROSTER GENERATION — CORE ALGORITHM
   Per 12-section specification
   ═══════════════════════════════════════════════════════════ */

/* ─── SHIFT REQUIREMENTS (per designation) ─────────────── */
const SHIFT_REQUIREMENTS = {
  phleb: {
    monSat: { M: 3, E: 2, N: 1 },
    sun:    { M: 2, E: 2, N: 1 }
  },
  sr: {
    monSat: { M: 2, E: 1, N: 0 },
    sun:    { M: 1, E: 1, N: 0 }
  },
  jr: {
    monSat: { M: 1, E: 1, N: 0 },
    sun:    { M: 1, E: 1, N: 0 }
  },
  tech: {
    monSat: { M: 1, E: 1, N: 1 },
    sun:    { M: 1, E: 1, N: 0 }
  }
};

/* ─── WIZ STATE ──────────────────────────────────────── */
const WIZ = {
  step: 1,
  periodStart: null,
  periodEnd: null,
  holidays: [],
  mode: 'auto',
  grid: {},
  locked: {},
  offCount: {},
  phCount: {},
  cplConversions: [],
  conflictLog: [],
  warnings: [],
  staffList: [],
  periodDates: []
};

function freshWizard() {
  WIZ.step = 1;
  WIZ.periodStart = null;
  WIZ.periodEnd = null;
  WIZ.holidays = [];
  WIZ.mode = 'auto';
  WIZ.grid = {};
  WIZ.locked = {};
  WIZ.offCount = {};
  WIZ.phCount = {};
  WIZ.cplConversions = [];
  WIZ.conflictLog = [];
  WIZ.warnings = [];
  WIZ.staffList = State.staff.filter(s => s.active !== false);
  WIZ.periodDates = [];
}

/* ═══════════════════════════════════════════════════════════
   SECTION 1 — PERIOD SETUP
   ═══════════════════════════════════════════════════════════ */
function calcPeriod(refDate = new Date()) {
  const startDay = State.settings.periodStartDay || 26;
  const endDay = State.settings.periodEndDay || 25;
  const today = refDate.getDate();
  
  let start, end;
  
  if (today >= startDay) {
    start = new Date(refDate.getFullYear(), refDate.getMonth(), startDay);
    end = new Date(refDate.getFullYear(), refDate.getMonth() + 1, endDay);
  } else {
    start = new Date(refDate.getFullYear(), refDate.getMonth() - 1, startDay);
    end = new Date(refDate.getFullYear(), refDate.getMonth(), endDay);
  }
  
  return {
    start: start.toISOString().split('T')[0],
    end: end.toISOString().split('T')[0],
    startDay, endDay
  };
}

function getPeriodDates(start, end) {
  return dateRange(start, end);
}

/* ═══════════════════════════════════════════════════════════
   SECTION 2 — DAY CLASSIFICATION
   ═══════════════════════════════════════════════════════════ */
function classifyDay(date) {
  if (isSunday(date)) return 'SUNDAY';
  if (isHoliday(date, WIZ.holidays)) return 'HOLIDAY';
  const d = new Date(date).getDay();
  if (d === 6) return 'SATURDAY';
  return 'WEEKDAY';
}

function isWorkingDay(date) {
  const cls = classifyDay(date);
  return cls !== 'SUNDAY';
}

function getRelaxLimit(date) {
  const cls = classifyDay(date);
  if (cls === 'SUNDAY' || cls === 'HOLIDAY') return 7;
  if (cls === 'SATURDAY') return 2;
  return 1;
}

/* ═══════════════════════════════════════════════════════════
   SECTION 3 — OFF TARGET
   ═══════════════════════════════════════════════════════════ */
function calcOffTarget() {
  return WIZ.periodDates.filter(d => isSunday(d)).length;
}

function calcHolidayCount() {
  return WIZ.holidays.length;
}

/* ═══════════════════════════════════════════════════════════
   SECTION 4 — RELAX COUNTERS
   ═══════════════════════════════════════════════════════════ */
function getDayRelaxCount(date) {
  let count = 0;
  for (const staffId in WIZ.grid[date]) {
    const code = WIZ.grid[date][staffId];
    if (['OFF', 'PH', 'D'].includes(code) || code.startsWith('L')) count++;
  }
  return count;
}

function isRelaxCode(code) {
  return code === 'OFF' || code === 'PH' || code === 'D' || code.startsWith('L');
}

function canAssignRelax(date) {
  return getDayRelaxCount(date) < getRelaxLimit(date);
}

/* ═══════════════════════════════════════════════════════════
   SECTION 5 — SHIFT REQUIREMENTS HELPERS
   ═══════════════════════════════════════════════════════════ */
function getShiftReq(date) {
  const cls = classifyDay(date);
  const isSunOrHoliday = cls === 'SUNDAY' || cls === 'HOLIDAY';
  
  // Build requirement per shift code (M, E, N) aggregated across all staff
  const req = { M: 0, E: 0, N: 0 };
  
  for (const desId in SHIFT_REQUIREMENTS) {
    const desReq = isSunOrHoliday 
      ? SHIFT_REQUIREMENTS[desId].sun 
      : SHIFT_REQUIREMENTS[desId].monSat;
    
    // Only count if there are active staff in this designation
    const desStaffCount = WIZ.staffList.filter(s => s.designation === desId).length;
    if (desStaffCount === 0) continue;
    
    req.M += desReq.M || 0;
    req.E += desReq.E || 0;
    req.N += desReq.N || 0;
  }
  
  return req;
}

/* ═══════════════════════════════════════════════════════════
   SECTION 6 — GENERATION FLOW
   ═══════════════════════════════════════════════════════════ */

/* ─── STEP A: INITIALIZE ─────────────────────────────── */
function initGrid() {
  WIZ.grid = {};
  WIZ.locked = {};
  WIZ.offCount = {};
  WIZ.phCount = {};
  
  WIZ.staffList.forEach(s => {
    WIZ.offCount[s._id] = 0;
    WIZ.phCount[s._id] = 0;
  });
  
  WIZ.periodDates.forEach(date => {
    WIZ.grid[date] = {};
    WIZ.locked[date] = {};
    WIZ.staffList.forEach(s => {
      WIZ.grid[date][s._id] = '';
      WIZ.locked[date][s._id] = false;
    });
  });
}

/* ─── STEP B: APPLY LOCKED ENTRIES ───────────────────── */
function applyLockedEntries() {
  WIZ.staffList.forEach(staff => {
    // 1. specialOffDates
    (staff.specialOffDates || []).forEach(date => {
      if (WIZ.grid[date] && WIZ.grid[date][staff._id] !== undefined) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
      }
    });
  });
  
  // 7. Approved leaves
  State.leaveRequests.filter(l => l.status === 'approved').forEach(leave => {
    const dates = dateRange(leave.from, leave.to);
    dates.forEach(date => {
      if (WIZ.grid[date] && WIZ.grid[date][leave.staffId] !== undefined && !WIZ.locked[date][leave.staffId]) {
        WIZ.grid[date][leave.staffId] = 'L';
        WIZ.locked[date][leave.staffId] = true;
      }
    });
  });
}

/* ─── STEP C: ASSIGN OFF TO ALL STAFF ────────────────── */
function assignOFFToAllStaff() {
  const target = calcOffTarget();
  
  // Sort staff by designation priority (Sr first to protect)
  const sorted = [...WIZ.staffList].sort((a, b) => {
    const order = { sr: 0, tech: 1, phleb: 2, jr: 3 };
    return (order[a.designation] ?? 99) - (order[b.designation] ?? 99);
  });
  
  // C1. Sundays first
  sorted.forEach(staff => {
    const sundays = WIZ.periodDates.filter(d => isSunday(d) && classifyDay(d) === 'SUNDAY');
    sundays.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Sunday off');
    });
  });
  
  // C2. Holidays → PH (not OFF)
  const holidayDates = WIZ.holidays.map(h => h.date);
  sorted.forEach(staff => {
    holidayDates.forEach(date => {
      if (!WIZ.grid[date] || WIZ.locked[date][staff._id]) return;
      if (WIZ.phCount[staff._id] >= calcHolidayCount()) return;
      WIZ.grid[date][staff._id] = 'PH';
      WIZ.locked[date][staff._id] = true;
      WIZ.phCount[staff._id]++;
      logDecision(date, staff, 'PH', 'Holiday PH');
    });
  });
  
  // C3. Saturdays
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    const saturdays = WIZ.periodDates.filter(d => classifyDay(d) === 'SATURDAY');
    saturdays.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Saturday off');
    });
  });
  
  // C4. Weekdays
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    const weekdays = WIZ.periodDates.filter(d => classifyDay(d) === 'WEEKDAY');
    weekdays.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Weekday off');
    });
  });
  
  // C5. Final pass — any remaining
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    WIZ.periodDates.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Final pass (limit broken)');
    });
  });
}

/* ─── STEP D: PROCESS EACH DAY ───────────────────────── */
function processAllDays() {
  WIZ.periodDates.forEach((date, idx) => {
    processDay(date, idx === 0 ? null : WIZ.periodDates[idx - 1]);
  });
}

function processDay(date, prevDate) {
  // D1. N12 priority rest
  applyN12PriorityRest(date, prevDate);
  
  // D2. Fill shift requirements
  fillDayShifts(date);
  
  // D3. Auto-fix missing
  autoFixMissingShifts(date);
  
  // D4. Remaining → X
  WIZ.staffList.forEach(staff => {
    if (!WIZ.grid[date][staff._id]) {
      WIZ.grid[date][staff._id] = 'X';
    }
  });
}

/* ─── SECTION 7: N12 PRIORITY REST ───────────────────── */
function applyN12PriorityRest(date, prevDate) {
  if (!prevDate) return;
  
  WIZ.staffList.forEach(staff => {
    if (WIZ.locked[date][staff._id]) return;
    
    const prevCode = WIZ.grid[prevDate][staff._id];
    if (prevCode === 'N' || prevCode === 'N12') {
      // Try OFF first
      if (canAssignRelax(date)) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
        logDecision(date, staff, 'OFF', 'Post-night rest (N/N12)');
      } else {
        // Fallback to E
        WIZ.grid[date][staff._id] = 'E';
        WIZ.locked[date][staff._id] = true;
        logDecision(date, staff, 'E', 'Post-night fallback (relax full)');
      }
    }
  });
}

/* ─── D2: FILL DAY SHIFTS ────────────────────────────── */
function fillDayShifts(date) {
  const req = getShiftReq(date);
  
  ['M', 'E', 'N'].forEach(shiftCode => {
    let need = req[shiftCode] || 0;
    if (need <= 0) return;
    
    // Get eligible free staff (not locked, no code yet)
    const free = WIZ.staffList.filter(s => 
      !WIZ.locked[date][s._id] && !WIZ.grid[date][s._id]
    );
    
    // Sort by preference
    const sorted = free.map(s => {
      let priority = 99;
      if (s.fixedShift === shiftCode) priority = 0;
      else if (s.multiShifts && s.multiShifts.includes(shiftCode)) {
        priority = 1 + s.multiShifts.indexOf(shiftCode);
      }
      return { staff: s, priority };
    }).sort((a, b) => a.priority - b.priority);
    
    for (const { staff } of sorted) {
      if (need <= 0) break;
      WIZ.grid[date][staff._id] = shiftCode;
      WIZ.locked[date][staff._id] = true;
      need--;
      logDecision(date, staff, shiftCode, `Fill ${shiftCode}`);
    }
  });
}

/* ─── D3: AUTO FIX MISSING SHIFTS ────────────────────── */
function autoFixMissingShifts(date) {
  const req = getShiftReq(date);
  
  ['M', 'E', 'N'].forEach(shiftCode => {
    let need = req[shiftCode] || 0;
    if (need <= 0) return;
    
    // Count current
    const current = Object.values(WIZ.grid[date]).filter(c => c === shiftCode).length;
    let missing = need - current;
    if (missing <= 0) return;
    
    // FIX-1: Move staff with 'X' to needed shift
    WIZ.staffList.forEach(staff => {
      if (missing <= 0) return;
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.grid[date][staff._id] === 'X') {
        WIZ.grid[date][staff._id] = shiftCode;
        missing--;
        logDecision(date, staff, shiftCode, `Fix from X to ${shiftCode}`);
      }
    });
    
    // FIX-2: Move less-critical codes
    if (missing > 0) {
      const lessCritical = ['E4', 'D', 'N12'];
      WIZ.staffList.forEach(staff => {
        if (missing <= 0) return;
        if (WIZ.locked[date][staff._id]) return;
        const code = WIZ.grid[date][staff._id];
        if (lessCritical.includes(code)) {
          WIZ.grid[date][staff._id] = shiftCode;
          missing--;
          logDecision(date, staff, shiftCode, `Fix ${code}→${shiftCode}`);
        }
      });
    }
    
    // FIX-3: Force any non-relax staff
    if (missing > 0) {
      WIZ.staffList.forEach(staff => {
        if (missing <= 0) return;
        if (WIZ.locked[date][staff._id]) return;
        const code = WIZ.grid[date][staff._id];
        if (!isRelaxCode(code)) {
          WIZ.grid[date][staff._id] = shiftCode;
          missing--;
          logDecision(date, staff, shiftCode, `FORCE fix (was ${code})`);
        }
      });
    }
  });
}

/* ─── STEP E: PH ADJUSTMENT ──────────────────────────── */
function adjustPHForDutyStaff() {
  const holidays = WIZ.holidays;
  if (holidays.length === 0) return;
  
  WIZ.staffList.forEach(staff => {
    holidays.forEach(holiday => {
      const hDate = holiday.date;
      const code = WIZ.grid[hDate]?.[staff._id];
      
      // If staff WORKED on holiday (not PH/OFF/Leave), they're entitled to PH
      if (code && !isRelaxCode(code)) {
        // Find a day with free relax slot (closest to holiday first)
        const candidates = WIZ.periodDates.filter(d => 
          d !== hDate && 
          !WIZ.locked[d][staff._id] &&
          !isRelaxCode(WIZ.grid[d][staff._id]) &&
          canAssignRelax(d)
        );
        
        // Sort by closeness to holiday
        candidates.sort((a, b) => {
          const distA = Math.abs(new Date(a) - new Date(hDate));
          const distB = Math.abs(new Date(b) - new Date(hDate));
          return distA - distB;
        });
        
        if (candidates.length > 0) {
          const targetDate = candidates[0];
          WIZ.grid[targetDate][staff._id] = 'PH';
          WIZ.locked[targetDate][staff._id] = true;
          WIZ.phCount[staff._id]++;
          logDecision(targetDate, staff, 'PH', `PH for ${hDate}`);
        } else {
          // No slot — convert to CPL
          WIZ.cplConversions.push({
            staffId: staff._id,
            staffName: staff.name,
            amount: 1,
            originalHolidayDate: hDate,
            holidayName: holiday.name,
            reason: 'No PH slot available in period',
            status: 'pending',
            periodStart: WIZ.periodStart,
            periodEnd: WIZ.periodEnd,
            createdBy: State.user?.name,
            createdAt: Date.now()
          });
          logDecision(hDate, staff, 'CPL', `PH→CPL (no slot)`);
        }
      }
    });
  });
}

/* ─── STEP F: FINALIZE & VALIDATE ────────────────────── */
function finalizeGeneration() {
  // Recount OFF and PH from final grid
  const offTarget = calcOffTarget();
  const holidayCount = calcHolidayCount();
  
  WIZ.offCount = {};
  WIZ.phCount = {};
  WIZ.staffList.forEach(s => {
    WIZ.offCount[s._id] = 0;
    WIZ.phCount[s._id] = 0;
  });
  
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      const code = WIZ.grid[date][staff._id];
      if (code === 'OFF') WIZ.offCount[staff._id]++;
      if (code === 'PH') WIZ.phCount[staff._id]++;
    });
  });
  
  // Validate
  WIZ.warnings = [];
  
  // V1: OFF target
  WIZ.staffList.forEach(staff => {
    const target = offTarget;
    const actual = WIZ.offCount[staff._id];
    const cplAdj = WIZ.cplConversions.filter(c => c.staffId === staff._id).length;
    
    if (actual !== target && actual + cplAdj !== target) {
      WIZ.warnings.push(`${staff.name}: OFF ${actual}/${target}`);
    }
  });
  
  // V2: PH count (should equal holiday count OR convert to CPL)
  WIZ.staffList.forEach(staff => {
    const target = holidayCount;
    const actual = WIZ.phCount[staff._id];
    const cplAdj = WIZ.cplConversions.filter(c => c.staffId === staff._id && c.originalHolidayDate).length;
    
    if (actual + cplAdj !== target) {
      WIZ.warnings.push(`${staff.name}: PH ${actual + cplAdj}/${target}`);
    }
  });
  
  // V3: Relax limit not exceeded
  WIZ.periodDates.forEach(date => {
    const relax = getDayRelaxCount(date);
    const limit = getRelaxLimit(date);
    if (relax > limit) {
      WIZ.warnings.push(`${date}: relax ${relax}/${limit}`);
    }
  });
  
  // V5: No empty cells
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      if (!WIZ.grid[date][staff._id]) {
        WIZ.warnings.push(`${staff.name} empty on ${date}`);
      }
    });
  });
  
  return WIZ.warnings.length === 0;
}

/* ─── LOG DECISION ───────────────────────────────────── */
function logDecision(date, staff, code, reason) {
  WIZ.conflictLog.push({
    date,
    note: `${staff.name}: ${code} (${reason})`
  });
}

/* ═══════════════════════════════════════════════════════════
   MAIN GENERATION RUNNER
   ═══════════════════════════════════════════════════════════ */
function wizStartGeneration() {
  if (WIZ.staffList.length === 0) {
    toast('No active staff', 'error');
    return;
  }
  
  WIZ.periodDates = getPeriodDates(WIZ.periodStart, WIZ.periodEnd);
  
  if (WIZ.periodDates.length === 0) {
    toast('Invalid period', 'error');
    return;
  }
  
  toast('⏳ Generating roster...', 'warning');
  
  // Run in setTimeout to avoid UI block
  setTimeout(() => {
    try {
      initGrid();
      applyLockedEntries();
      assignOFFToAllStaff();
      processAllDays();
      adjustPHForDutyStaff();
      const valid = finalizeGeneration();
      
      if (valid) {
        toast('✅ Roster generated successfully!', 'success');
      } else {
        toast(`⚠️ ${WIZ.warnings.length} warnings — cannot save`, 'error');
      }
      
      // Move to step 6
      WIZ.step = 6;
      renderWizard();
    } catch (e) {
      console.error('Generation error:', e);
      toast('Generation failed: ' + e.message, 'error');
    }
  }, 100);
}

   END PART 5A
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   SAVE ROSTER
   ═══════════════════════════════════════════════════════════ */
async function wizSaveRoster() {
  if (WIZ.warnings.length > 0) {
    toast('Cannot save — fix warnings first', 'error');
    return;
  }
  
  const periodId = `${WIZ.periodStart}_${WIZ.periodEnd}`;
  const roster = {
    _id: periodId,
    periodStart: WIZ.periodStart,
    periodEnd: WIZ.periodEnd,
    generatedAt: Date.now(),
    generatedBy: State.user?.name || 'Admin',
    staffCount: WIZ.staffList.length,
    grid: WIZ.grid,
    offCount: WIZ.offCount,
    phCount: WIZ.phCount,
    cplConversions: WIZ.cplConversions,
    log: WIZ.conflictLog,
    holidays: WIZ.holidays
  };
  
  try {
    // Save roster
    let allRosters = LocalDB.get('rosters', []);
    const idx = allRosters.findIndex(r => r._id === periodId);
    if (idx >= 0) allRosters[idx] = roster;
    else allRosters.push(roster);
    LocalDB.set('rosters', allRosters);
    
    // Save holidays
    let holidays = LocalDB.get('holidays', []);
    WIZ.holidays.forEach(h => {
      if (!holidays.some(x => x.date === h.date)) holidays.push(h);
    });
    LocalDB.set('holidays', holidays);
    State.holidays = holidays;
    
    // Save CPL conversions
    if (WIZ.cplConversions.length > 0) {
      let cplRecords = LocalDB.get('cplRecords', []);
      WIZ.cplConversions.forEach(c => cplRecords.push(c));
      LocalDB.set('cplRecords', cplRecords);
    }
    
    // Save current roster to State
    State.rosterData = WIZ.grid;
    State.rosterPeriod = { start: WIZ.periodStart, end: WIZ.periodEnd };
    
    // Add notification
    LocalDB.push('notifications', {
      _id: uid(),
      title: '✅ Roster Generated',
      body: `Period: ${fmtDisplay(WIZ.periodStart)} → ${fmtDisplay(WIZ.periodEnd)}`,
      read: false,
      type: 'roster',
      createdAt: Date.now()
    });
    
    toast('✅ Roster saved successfully!', 'success');
    closeModal();
    
    // Switch to roster tab
    State.activeTab = 'roster';
    render();
    
  } catch (e) {
    console.error('Save error:', e);
    toast('Save failed: ' + e.message, 'error');
  }
}

  if (guestBtn) guestBtn.onclick = doGuestLogin;

  const bell = $('notificationBell');
  if (bell) bell.onclick = openNotificationsModal;
  
  // Enter key on login
  const pwd = $('loginPassword');
  if (pwd) pwd.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  
  // Mobile input formatting
  const mob = $('loginMobile');
  if (mob) {
    mob.addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      e.target.value = v;
    });
  }
  
  // Online/offline
  window.addEventListener('online', () => { State.online = true; updateOnlineDot(); toast('Back online', 'success'); });
  window.addEventListener('offline', () => { State.online = false; updateOnlineDot(); toast('Offline mode', 'warning'); });
  
  // Auto-login if session exists
  const session = loadSession();
  if (session) {
    // Verify staff still exists
    const allStaff = LocalDB.get('staff', [DEFAULT_ADMIN]);
    const exists = allStaff.find(s => s._id === session.user._id);
    if (exists) {
      State.user = exists;
      showApp();

    } else {

window.saveHistoryTemplate = function() {
  const name = $('ht_name').value.trim();
  const description = $('ht_desc').value.trim();
  const category = $('ht_category').value;
  const fileInput = $('ht_file');
  
  if (!name) { toast('Enter form name', 'error'); return; }
  if (!fileInput.files || !fileInput.files[0]) { toast('Select a file', 'error'); return; }
  
  const file = fileInput.files[0];
  if (file.size > 5 * 1024 * 1024) { toast('File too large (max 5MB)', 'error'); return; }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const form = {
      _id: uid(),
      name, description, category,
      fileName: file.name,
      fileType: file.type,
      fileSize: file.size,
      fileData: e.target.result,
      uploadedBy: State.user?.name || 'Admin',
      createdAt: Date.now()
    };
    
    try {
      LocalDB.push('historyForms', form);
      State.historyForms.push(form);
      toast('Template saved', 'success');
      openHistoryFormsModal();
    } catch (err) {
      toast('Storage full — file too large', 'error');
    }
  };
  reader.readAsDataURL(file);
};

window.downloadHistoryForm = function(id) {
  const form = State.historyForms.find(f => f._id === id);
  if (!form) { toast('Not found', 'error'); return; }
  const a = document.createElement('a');
  a.href = form.fileData;
  a.download = form.fileName || (form.name + '.pdf');
  a.click();
  toast('Downloading...', 'success');
};

window.printHistoryForm = function(id) {
  const form = State.historyForms.find(f => f._id === id);
  if (!form) { toast('Not found', 'error'); return; }
  
  const win = window.open('', '_blank');

  win.document.write(`

window.deleteHistoryForm = function(id) {

window.toggleAllRecipients = function(checked) {
  $$('.sn-recipient').forEach(el => el.checked = checked);
};

window.sendNotification = function() {
  const title = $('sn_title').value.trim();
  const body = $('sn_body').value.trim();
  const type = $('sn_type').value;
  
  if (!title || !body) { toast('Fill title and message', 'error'); return; }
  
  const recipients = Array.from($$('.sn-recipient:checked')).map(el => ({
    id: el.value,
    mobile: el.dataset.mobile,
    name: el.dataset.name
  }));
  
  if (recipients.length === 0) { toast('Select at least one recipient', 'error'); return; }
  
  // Save in-app notification
  LocalDB.push('notifications', {
    _id: uid(),
    title,
    body,
    type,
    recipients: recipients.map(r => r.id),
    sentBy: State.user?.name || 'Admin',
    createdAt: Date.now(),
    read: false
  });
  
  // Trigger WhatsApp clicks for each recipient
  recipients.forEach((r, i) => {
    setTimeout(() => {
      const mobile = normalizeMobile(r.mobile);
      const fullMobile = mobile.startsWith('0') ? '92' + mobile.slice(1) : mobile;
      const message = `*🏥 KIH Phlebotomy*\n\n*${title}*\n\n${body}\n\n_Sent by: ${State.user?.name || 'Admin'}_`;
      const url = `https://wa.me/${fullMobile}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    }, i * 500); // 500ms delay between each
  });
  
  toast(`Sending to ${recipients.length} staff via WhatsApp`, 'success');
  closeModal();
  
  // Reload data
  State.notifications = LocalDB.get('notifications', []);
  State.unreadCount = State.notifications.filter(n => !n.read).length;
  updateBell();
  render();
};

const THEMES = {
  dark: { name: 'Dark', bg: '#0B0F1A', text: '#F9FAFB' },
  amoled: { name: 'AMOLED', bg: '#000000', text: '#FFFFFF' },
  light: { name: 'Light', bg: '#F3F4F6', text: '#111827' }

const ACCENTS = {

  cyan: { name: 'Cyan', grad: 'linear-gradient(135deg,#06B6D4,#3B82F6)' },

  pink: { name: 'Pink', grad: 'linear-gradient(135deg,#EC4899,#DB2777)' }

window.applyTheme = function(themeName) {
  const t = THEMES[themeName] || THEMES.dark;
  document.documentElement.style.setProperty('--bg-0', t.bg);
  document.documentElement.style.setProperty('--text', t.text);
  document.body.style.background = t.bg;
  localStorage.setItem('kih_theme', themeName);
  State.settings.theme = themeName;
};

window.applyAccent = function(accentName) {
  const a = ACCENTS[accentName] || ACCENTS.indigo;
  document.documentElement.style.setProperty('--primary-grad', a.grad);
  localStorage.setItem('kih_accent', accentName);
  State.settings.accent = accentName;
};

window.applyFontSize = function(size) {
  const sizes = { small: '14px', medium: '15px', large: '16px', xlarge: '17px' };
  document.documentElement.style.fontSize = sizes[size] || '15px';
  localStorage.setItem('kih_fontsize', size);
  State.settings.fontSize = size;
};

const THEMES_V2 = {

  amoled:  { name: 'AMOLED',  bg: '#000000', text: '#FFFFFF' },

  cyan:    { name: 'Cyan',    grad: 'linear-gradient(135deg,#06B6D4,#3B82F6)' },

:root{--bg-0:#FFFFFF;--bg-1:#F9FAFB;--bg-2:#F3F4F6;--border:#E5E7EB;--border-2:#D1D5DB;--text:#111827;--text-muted:#6B7280;--text-dim:#9CA3AF;--primary:#14B8A6;--primary-d:#0D9488;--primary-glow:rgba(20,184,166,0.25);--success:#10B981;--success-l:#34D399;--danger:#EF4444;--danger-l:#F87171;--warning:#F59E0B;--radius:12px;--radius-lg:16px;--radius-xl:24px;--nav-h:70px;--shadow-sm:0 1px 2px rgba(0,0,0,0.05);--shadow:0 4px 12px rgba(0,0,0,0.08);--shadow-lg:0 12px 32px rgba(0,0,0,0.12)}

.num-mono{font-family:'JetBrains Mono',monospace}
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:2000;background:var(--bg-0)}
.login-card{width:100%;max-width:400px;background:var(--bg-0);border:1px solid var(--border);border-radius:var(--radius-xl);padding:32px 24px;box-shadow:var(--shadow-lg)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-0);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 4px 10px;z-index:100;overflow-x:auto}

.search-bar{width:100%;padding:11px 14px;background:var(--bg-0);border:1px solid var(--border);border-radius:40px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;margin-bottom:12px}

.tab-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:8px;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;background:var(--bg-1);border:1px solid var(--border);border-radius:40px;color:var(--text-muted);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.progress-bar{height:6px;background:var(--bg-2);border-radius:6px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--primary);border-radius:6px;transition:width .3s ease}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--bg-0);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:all .15s ease}
.list-row:hover{background:var(--bg-1);border-color:var(--border-2)}
.stat-box{background:var(--bg-1);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.stat-box .num{font-size:24px;font-weight:700;line-height:1.1}
.stat-box .lbl{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em}
.emergency-card{background:var(--bg-0);border:1px solid var(--border);border-left:3px solid #EF4444;border-radius:10px;padding:14px;margin-bottom:10px}
.emergency-card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.emergency-steps{list-style:none;color:var(--text-muted);font-size:13px;line-height:1.6}

.empty-state{text-align:center;padding:30px 16px;color:var(--text-muted)}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:0.4}
.avatar{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1px solid var(--border);border-radius:50%;font-weight:600;font-size:13px}
.divider{height:1px;background:var(--border);margin:14px 0}
.roster-table{width:100%;border-collapse:collapse;font-size:11px}
.roster-table th{padding:8px 4px;color:var(--text-dim);font-weight:600;font-size:10px;text-transform:uppercase;text-align:center}
.roster-table th:first-child{text-align:left}
.roster-table td{padding:6px 4px;text-align:center;border-top:1px solid var(--border);font-size:11px}
.roster-table td:first-child{text-align:left;font-weight:500;white-space:nowrap}
.shift-pill{display:inline-block;padding:3px 6px;border-radius:5px;font-size:9.5px;font-weight:600;color:#fff;min-width:22px}
.shift-M{background:#10B981}.shift-E{background:#6366F1}.shift-N{background:#8B5CF6}.shift-N12{background:#EC4899}
.shift-E4{background:#3B82F6}.shift-D{background:#F43F5E}.shift-D2{background:#F43F5E}.shift-X{background:#6B7280}
.shift-OFF{background:#374151}.shift-PH{background:#F59E0B}.shift-CPL{background:#8B5CF6}.shift-EL{background:#EC4899}
.shift-CL{background:#14B8A6}.shift-ME{background:#DC2626}.shift-EN{background:#7C3AED}.shift-DX{background:#8B5CF6}
.shift-XE{background:#F59E0B}.shift-MX{background:#10B981}

}
@media (max-width:1023px){.kih-sidebar{display:none !important}}
@media (max-width:400px){.app-content{padding:12px}.card{padding:14px}}
</style>

function toast(msg,type=''){const t=$('toast');if(!t)return;t.textContent=msg;t.className='toast show '+type;clearTimeout(t._timer);t._timer=setTimeout(()=>t.className='toast '+type,2600);}
function uid(){return '_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtTime(d=new Date()){return d.toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d=new Date()){return d.toLocaleDateString('en-PK',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtDateTime(ts){const d=new Date(ts);return d.toLocaleString('en-PK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function fmtDisplay(dateStr){const d=new Date(dateStr);return d.toLocaleDateString('en-PK',{day:'numeric',month:'short',year:'numeric'});}
function dayShort(date){return new Date(date).toLocaleDateString('en-PK',{weekday:'short'});}
function isSunday(date){return new Date(date).getDay()===0;}
function isSaturday(date){return new Date(date).getDay()===6;}
function isHoliday(date,holidays=State.holidays){const key=typeof date==='string'?date:new Date(date).toISOString().split('T')[0];return holidays.some(h=>h.date===key);}
function dateRange(start,end){const dates=[];let cur=new Date(start);const last=new Date(end);while(cur<=last){dates.push(cur.toISOString().split('T')[0]);cur.setDate(cur.getDate()+1);}return dates;}
function getInitials(name){if(!name)return '?';const p=name.trim().split(/\s+/);return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'?';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeMobile(m){if(!m)return '';let s=String(m).replace(/\D/g,'');if(s.startsWith('92'))s='0'+s.slice(2);if(!s.startsWith('0'))s='0'+s;return s;}

const LocalDB = {
  KEY_PREFIX:'kih_db_',
  get(key,def=[]){try{const raw=localStorage.getItem(this.KEY_PREFIX+key);return raw?JSON.parse(raw):def;}catch{return def;}},
  set(key,val){try{localStorage.setItem(this.KEY_PREFIX+key,JSON.stringify(val));return true;}catch(e){return false;}},
  push(key,item){const arr=this.get(key,[]);if(!item._id)item._id=uid();if(!item.createdAt)item.createdAt=Date.now();arr.push(item);this.set(key,arr);return item;},
  update(key,id,updates){const arr=this.get(key,[]);const idx=arr.findIndex(x=>x._id===id);if(idx===-1)return null;arr[idx]={...arr[idx],...updates,updatedAt:Date.now()};this.set(key,arr);return arr[idx];},
  remove(key,id){const arr=this.get(key,[]);const filtered=arr.filter(x=>x._id!==id);this.set(key,filtered);return filtered;}
};

const SESSION_KEY='kih_session_v4';
const SESSION_TTL=30*24*60*60*1000;

function saveSession(user){const data={user,expires:Date.now()+SESSION_TTL};localStorage.setItem(SESSION_KEY,JSON.stringify(data));State.session=data;}
function loadSession(){try{const raw=localStorage.getItem(SESSION_KEY);if(!raw)return null;const d=JSON.parse(raw);if(Date.now()>d.expires){localStorage.removeItem(SESSION_KEY);return null;}return d;}catch{return null;}}
function clearSession(){localStorage.removeItem(SESSION_KEY);State.session=null;State.user=null;}

/* ─── AUTH ─── */
function doLogin(){
  const mobileInput=$('loginMobile'),passwordInput=$('loginPassword'),keep=$('keepSignedIn'),btn=$('loginBtn');
  if(!mobileInput||!passwordInput)return;
  const mobile=normalizeMobile(mobileInput.value.trim());
  const password=passwordInput.value.trim();
  if(!mobile||mobile.length<10){toast('Enter valid mobile','error');return;}
  if(!password){toast('Enter password','error');return;}
  if(btn){btn.disabled=true;btn.innerHTML='<span>⏳</span><span>Signing in...</span>';}
  let staffList=LocalDB.get('staff',[]);
  if(staffList.length===0){LocalDB.set('staff',[DEFAULT_ADMIN]);staffList=[DEFAULT_ADMIN];}
  const user=staffList.find(s=>normalizeMobile(s.mobile)===mobile&&s.password===password&&s.active!==false);
  if(!user){toast('Invalid mobile or password','error');if(btn){btn.disabled=false;btn.innerHTML='<span>🔓</span><span>Sign In</span>';}return;}
  State.user=user;
  if(keep&&keep.checked)saveSession(user);else clearSession();
  if(btn){btn.disabled=false;btn.innerHTML='<span>🔓</span><span>Sign In</span>';}
  showApp();
  toast(`Welcome, ${user.name.split(' ')[0]}!`,'success');
}

function doGuestLogin(){
  const guest={_id:'guest_'+Date.now(),name:'Guest User',mobile:'0000000000',designation:'phleb',role:'staff',guest:true,active:true};
  State.user=guest;clearSession();showApp();toast('Guest mode');
}

function doLogout(){
  if(!confirm('Logout?'))return;
  clearSession();State.user=null;
  $('loginScreen').style.display='flex';
  $('appHeader').classList.add('hidden');
  $('appContent').classList.add('hidden');
  $('bottomNav').classList.add('hidden');
  const sb=document.getElementById('kihSidebar');if(sb)sb.remove();
  toast('Logged out');
}

function showApp(){
  $('loginScreen').style.display='none';
  $('appHeader').classList.remove('hidden');
  $('appContent').classList.remove('hidden');
  $('bottomNav').classList.remove('hidden');
  const initials=getInitials(State.user?.name||'User');
  $('userAvatar').textContent=initials;
  $('userAvatar').title=State.user?.name||'User';
  const dot=$('onlineDot');if(dot)dot.style.background=navigator.onLine?'var(--success-l)':'var(--danger)';
  loadInitialData();
  applyLogo();
  render();
  if(window.innerWidth>=1024)setTimeout(buildSidebar,100);
}

function applyLogo(){
  const logo=localStorage.getItem('kih_hospital_logo');if(!logo)return;
  const loginLogo=$('loginLogo');if(loginLogo)loginLogo.innerHTML=`<img src="${logo}">`;
  const headerLogo=$('headerLogo');if(headerLogo)headerLogo.innerHTML=`<img src="${logo}">`;
  const sbLogo=document.querySelector('.kih-sidebar-logo-icon');if(sbLogo)sbLogo.innerHTML=`<img src="${logo}">`;
}

function loadInitialData(){
  let staff=LocalDB.get('staff',[]);if(staff.length===0){LocalDB.set('staff',[DEFAULT_ADMIN]);staff=[DEFAULT_ADMIN];}State.staff=staff;
  let tests=LocalDB.get('tests',[]);if(tests.length===0){tests=getDefaultTests();LocalDB.set('tests',tests);}State.tests=tests;
  let emergency=LocalDB.get('emergency',[]);if(emergency.length===0){emergency=getDefaultEmergency();LocalDB.set('emergency',emergency);}State.emergencyCards=emergency;
  let difficult=LocalDB.get('difficult',[]);if(difficult.length===0){difficult=getDefaultDifficult();LocalDB.set('difficult',difficult);}State.difficultDraws=difficult;
  let scripts=LocalDB.get('scripts',[]);if(scripts.length===0){scripts=getDefaultScripts();LocalDB.set('scripts',scripts);}State.scripts=scripts;
  let policies=LocalDB.get('policies',[]);if(policies.length===0){policies=getDefaultPolicies();LocalDB.set('policies',policies);}State.policies=policies;
  let shifts=LocalDB.get('shiftsSimple',[]);if(shifts.length===0){shifts=JSON.parse(JSON.stringify(DEFAULT_SHIFTS));LocalDB.set('shiftsSimple',shifts);}State.shiftsSimple=shifts;
  State.historyForms=LocalDB.get('historyForms',[]);
  State.notifications=LocalDB.get('notifications',[]);
  State.swapRequests=LocalDB.get('swaps',[]);
  State.leaveRequests=LocalDB.get('leave',[]);
  State.attendance=LocalDB.get('attendance',[]);
  State.cplActivities=LocalDB.get('cpl',[]);
  State.rejections=LocalDB.get('rejections',[]);
  State.holidays=LocalDB.get('holidays',[]);
  State.sundayIndex=LocalDB.get('sundayIndex',0);
  State.rosterData=LocalDB.get('rosterData',null);
  State.rosterPeriod=LocalDB.get('rosterPeriod',null);
  const saved=LocalDB.get('settings',null);if(saved)Object.assign(State.settings,saved);
  State.unreadCount=State.notifications.filter(n=>!n.read).length;
  updateBell();
}

function updateBell(){const b=$('bellBadge');if(!b)return;if(State.unreadCount>0){b.textContent=State.unreadCount>99?'99+':State.unreadCount;b.classList.remove('hidden');}else{b.classList.add('hidden');}}

function openModal(html){const sheet=$('modalSheet'),overlay=$('modalOverlay');if(!sheet||!overlay)return;sheet.innerHTML=html;overlay.classList.add('active');document.body.style.overflow='hidden';}
function closeModal(){const overlay=$('modalOverlay');if(!overlay)return;overlay.classList.remove('active');document.body.style.overflow='';}
window.closeModal=closeModal;
document.addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function render(){
  const main=$('appContent');if(!main)return;
  $$('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===State.activeTab));
  const renderers={home:renderHome,tests:renderTests,protocols:renderProtocols,roster:renderRoster,swap:renderSwap,learn:renderLearn,attend:renderAttend,cpl:renderCPL,more:renderMore};
  const fn=renderers[State.activeTab]||renderHome;
  main.innerHTML=fn();
  attachHandlers();
  window.scrollTo(0,0);
}

function attachHandlers(){
  $$('.nav-item').forEach(el=>{el.onclick=()=>{State.activeTab=el.dataset.tab;render();const sidebar=document.getElementById('kihSidebar');if(sidebar){sidebar.querySelectorAll('.kih-nav-item').forEach(x=>x.classList.toggle('active',x.dataset.tab===State.activeTab));}};});
  $$('[data-quick]').forEach(el=>{el.onclick=()=>{State.activeTab='protocols';State.protocolTab=el.dataset.quick;render();};});
  $$('[data-ptab]').forEach(el=>{el.onclick=()=>{State.protocolTab=el.dataset.ptab;render();};});
}

function filterItems(cls,q){const query=(q||'').toLowerCase();$$('.'+cls).forEach(el=>{const name=(el.dataset.name||'').toLowerCase();el.style.display=name.includes(query)?'':'none';});}

/* ─── TESTS ─── */
function getTubeIcon(tubeName){
  const name=(tubeName||'').toLowerCase();
  const tubeSVG=(capColor,bodyColor='#f0f0f0')=>`<svg width="28" height="56" viewBox="0 0 32 64" fill="none"><rect x="4" y="0" width="24" height="10" rx="3" fill="${capColor}"/><rect x="4" y="10" width="24" height="52" rx="4" stroke="#4B5563" stroke-width="1.5" fill="rgba(255,255,255,0.05)"/><rect x="6" y="32" width="20" height="28" rx="3" fill="${bodyColor}" opacity="0.7"/></svg>`;
  if(name.includes('edta')||name.includes('lavender'))return tubeSVG('#A78BFA','#C4B5FD');
  if(name.includes('citrate')||name.includes('blue'))return tubeSVG('#60A5FA','#93C5FD');
  if(name.includes('sst')||name.includes('gold'))return tubeSVG('#FBBF24','#FDE68A');
  if(name.includes('heparin')||name.includes('green'))return tubeSVG('#10B981','#6EE7B7');
  if(name.includes('fluoride')||name.includes('grey')||name.includes('gray'))return tubeSVG('#9CA3AF','#D1D5DB');
  if(name.includes('culture'))return tubeSVG('#F3F4F6','#FEF3C7');
  return tubeSVG('#6B7280','#9CA3AF');
}

/* ─── ROSTER GENERATION ─── */
function generateRoster(startDate,endDate){
  const dates=dateRange(startDate,endDate);
  const staffList=State.staff.filter(s=>s.active!==false&&s.role!=='admin');
  if(!staffList.length){toast('No staff available to roster','error');return null;}
  const roster={};
  staffList.forEach(s=>{roster[s._id]={};});
  const workDays={};const lastShift={};const shiftCount={};
  staffList.forEach(s=>{workDays[s._id]=0;lastShift[s._id]=null;shiftCount[s._id]={};State.shiftsSimple.forEach(sh=>{shiftCount[s._id][sh.code]=0;});});
  const males=staffList.filter(s=>s.gender==='Male');
  const anyStaff=staffList;
  let sundayIdx=State.sundayIndex||0;
  dates.forEach(date=>{
    const isSun=isSunday(date);const isSat=isSaturday(date);const holiday=isHoliday(date);
    const dayShifts=State.shiftsSimple.filter(sh=>{if(!sh.active)return false;if(['OFF','PH','CPL','EL','CL'].includes(sh.code))return false;if(holiday&&sh.code!=='PH')return false;return true;});
    const sortedStaff=[...staffList].sort((a,b)=>{const wDiff=workDays[a._id]-workDays[b._id];if(wDiff!==0)return wDiff;return (a._id||'').localeCompare(b._id||'');});
    const offThisSunday=new Set();
    if(isSun){const offCount=Math.max(1,Math.floor(staffList.length/3));for(let i=0;i<offCount;i++){const idx=(sundayIdx+i)%staffList.length;offThisSunday.add(staffList[idx]._id);}sundayIdx=(sundayIdx+offCount)%staffList.length;}
    dayShifts.forEach(shift=>{
      let needed=0;
      if(isSun)needed=shift.staffSun||0;else if(isSat)needed=shift.staffSat||0;else needed=shift.staffMonFri||0;
      if(needed===0)return;
      const pool=(shift.gender==='Male'?males:anyStaff).filter(s=>{if(offThisSunday.has(s._id))return false;if(roster[s._id][date])return false;if(shift.code==='N'&&lastShift[s._id]==='N')return false;if(workDays[s._id]>=6)return false;return true;});
      pool.sort((a,b)=>{const aCount=shiftCount[a._id][shift.code]||0;const bCount=shiftCount[b._id][shift.code]||0;if(aCount!==bCount)return aCount-bCount;return workDays[a._id]-workDays[b._id];});
      for(let i=0;i<needed&&i<pool.length;i++){const s=pool[i];roster[s._id][date]=shift.code;workDays[s._id]++;lastShift[s._id]=shift.code;shiftCount[s._id][shift.code]=(shiftCount[s._id][shift.code]||0)+1;}
    });
    staffList.forEach(s=>{if(!roster[s._id][date]){if(holiday)roster[s._id][date]='PH';else roster[s._id][date]='OFF';}});
  });
  State.sundayIndex=sundayIdx;LocalDB.set('sundayIndex',sundayIdx);
  State.rosterData=roster;State.rosterPeriod={start:startDate,end:endDate};
  LocalDB.set('rosterData',roster);LocalDB.set('rosterPeriod',State.rosterPeriod);
  return roster;
}

const QUIZ_QUESTIONS=[
  {q:'Which tube is drawn first?',a:['Blood Culture','EDTA','SST','Citrate'],correct:0},
  {q:'Which tube is used for CBC?',a:['SST','EDTA (Lavender)','Citrate','Fluoride'],correct:1},
  {q:'How many times should EDTA tube be mixed?',a:['2-3 times','5 times','8-10 times','Do not mix'],correct:2},
  {q:'Best needle gauge for adults?',a:['18G','21G-23G','25G','16G'],correct:1},
  {q:'How long should alcohol swab dry?',a:['5 sec','10 sec','30 sec','60 sec'],correct:2},
  {q:'Which tube for PT/INR?',a:['EDTA','Citrate (Blue)','SST','Heparin'],correct:1},
  {q:'Max time for tourniquet application?',a:['30 sec','1 min','2 min','5 min'],correct:1},
  {q:'When to label tubes?',a:['Before draw','At bedside immediately after','At lab','End of shift'],correct:1},
  {q:'What to do if patient faints?',a:['Call 1122','Lay down + elevate legs','Continue draw','Give water'],correct:1},
  {q:'Hemolysis cause?',a:['Slow draw','Shaking tube violently','Warm arm','Mixing properly'],correct:1}
];

let quizState=null;

function openQuizModal(){quizState={idx:0,score:0,answers:[]};renderQuizQuestion();}

function renderQuizQuestion(){
  const q=QUIZ_QUESTIONS[quizState.idx];
  if(!q)return showQuizResults();
  openModal(`<div class="modal-header"><h2>📚 Quiz (${quizState.idx+1}/${QUIZ_QUESTIONS.length})</h2><button class="modal-close" onclick="closeModal()">✕</button></div><div class="progress-bar"><div class="progress-fill" style="width:${(quizState.idx/QUIZ_QUESTIONS.length)*100}%"></div></div><div class="card"><div style="font-weight:600;font-size:16px;margin-bottom:14px">${esc(q.q)}</div>${q.a.map((opt,i)=>`<button class="btn-sm btn-block mt8" style="justify-content:flex-start;text-align:left" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${esc(opt)}</button>`).join('')}</div>`);
}

function answerQuiz(choice){const q=QUIZ_QUESTIONS[quizState.idx];if(choice===q.correct)quizState.score++;quizState.answers.push({q:q.q,correct:choice===q.correct,chosen:choice});quizState.idx++;renderQuizQuestion();}

function showQuizResults(){
  const pct=Math.round((quizState.score/QUIZ_QUESTIONS.length)*100);
  const grade=pct>=80?'🏆 Excellent':pct>=60?'👍 Good':'📖 Study More';
  openModal(`<div class="modal-header"><h2>📊 Quiz Results</h2><button class="modal-close" onclick="closeModal()">✕</button></div><div class="card text-center"><div style="font-size:56px;margin-bottom:8px">${pct>=60?'🎉':'📚'}</div><div style="font-size:32px;font-weight:700;color:${pct>=60?'var(--success)':'var(--warning)'}">${pct}%</div><div style="font-size:14px;color:var(--text-muted);margin-top:6px">${quizState.score}/${QUIZ_QUESTIONS.length} correct</div><div style="font-size:16px;font-weight:600;margin-top:12px">${grade}</div></div>${quizState.answers.map((a,i)=>`<div class="list-row" style="border-left:3px solid ${a.correct?'var(--success)':'var(--danger)'}"><span style="font-size:13px">${i+1}. ${esc(a.q)}</span><span>${a.correct?'✅':'❌'}</span></div>`).join('')}<button class="btn-primary mt12" onclick="openQuizModal()">🔄 Retake Quiz</button><button class="btn-secondary" onclick="closeModal()">Close</button>`);
}

function openHospitalSettingsModal(){
  const s=State.settings;
  openModal(`<div class="modal-header"><h2>🏥 Hospital Settings</h2><button class="modal-close" onclick="closeModal()">✕</button></div><div class="input-group"><label>Hospital Name</label><input id="hsName" value="${esc(s.hospitalName)}"></div><div class="input-group"><label>Address</label><input id="hsAddr" value="${esc(s.hospitalAddress)}"></div><div class="input-group"><label>Phone</label><input id="hsPhone" value="${esc(s.hospitalPhone)}"></div><div class="input-group"><label>Header Text</label><input id="hsHeader" value="${esc(s.headerText)}"></div><div class="input-group"><label>Upload Logo (PNG/JPG)</label><input id="hsLogo" type="file" accept="image/*" onchange="handleLogoUpload(event)"></div><button class="btn-primary" onclick="saveHospitalSettings()">💾 Save Settings</button><button class="btn-secondary" onclick="closeModal()">Cancel</button>`);
}

function saveHospitalSettings(){
  State.settings.hospitalName=$('hsName')?.value.trim()||'';
  State.settings.hospitalAddress=$('hsAddr')?.value.trim()||'';
  State.settings.hospitalPhone=$('hsPhone')?.value.trim()||'';
  State.settings.headerText=$('hsHeader')?.value.trim()||'';
  LocalDB.set('settings',State.settings);
  closeModal();toast('Settings saved','success');render();
}

function handleLogoUpload(e){
  const file=e.target.files?.[0];if(!file)return;
  if(file.size>500000){toast('Image must be < 500KB','error');return;}
  const reader=new FileReader();
  reader.onload=ev=>{localStorage.setItem('kih_hospital_logo',ev.target.result);applyLogo();toast('Logo uploaded','success');};
  reader.readAsDataURL(file);
}

function exportAllData(){
  const data={exportedAt:new Date().toISOString(),staff:LocalDB.get('staff',[]),tests:LocalDB.get('tests',[]),roster:LocalDB.get('rosterData',null),rosterPeriod:LocalDB.get('rosterPeriod',null),swaps:LocalDB.get('swaps',[]),attendance:LocalDB.get('attendance',[]),cpl:LocalDB.get('cpl',[]),rejections:LocalDB.get('rejections',[]),holidays:LocalDB.get('holidays',[]),notifications:LocalDB.get('notifications',[]),settings:LocalDB.get('settings',{})};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`kih-backup-${new Date().toISOString().split('T')[0]}.json`;a.click();
  URL.revokeObjectURL(url);toast('Data exported','success');
}

/* ─── BOOT ─── */
function bootApp(){
  const loginBtn=$('loginBtn');if(loginBtn)loginBtn.onclick=doLogin;
  const guestBtn=$('guestBtn');if(guestBtn)guestBtn.onclick=doGuestLogin;
  const pass=$('loginPassword');if(pass)pass.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  const logoutBtn=$('logoutBtn');if(logoutBtn)logoutBtn.onclick=doLogout;
  const bell=$('notificationBell');if(bell)bell.onclick=openNotificationsModal;
  const avatar=$('userAvatar');if(avatar)avatar.onclick=()=>{State.activeTab='more';render();};
  window.addEventListener('online',()=>{State.online=true;const dot=$('onlineDot');if(dot)dot.style.background='var(--success-l)';toast('Back online','success');});
  window.addEventListener('offline',()=>{State.online=false;const dot=$('onlineDot');if(dot)dot.style.background='var(--danger)';toast('Offline mode','warning');});
  let lastDesktop=window.innerWidth>=1024;
  window.addEventListener('resize',()=>{const isDesktop=window.innerWidth>=1024;if(isDesktop!==lastDesktop){lastDesktop=isDesktop;if(isDesktop&&State.user)buildSidebar();else{const sb=document.getElementById('kihSidebar');if(sb)sb.remove();}}});
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-copy]');if(btn){const text=btn.getAttribute('data-copy');navigator.clipboard.writeText(text).then(()=>toast('Copied!','success')).catch(()=>toast('Copy failed','error'));}});
  const session=loadSession();
  if(session&&session.user){
    State.user=session.user;State.session=session;
    const staffList=LocalDB.get('staff',[DEFAULT_ADMIN]);
    const found=staffList.find(s=>s._id===session.user._id);
    if(found||session.user.guest){showApp();return;}
    clearSession();
  }
  $('loginScreen').style.display='flex';
}

bootApp();

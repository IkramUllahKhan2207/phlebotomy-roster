<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>KIH Phlebotomy Companion</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
/* ============================================================
   PART 1: ALL CSS
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#0a0e1a;color:#e5e9f0;min-height:100vh;font-size:15px}
body{padding-bottom:82px;overflow-x:hidden}
:root{
  --bg:#0a0e1a;--bg2:#0f1422;--card:#141a2b;--card2:#1a1f30;
  --border:#1e2538;--border2:#2a334d;--text:#e5e9f0;--muted:#8e9bb5;--muted2:#6a7a9a;
  --primary:#4f7df3;--primary-d:#3b66d6;--success:#2e7d5e;--success-l:#5bf3a0;
  --danger:#f35b5b;--danger-d:#d44a4a;--warn:#f3a54f;--warn-bg:#3d3d1e;
}
.hidden{display:none!important}
.flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-center{display:flex;align-items:center;justify-content:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.text-muted{color:var(--muted)}.text-sm{font-size:13px}.text-xs{font-size:11px}
.text-center{text-align:center}.bold{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:2000}
.login-card{background:var(--card);border-radius:28px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,.6);border:1px solid var(--border2)}
.login-card h1{font-size:26px;font-weight:600;margin-bottom:6px;color:#fff;letter-spacing:-.5px}
.login-card .sub{color:var(--muted);margin-bottom:24px;font-size:14px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--border2);background:var(--bg2);color:#fff;font-size:15px;outline:none;transition:border .2s;font-family:inherit}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--primary)}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;color:var(--muted);font-size:14px;cursor:pointer}
.checkbox-row input{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.btn-primary{width:100%;padding:16px;border-radius:20px;background:var(--primary);color:#fff;font-weight:600;font-size:16px;border:none;cursor:pointer;transition:background .2s;margin-bottom:10px}
.btn-primary:hover{background:var(--primary-d)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{width:100%;padding:16px;border-radius:20px;background:transparent;color:var(--muted);font-weight:500;font-size:15px;border:1px solid var(--border2);cursor:pointer;transition:background .2s}
.btn-secondary:hover{background:var(--card2)}
.login-footer{margin-top:20px;text-align:center;color:var(--muted2);font-size:12px}

/* HEADER */
.app-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-left{display:flex;align-items:center;gap:10px}
.header-left .logo{font-size:22px}
.header-left .title{font-weight:600;font-size:16px;color:#fff}
.header-right{display:flex;align-items:center;gap:14px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--muted);position:relative;transition:background .2s}
.icon-btn:hover{background:var(--border2)}
.bell-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;min-width:18px;text-align:center;line-height:1.3}
.user-initials{width:38px;height:38px;border-radius:50%;background:var(--border2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--text);cursor:pointer;border:1px solid #3e4a66}
.logout-link{color:var(--danger);font-size:13px;font-weight:500;cursor:pointer;padding:6px 10px;border-radius:10px;white-space:nowrap}
.logout-link:hover{background:rgba(243,91,91,.1)}

/* CONTENT */
.app-content{padding:18px 16px;max-width:640px;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.card-title{font-size:17px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:#fff}
.card-sub{color:var(--muted);font-size:13.5px;line-height:1.55}
.badge{background:var(--border2);color:#b0bdd6;font-size:11.5px;padding:4px 11px;border-radius:40px;font-weight:500;white-space:nowrap}
.badge-red{background:#3d1e1e;color:var(--danger)}
.badge-green{background:#1e3d2a;color:var(--success-l)}
.badge-yellow{background:var(--warn-bg);color:#f3d35b}
.badge-blue{background:#1e2a3d;color:#7da3f3}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-sm{padding:10px 16px;border-radius:40px;font-size:13.5px;font-weight:500;border:none;cursor:pointer;background:var(--border2);color:var(--text);display:inline-flex;align-items:center;gap:6px;transition:background .2s;font-family:inherit}
.btn-sm:hover{background:#3e4a66}
.btn-sm:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--primary);color:#fff}
.btn-accent:hover{background:var(--primary-d)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-d)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#256a4f}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted)}
.btn-outline:hover{background:var(--card2)}
.btn-block{width:100%;justify-content:center;padding:14px}

/* BIG BUTTONS */
.big-btn{border-radius:22px;padding:18px;text-align:center;font-weight:700;font-size:17px;border:none;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;font-family:inherit;margin-bottom:12px}
.big-btn-draw{background:var(--success);color:#fff;box-shadow:0 8px 20px rgba(46,125,94,.3)}
.big-btn-draw:hover{background:#256a4f}
.big-btn-emergency{background:var(--danger);color:#fff;box-shadow:0 8px 20px rgba(243,91,91,.3)}
.big-btn-emergency:hover{background:var(--danger-d)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 2px 14px;z-index:100;overflow-x:auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);font-size:10.5px;font-weight:500;cursor:pointer;padding:4px 6px;border-radius:12px;transition:color .15s;min-width:52px;flex-shrink:0}
.nav-item.active{color:var(--primary)}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item.active .nav-icon{transform:scale(1.08)}

/* TOAST */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--border2);color:#fff;padding:12px 22px;border-radius:40px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:3000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;border:1px solid #3e4a66;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.success{background:var(--success);border-color:var(--success)}
.toast.error{background:var(--danger);border-color:var(--danger)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal-sheet{background:var(--card);border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:20px 18px 30px;border-top:1px solid var(--border2);animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;position:sticky;top:-20px;background:var(--card);padding:4px 0 12px;z-index:2}
.modal-header h2{font-size:19px;font-weight:600;color:#fff}
.modal-close{background:var(--border2);border:none;color:#b0bdd6;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{background:#3e4a66}

/* SEARCH */
.search-bar{width:100%;padding:13px 16px;border-radius:40px;border:1px solid var(--border);background:var(--bg2);color:#fff;font-size:14.5px;outline:none;margin-bottom:14px;font-family:inherit}
.search-bar:focus{border-color:var(--primary)}
.search-bar::placeholder{color:var(--muted2)}

/* STEP LIST */
.step-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.step-item:last-child{border-bottom:none}
.step-check{width:26px;height:26px;border-radius:9px;border:2px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .2s}
.step-check.done{background:var(--success);border-color:var(--success);color:#fff}
.step-content{flex:1}
.step-title{font-weight:500;font-size:14.5px;color:var(--text);line-height:1.4}
.step-time{font-size:11px;color:var(--success-l);margin-top:4px}

/* EMERGENCY CARD */
.emergency-card{background:var(--card2);border-radius:18px;padding:14px;margin-bottom:10px;border-left:5px solid var(--danger);cursor:pointer;transition:transform .15s}
.emergency-card:hover{transform:translateX(3px)}
.emergency-card h3{font-size:15.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:#fff}
.emergency-steps{color:#b0bdd6;font-size:13.5px;line-height:1.65;list-style:none}
.emergency-steps li{margin-bottom:3px;padding-left:14px;position:relative}
.emergency-steps li::before{content:"•";color:var(--danger);position:absolute;left:0;font-weight:bold}

/* TABS */
.tab-bar{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:40px;background:var(--card);color:var(--muted);font-size:13.5px;font-weight:500;white-space:nowrap;border:1px solid var(--border);cursor:pointer;transition:all .15s;font-family:inherit}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* MISC */
.progress-bar{background:var(--border);height:9px;border-radius:10px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--primary);border-radius:10px;transition:width .4s}
.list-row{background:var(--bg2);border-radius:14px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--border2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.divider{height:1px;background:var(--border);margin:12px 0}
.empty-state{text-align:center;padding:32px 16px;color:var(--muted)}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:.5}
.spinner{width:20px;height:20px;border:2.5px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.stat-box{background:var(--bg2);border-radius:16px;padding:14px;text-align:center}
.stat-box .num{font-size:26px;font-weight:700;line-height:1.1}
.stat-box .lbl{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ROSTER TABLE */
.roster-table{width:100%;border-collapse:collapse;font-size:12.5px}
.roster-table th{text-align:center;padding:7px 3px;color:var(--muted2);font-weight:500;font-size:11.5px}
.roster-table th:first-child{text-align:left}
.roster-table td{padding:7px 3px;text-align:center;border-top:1px solid var(--border)}
.roster-table td:first-child{text-align:left;font-weight:500;white-space:nowrap;padding-right:8px}
.shift-pill{padding:4px 7px;border-radius:20px;font-size:10.5px;display:inline-block;color:#fff;font-weight:500;min-width:52px}
.shift-M{background:var(--success)}
.shift-E{background:var(--primary)}
.shift-N{background:#6a4fbf}
.shift-O{background:var(--border2);color:var(--muted)}
</style>
</head>
<body>

<!-- ============================================================
     PART 2: HTML BODY
     ============================================================ -->

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>🩸 KIH Phlebotomy</h1>
    <p class="sub">Kulsum International Hospital · Islamabad</p>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@kih.pk" autocomplete="email">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <label class="checkbox-row">
      <input type="checkbox" id="keepSignedIn" checked>
      <span>Keep me signed in (30 days)</span>
    </label>
    <button class="btn-primary" id="loginBtn">Sign In</button>
    <button class="btn-secondary" id="guestBtn">Continue as Guest</button>
    <div class="login-footer">Session persists 30 days · Firebase Auth</div>
  </div>
</div>

<!-- APP HEADER -->
<header class="app-header hidden" id="appHeader">
  <div class="header-left">
    <span class="logo">🩸</span>
    <span class="title">Phlebotomy</span>
  </div>
  <div class="header-right">
    <div class="icon-btn" id="notificationBell">
      🔔<span class="bell-badge hidden" id="bellBadge">0</span>
    </div>
    <div class="user-initials" id="userInitials">?</div>
    <span class="logout-link" id="logoutBtn">Logout</span>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="app-content hidden" id="appContent"></main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav hidden" id="bottomNav">
  <div class="nav-item active" data-tab="home"><span class="nav-icon">🏠</span><span>Home</span></div>
  <div class="nav-item" data-tab="tests"><span class="nav-icon">🧪</span><span>Tests</span></div>
  <div class="nav-item" data-tab="protocols"><span class="nav-icon">📋</span><span>Protocols</span></div>
  <div class="nav-item" data-tab="roster"><span class="nav-icon">📅</span><span>Roster</span></div>
  <div class="nav-item" data-tab="swap"><span class="nav-icon">🔄</span><span>Swap</span></div>
  <div class="nav-item" data-tab="learn"><span class="nav-icon">📚</span><span>Learn</span></div>
  <div class="nav-item" data-tab="attend"><span class="nav-icon">✅</span><span>Attend</span></div>
  <div class="nav-item" data-tab="cpl"><span class="nav-icon">📈</span><span>CPL</span></div>
  <div class="nav-item" data-tab="more"><span class="nav-icon">⋯</span><span>More</span></div>
</nav>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<script>
/* ============================================================
   PART 3: FIREBASE CONFIG + STATE + HELPERS
   ============================================================
   
   ⚠️  IMPORTANT: Replace this config with YOUR real Firebase config!
   Steps:
   1. Go to https://console.firebase.google.com
   2. Create project "kih-phlebotomy"
   3. Enable Realtime Database + Email/Password Auth
   4. Copy config below from Project Settings → Your apps
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDemo_REPLACE_WITH_YOUR_REAL_KEY",
  authDomain: "kih-phlebotomy.firebaseapp.com",
  databaseURL: "https://kih-phlebotomy-default-rtdb.firebaseio.com",
  projectId: "kih-phlebotomy",
  storageBucket: "kih-phlebotomy.appspot.com",
  messagingSenderId: "000000000000",
  appId: "1:000000000000:web:0000000000000000000000"
};

/* Detect if config is placeholder → use local demo mode */
const IS_DEMO = firebaseConfig.apiKey.includes('Demo') || firebaseConfig.apiKey.includes('REPLACE');

let db = null, auth = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  auth = firebase.auth();
  // Enable offline persistence (only works with real config)
  if (!IS_DEMO) {
    try {
      db.ref('.info/connected').on('value', s => {
        State.online = s.val() === true;
        updateOnlineBadge();
      });
    } catch(e){}
  }
} catch(e) {
  console.warn('Firebase init skipped (demo mode):', e.message);
}

/* ---------- STATE ---------- */
const State = {
  user: null,
  online: navigator.onLine,
  activeTab: 'home',
  protocolTab: 'order',
  rosterWeekOffset: 0,
  startDraw: { active:false, steps:[], patient:'', notes:'', startTime:null },
  favorites: JSON.parse(localStorage.getItem('kih_favs') || '[]'),
  notifications: [],
  unreadCount: 0,
  listeners: [],
  tests: [],
  staff: [],
  policies: [],
  quizzes: [],
  cplActivities: [],
  swapRequests: [],
  attendance: [],
  leaveRequests: [],
  rosterData: null,
  rejections: []
};

/* ---------- HELPERS ---------- */
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

function toast(msg, type='') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast ' + type, 2400);
}

function getInitials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
}

function fmtTime(d=new Date()) {
  return d.toLocaleTimeString('en-PK', {hour:'2-digit',minute:'2-digit'});
}
function fmtDate(d=new Date()) {
  return d.toLocaleDateString('en-PK',{weekday:'short',day:'numeric',month:'short'});
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('en-PK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function saveFavorites(){ localStorage.setItem('kih_favs', JSON.stringify(State.favorites)); }
function toggleFav(id){
  const i = State.favorites.indexOf(id);
  if (i>=0) State.favorites.splice(i,1); else State.favorites.push(id);
  saveFavorites();
}
function isFav(id){ return State.favorites.includes(id); }

function updateOnlineBadge(){
  const el = $('appHeader');
  if (!el) return;
  let dot = el.querySelector('.online-dot');
  if (!dot) {
    dot = document.createElement('span');
    dot.className = 'online-dot';
    dot.style.cssText = 'width:8px;height:8px;border-radius:50%;margin-left:6px;display:inline-block';
    el.querySelector('.header-left').appendChild(dot);
  }
  dot.style.background = State.online ? '#5bf3a0' : '#f35b5b';
  dot.title = State.online ? 'Online' : 'Offline';
}

/* Firebase refs (safe for demo) */
function ref(path) {
  if (!db || IS_DEMO) return null;
  return db.ref(path);
}

/* Safe read/write with demo fallback (localStorage) */
const LocalDB = {
  get(key, def=[]) {
    try { return JSON.parse(localStorage.getItem('kihdb_'+key) || JSON.stringify(def)); }
    catch { return def; }
  },
  set(key, val) {
    localStorage.setItem('kihdb_'+key, JSON.stringify(val));
  },
  push(key, val) {
    const arr = LocalDB.get(key, []);
    const item = { ...val, id: '_' + Date.now() + Math.random().toString(36).slice(2,7), createdAt: Date.now() };
    arr.push(item);
    LocalDB.set(key, arr);
    return item;
  }
};

/* Push to Firebase if available, else localStorage */
async function pushData(path, data) {
  if (db && !IS_DEMO && State.online) {
    try {
      const r = await ref(path).push({ ...data, createdAt: firebase.database.ServerValue.TIMESTAMP });
      return { id: r.key, ...data };
    } catch(e) { console.warn('Firebase push failed, using local:', e.message); }
  }
  return LocalDB.push(path, data);
}

/* Read from Firebase if available, else localStorage */
function readData(path, callback) {
  if (db && !IS_DEMO) {
    try {
      ref(path).on('value', snap => {
        const val = snap.val();
        const arr = val ? Object.entries(val).map(([id,v]) => ({ id, ...v })) : [];
        callback(arr);
      }, err => {
        console.warn('Firebase read failed:', err.message);
        callback(LocalDB.get(path, []));
      });
      return;
    } catch(e){}
  }
  callback(LocalDB.get(path, []));
}

/* ============================================================
   PART 4: AUTH + SESSION PERSISTENCE (30 days)
   ============================================================ */
const SESSION_KEY = 'kih_session_v2';
const SESSION_TTL = 30 * 24 * 60 * 60 * 1000;

function saveSession(user) {
  const data = { user, expires: Date.now() + SESSION_TTL };
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (Date.now() > d.expires) { localStorage.removeItem(SESSION_KEY); return null; }
    return d;
  } catch { return null; }
}
function clearSession() { localStorage.removeItem(SESSION_KEY); }

async function doLogin() {
  const email = $('loginEmail').value.trim();
  const password = $('loginPassword').value;
  const keep = $('keepSignedIn').checked;
  if (!email || !password) { toast('Enter email & password', 'error'); return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in...';

  let user = null;
  if (auth && !IS_DEMO) {
    try {
      // Set persistence
      await auth.setPersistence(keep ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      const cred = await auth.signInWithEmailAndPassword(email, password);
      user = { uid: cred.user.uid, email: cred.user.email, displayName: cred.user.displayName || email.split('@')[0] };
    } catch(e) {
      // If user doesn't exist, create (for first-time demo)
      if (e.code === 'auth/user-not-found') {
        try {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await cred.user.updateProfile({ displayName: email.split('@')[0] });
          user = { uid: cred.user.uid, email, displayName: email.split('@')[0] };
        } catch(e2) {
          toast('Login failed: ' + e2.message, 'error');
          btn.disabled = false; btn.textContent = 'Sign In';
          return;
        }
      } else {
        toast('Login failed: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = 'Sign In';
        return;
      }
    }
  } else {
    // Demo mode
    user = { uid: 'demo_' + btoa(email).slice(0,10), email, displayName: email.split('@')[0] };
  }

  State.user = user;
  if (keep) saveSession(user);
  else clearSession();
  btn.disabled = false; btn.textContent = 'Sign In';
  showApp();
  toast('Welcome, ' + user.displayName, 'success');
}

function doGuestLogin() {
  const user = { uid: 'guest_' + Date.now(), email: 'guest@kih.pk', displayName: 'Guest User', guest: true };
  State.user = user;
  clearSession();
  showApp();
  toast('Continuing as guest');
}

function doLogout() {
  clearSession();
  if (auth && !IS_DEMO) auth.signOut().catch(()=>{});
  State.user = null;
  State.listeners.forEach(u => { try { u(); } catch(e){} });
  State.listeners = [];

function showApp() {

    State.notifications = arr.sort((a,b) => (b.createdAt||0)-(a.createdAt||0));

  State.rejections.forEach(r => { stats[r.reason] = (stats[r.reason]||0)+1; });
  const top = Object.entries(stats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `
    <div class="card" style="background:var(--card2)">
      <div class="card-title">📊 Rejection Statistics</div>
      <div class="card-sub mt8">
        Total reported: <strong>${State.rejections.length}</strong>
        ${top.length ? `<br>Most common: ${top.map(([k,v])=>`<strong style="color:var(--danger)">${esc(k)}</strong> (${v})`).join(' · ')}` : ''}
      </div>
      <button class="btn-sm btn-danger mt12" onclick="openReportRejectionModal()">🚫 Report Rejection</button>
    </div>
    <input class="search-bar" placeholder="Search reasons..." oninput="filterList('rejection-item', this.value)">
    <div id="rejectionList">
      ${reasons.map(r=>`
        <div class="card rejection-item" data-name="${esc(r.title.toLowerCase())} ${esc(r.why.toLowerCase())}">
          <div class="flex-between">
            <div class="card-title" style="font-size:15px">${esc(r.title)}</div>
            <button class="btn-sm" style="padding:6px 12px" onclick="toggleFav('${r.id}');render();toast(isFav('${r.id}')?'★ Favorited':'Removed')">${isFav(r.id)?'★':'☆'}</button>
          </div>
          <div class="mt12 text-sm" style="line-height:1.65;color:#b0bdd6">
            <p><strong style="color:var(--primary)">🔍 Detect:</strong> ${esc(r.how)}</p>
            <p class="mt8"><strong style="color:var(--danger)">⚠️ Why:</strong> ${esc(r.why)}</p>
            <p class="mt8"><strong style="color:var(--success-l)">🛡️ Prevent:</strong> ${esc(r.prevent)}</p>

          </div>
        </div>
      `).join('')}
    </div>
  `;
}

                  const label = {M:'Morning',E:'Evening',N:'Night',O:'Off'}[v];
                  return `<td><span class="shift-pill shift-${v}">${label}</span></td>`;

function generateRosterData(staff, days) {
  const shifts = ['M','M','M','E','E','E','O','O','N'];
  const result = [];
  staff.forEach((s,i)=>{
    const row = { name: s.name || s.displayName || 'Staff' };
    days.forEach((d,j)=>{
      row[d] = shifts[(i*3+j) % shifts.length];
    });
    result.push(row);
  });
  return result;
}

function autoGenerateRoster() {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  State.rosterData = generateRosterData(State.staff.length ? State.staff : [{name:'Staff 1'},{name:'Staff 2'},{name:'Staff 3'}], days);
  render();
  toast('Roster auto-generated','success');
}

function openQuizModal() {
  const questions = [
    { q:'What is the correct order of draw?', opts:['EDTA → SST → Citrate','Blood Culture → Citrate → SST → Heparin → EDTA → Fluoride','SST → EDTA → Citrate','Fluoride → EDTA → SST'], ans:1 },
    { q:'Tourniquet should not be left on for more than:', opts:['30 sec','1 minute','2 minutes','5 minutes'], ans:1 },
    { q:'Which tube for CBC?', opts:['SST Gold','EDTA Lavender','Citrate Blue','Fluoride Grey'], ans:1 },
    { q:'Angle for venipuncture:', opts:['5-10°','15-30°','45°','90°'], ans:1 },
    { q:'After needle stick injury, first action:', opts:['Report to supervisor','Wash with soap and water 5 min','Take PEP','Fill incident form'], ans:1 }
  ];
  let idx = 0, score = 0;
  function renderQ() {
    if (idx >= questions.length) {
      $('modalSheet').innerHTML = `
        <div class="modal-header"><h2>Quiz Complete</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="text-center" style="padding:24px 0">
          <div style="font-size:48px">${score >= questions.length*0.7 ? '🎉' : '📚'}</div>
          <h2 style="margin:12px 0;color:#fff">${score} / ${questions.length}</h2>
          <div class="text-muted">${score >= questions.length*0.7 ? 'Great job!' : 'Keep practicing!'}</div>
        </div>
        <button class="btn-primary" onclick="closeModal()">Close</button>
      `;
      return;
    }
    const q = questions[idx];
    $('modalSheet').innerHTML = `
      <div class="modal-header"><h2>Q${idx+1}/${questions.length}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="card-sub mb12">${esc(q.q)}</div>
      ${q.opts.map((o,i)=>`<button class="btn-sm btn-block btn-outline mb8" style="justify-content:flex-start" onclick="window._quizAns(${i},${q.ans})">${esc(o)}</button>`).join('')}
      <div class="progress-bar mt12"><div class="progress-fill" style="width:${(idx/questions.length)*100}%"></div></div>
    `;
  }
  window._quizAns = (chosen, correct) => {
    if (chosen === correct) score++;
    idx++;
    renderQ();
  };
  renderQ();
}

/* Start Draw Modal */
function openStartDrawModal() {
  const steps = [
    'Verify order (test name, patient name)',
    'Identify patient (name, MR number, DOB — 3 times)',
    'Prepare equipment (needle, tube, cotton, spirit swab, bandage)',
    'Hand hygiene (sanitizer, gloves)',
    'Apply tourniquet (3-4 inch above, max 1 minute)',
    'Select vein (antecubital area)',
    'Clean site (spirit swab, circular, 30 sec)',
    'Insert needle (15-30 degree angle)',
    'Fill tubes (follow order of draw)',
    'Remove tourniquet',
    'Remove needle (cotton, pressure)',
    'Label tube (patient name, time, initials)',
    'Mix (invert 8-10 times)',
    'Sit patient (5-10 min rest)',
    'Send to lab (time stamp)'
  ];
  if (!State.startDraw.active || State.startDraw.steps.length === 0) {
    State.startDraw.steps = steps.map((t,i)=>({id:i+1, text:t, done:false, time:null}));
    State.startDraw.active = true;
    State.startDraw.startTime = Date.now();
  }
  const done = State.startDraw.steps.filter(s=>s.done).length;
  const pct = (done/steps.length)*100;
  openModal(`
    <div class="modal-header">
      <h2>🩸 Start Draw</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="input-group">
      <label>Patient Name / MR Number</label>
      <input id="drawPatient" placeholder="Patient name or MR#" value="${esc(State.startDraw.patient)}" oninput="State.startDraw.patient=this.value">
    </div>
    <div class="input-group">
      <label>Notes (optional)</label>
      <textarea id="drawNotes" rows="2" placeholder="Any special observations..." oninput="State.startDraw.notes=this.value">${esc(State.startDraw.notes)}</textarea>
    </div>
    <div class="flex-between mt12 mb8">
      <span class="text-sm text-muted">Progress</span>
      <strong class="text-sm">${done}/${steps.length}</strong>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="max-height:42vh;overflow-y:auto;margin-top:12px">
      ${State.startDraw.steps.map((s,i)=>`
        <div class="step-item">
          <div class="step-check ${s.done?'done':''}" onclick="toggleDrawStep(${i})">✓</div>
          <div class="step-content">
            <div class="step-title">${i+1}. ${esc(s.text)}</div>
            ${s.time?`<div class="step-time">✅ ${esc(s.time)}</div>`:''}
          </div>
        </div>
      `).join('')}
    </div>
    <div class="btn-row mt16">
      <button class="btn-sm btn-success" style="flex:1;justify-content:center" onclick="completeDraw()">✅ Complete Draw</button>
      <button class="btn-sm btn-outline" onclick="closeModal()">Save & Close</button>
    </div>
  `);
}

function toggleDrawStep(i) {
  const s = State.startDraw.steps[i];
  s.done = !s.done;
  s.time = s.done ? fmtTime() : null;
  openStartDrawModal();
}

async function completeDraw() {
  const done = State.startDraw.steps.filter(s=>s.done).length;
  const total = State.startDraw.steps.length;
  if (done < total) {
    if (!confirm(`Only ${done}/${total} steps done. Complete anyway?`)) return;
  }
  const data = {
    patient: State.startDraw.patient || 'Unknown',
    staff: State.user?.displayName || 'Guest',
    completedAt: Date.now(),
    stepsDone: done,
    totalSteps: total,
    notes: State.startDraw.notes
  };
  await pushData('draws', data);
  await pushData('notifications', { title:'Draw completed', body:`Patient: ${data.patient} (${done}/${total} steps)`, read:false, type:'draw' });
  State.startDraw.active = false;
  State.startDraw.steps = [];
  State.startDraw.patient = '';
  State.startDraw.notes = '';
  closeModal();
  render();
  toast('✅ Sample collected!', 'success');
}

/* Report Rejection */
function openReportRejectionModal() {
  const reasons = ['Hemolysis','Clotting','Short Volume','Wrong Tube','Mislabeled','Delayed Transport','Contaminated','Other'];
  openModal(`
    <div class="modal-header"><h2>🚫 Report Rejection</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="input-group"><label>Patient / Sample ID</label><input id="rejPatient" placeholder="Patient name or sample ID"></div>
    <div class="input-group"><label>Reason</label><select id="rejReason">${reasons.map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="input-group"><label>Details</label><textarea id="rejNotes" rows="2" placeholder="What happened?"></textarea></div>
    <button class="btn-primary" onclick="submitRejection()">Submit Report</button>
  `);
}
async function submitRejection() {
  const patient = $('rejPatient').value.trim();
  const reason = $('rejReason').value;
  const notes = $('rejNotes').value.trim();
  if (!patient) { toast('Enter patient ID','error'); return; }
  const data = { patient, reason, notes, staff: State.user?.displayName || 'User' };
  await pushData('rejections', data);
  State.rejections.push(data);
  closeModal();
  if (State.activeTab === 'protocols') render();
  toast('Rejection reported','success');
}

/* Staff Modal */
function openStaffModal() {
  openModal(`
    <div class="modal-header"><h2>👥 Staff Management</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="input-group"><label>Name</label><input id="staffName" placeholder="Full name"></div>
    <div class="input-group"><label>Role</label><select id="staffRole"><option>Phlebotomist</option><option>Technician</option><option>Nurse</option><option>Supervisor</option></select></div>
    <div class="input-group"><label>Email</label><input id="staffEmail" type="email" placeholder="email@kih.pk"></div>
    <button class="btn-primary" onclick="submitStaff()">Add Staff</button>
    <div class="divider"></div>
    <div class="card-title text-sm">Current Staff (${State.staff.length})</div>
    ${State.staff.map(s=>`<div class="list-row"><span>${esc(s.name)}</span><span class="badge">${esc(s.role)}</span></div>`).join('') || '<div class="empty-state text-sm">No staff yet</div>'}
  `);
}
async function submitStaff() {
  const name = $('staffName').value.trim();
  const role = $('staffRole').value;
  const email = $('staffEmail').value.trim();
  if (!name) { toast('Enter name','error'); return; }
  const data = { name, role, email };
  await pushData('staff', data);
  State.staff.push(data);
  openStaffModal();
  toast('Staff added','success');
}

/* Leave Modal */
function openLeaveModal() {
  openModal(`
    <div class="modal-header"><h2>🏖️ Leave Management</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="input-group"><label>From date</label><input id="leaveFrom" type="date"></div>
    <div class="input-group"><label>To date</label><input id="leaveTo" type="date"></div>
    <div class="input-group"><label>Type</label><select id="leaveType"><option>Annual</option><option>Sick</option><option>Emergency</option><option>Unpaid</option></select></div>
    <div class="input-group"><label>Reason</label><textarea id="leaveReason" rows="2"></textarea></div>
    <button class="btn-primary" onclick="submitLeave()">Request Leave</button>
    <div class="divider"></div>
    <div class="card-title text-sm">My Requests (${State.leaveRequests.length})</div>
    ${State.leaveRequests.map(l=>`<div class="list-row"><span>${esc(l.from)} → ${esc(l.to)}</span><span class="badge badge-yellow">pending</span></div>`).join('') || '<div class="empty-state text-sm">No leave requests</div>'}
  `);
}
async function submitLeave() {
  const from = $('leaveFrom').value, to = $('leaveTo').value;
  if (!from || !to) { toast('Select dates','error'); return; }
  const data = { from, to, type: $('leaveType').value, reason: $('leaveReason').value.trim(), status:'pending', staff: State.user?.displayName || 'User' };
  await pushData('leave', data);
  State.leaveRequests.push(data);
  openLeaveModal();
  toast('Leave requested','success');
}

/* Policies Modal */
function openPoliciesModal() {
  if (State.policies.length === 0) { seedPolicies(); setTimeout(openPoliciesModal, 500); return; }
  const ackd = JSON.parse(localStorage.getItem('kih_ack_policies') || '[]');
  openModal(`
    <div class="modal-header"><h2>📜 Policies</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${State.policies.map((p,i)=>`
      <div class="card" style="margin-bottom:10px">
        <div class="flex-between">
          <div class="bold">${esc(p.title)}</div>
          ${ackd.includes(p.title) ? '<span class="badge badge-green">✓ Acknowledged</span>' : '<span class="badge badge-yellow">Pending</span>'}
        </div>
        <div class="card-sub mt8">${esc(p.body)}</div>
        ${!ackd.includes(p.title) ? `<button class="btn-sm btn-accent mt12" onclick="ackPolicy('${esc(p.title).replace(/'/g,"\\'")}')">✓ I Acknowledge</button>` : ''}
      </div>
    `).join('')}
  `);
}
function ackPolicy(title) {
  const ackd = JSON.parse(localStorage.getItem('kih_ack_policies') || '[]');
  if (!ackd.includes(title)) ackd.push(title);
  localStorage.setItem('kih_ack_policies', JSON.stringify(ackd));
  openPoliciesModal();
  toast('Policy acknowledged','success');
}

/* Notifications Modal */
function openNotificationsModal() {
  const notifs = State.notifications.length ? State.notifications :
    [{title:'Welcome to KIH Phlebotomy', body:'Your companion app is ready.', read:false, createdAt:Date.now()}];
  // Mark all read
  State.notifications.forEach(n=>n.read=true);
  State.unreadCount = 0;
  updateBell();
  openModal(`
    <div class="modal-header"><h2>🔔 Notifications</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${notifs.map(n=>`
      <div class="list-row" style="flex-direction:column;align-items:stretch;gap:4px;${!n.read?'border-left:3px solid var(--primary)':''}">
        <div class="flex-between">
          <div class="bold text-sm">${esc(n.title)}</div>
          <div class="text-xs text-muted">${n.createdAt?fmtDateTime(n.createdAt):''}</div>
        </div>
        <div class="text-xs text-muted">${esc(n.body||'')}</div>
      </div>
    `).join('')}
  `);
}

function attachHandlers() {
  $$('.nav-item').forEach(el=>{
    el.onclick = () => { State.activeTab = el.dataset.tab; render(); };
  });
  const sd = $('startDrawBtn'); if (sd) sd.onclick = openStartDrawModal;
  const em = $('emergencyBtn'); if (em) em.onclick = openEmergencyModal;
  $$('[data-quick]').forEach(el=>{
    el.onclick = () => {
      const q = el.dataset.quick;
      State.activeTab = 'protocols';
      State.protocolTab = q;
      render();
    };
  });
  $$('[data-ptab]').forEach(el=>{
    el.onclick = () => { State.protocolTab = el.dataset.ptab; render(); };
  });
}

/* Login/Logout listeners */
$('loginBtn').onclick = doLogin;
$('guestBtn').onclick = doGuestLogin;
$('logoutBtn').onclick = doLogout;
$('notificationBell').onclick = openNotificationsModal;
$('loginPassword').addEventListener('keydown', e=>{ if (e.key==='Enter') doLogin(); });

/* Modal overlay click to close */
$('modalOverlay').addEventListener('click', e=>{ if (e.target === e.currentTarget) closeModal(); });

/* Online/offline */
window.addEventListener('online', ()=>{ State.online = true; updateOnlineBadge(); toast('Back online','success'); });
window.addEventListener('offline', ()=>{ State.online = false; updateOnlineBadge(); toast('Offline mode','error'); });

/* Boot */
(function boot() {
  // 1. Check localStorage session first
  const s = loadSession();
  if (s) {
    State.user = s.user;
    // Still verify with Firebase Auth if available
    if (auth && !IS_DEMO) {
      auth.onAuthStateChanged(u => {
        if (u && !State.user) {
          State.user = { uid:u.uid, email:u.email, displayName:u.displayName || u.email.split('@')[0] };
          saveSession(State.user);
          showApp();
        }
      });
    }
    showApp();
  } else if (auth && !IS_DEMO) {
    // Check Firebase Auth persisted session
    auth.onAuthStateChanged(u => {
      if (u) {
        State.user = { uid:u.uid, email:u.email, displayName:u.displayName || u.email.split('@')[0] };
        saveSession(State.user);
        showApp();
      }
    });
  }
  // else login screen stays visible

  // Log demo mode warning
  if (IS_DEMO) {
    console.info('%c⚠️ KIH Phlebotomy running in DEMO mode (no Firebase). Data saved locally in browser.', 'color:#f3a54f;font-weight:bold;font-size:12px');
    console.info('%cReplace firebaseConfig in index.html with real Firebase credentials for full functionality.', 'color:#8e9bb5;font-size:11px');
  }
})();
</script>

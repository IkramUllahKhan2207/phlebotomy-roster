<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>KIH Phlebotomy · Companion</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   KIH PHLEBOTOMY COMPANION v4.0 — COMPLETE CSS
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg-0:#FFFFFF;
  --bg-1:#F9FAFB;
  --bg-2:#F3F4F6;
  --border:#E5E7EB;
  --border-2:#D1D5DB;
  --text:#111827;
  --text-muted:#6B7280;
  --text-dim:#9CA3AF;
  --primary:#14B8A6;
  --primary-d:#0D9488;
  --primary-grad:linear-gradient(135deg,#14B8A6,#0D9488);
  --primary-glow:rgba(20,184,166,0.25);
  --success:#10B981;
  --success-l:#34D399;
  --danger:#EF4444;
  --danger-l:#F87171;
  --warning:#F59E0B;
  --warning-l:#FBBF24;
  --radius:12px;
  --radius-lg:16px;
  --radius-xl:24px;
  --nav-h:70px;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
  --shadow:0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,0.12);
}

html,body{
  background:var(--bg-0);
  color:var(--text);
  min-height:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body{padding-bottom:calc(var(--nav-h) + 20px)}

/* UTILITY */
.hidden{display:none !important}
.flex{display:flex}
.flex-center{display:flex;align-items:center;justify-content:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}
.text-muted{color:var(--text-muted)}
.text-center{text-align:center}
.bold{font-weight:600}
.num-mono{font-family:'JetBrains Mono',monospace}

/* LOGIN */
.login-screen{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:2000;
  background:var(--bg-0);
}
.login-card{
  width:100%;max-width:400px;
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  padding:32px 24px;
  box-shadow:var(--shadow-lg);
}
.login-logo{
  width:72px;height:72px;
  margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;
  background:var(--primary);
  border-radius:20px;
  color:#fff;
  overflow:hidden;
}
.login-logo img{width:100%;height:100%;object-fit:contain}
.login-card h1{
  font-size:24px;font-weight:700;
  text-align:center;
  margin-bottom:6px;
}
.login-card .subtitle{
  text-align:center;
  color:var(--text-muted);
  font-size:13.5px;
  margin-bottom:24px;
}
.input-group{margin-bottom:16px}
.input-group label{
  display:block;font-size:13px;font-weight:500;
  margin-bottom:6px;
}
.input-group input,
.input-group select,
.input-group textarea{
  width:100%;padding:12px 14px;
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:var(--radius);
  color:var(--text);font-size:14px;font-family:inherit;
  outline:none;transition:all .15s ease;
}
.input-group input:focus,
.input-group select:focus,
.input-group textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-glow);
}
.input-group input::placeholder,
.input-group textarea::placeholder{color:var(--text-dim)}
.checkbox-row{
  display:flex;align-items:center;gap:10px;
  margin:14px 0 18px;
  color:var(--text-muted);font-size:14px;
  cursor:pointer;user-select:none;
}
.checkbox-row input[type="checkbox"]{
  width:18px;height:18px;
  accent-color:var(--primary);cursor:pointer;
}
.btn-primary{
  width:100%;padding:14px;
  background:var(--primary);
  color:#fff;font-size:15px;font-weight:600;
  border:none;border-radius:var(--radius);
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s ease;
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:scale(0.98)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-secondary{
  width:100%;padding:14px;
  background:transparent;color:var(--text-muted);
  font-size:14px;font-weight:500;
  border:1px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;font-family:inherit;
  margin-top:10px;transition:all .15s ease;
}
.btn-secondary:hover{background:var(--bg-1);color:var(--text)}
.login-footer{
  margin-top:20px;text-align:center;
  color:var(--text-dim);font-size:12px;
}

/* HEADER */
.app-header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--bg-0);
  border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  background:var(--primary);border-radius:8px;
  color:#fff;overflow:hidden;
}
.header-logo img{width:100%;height:100%;object-fit:contain}
.header-title{font-size:15px;font-weight:700}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--success-l)}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:8px;color:var(--text-muted);
  font-size:16px;cursor:pointer;
  position:relative;transition:all .15s ease;
}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}
.bell-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--danger);color:#fff;
  font-size:9px;font-weight:700;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.user-avatar{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:50%;font-size:13px;font-weight:700;
  cursor:pointer;color:var(--text);
}
.logout-link{
  color:var(--danger);font-size:13px;font-weight:500;
  cursor:pointer;padding:8px 10px;border-radius:8px;
}
.logout-link:hover{background:rgba(239,68,68,0.08)}

/* CONTENT */
.app-content{
  padding:16px;
  max-width:100%;
  margin:0 auto;
}

/* CARDS */
.card{
  background:var(--bg-0);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  transition:all .15s ease;
}
.card:hover{box-shadow:var(--shadow);border-color:var(--border-2)}
.card-title{
  font-size:16px;font-weight:600;
  margin-bottom:6px;
  display:flex;align-items:center;gap:8px;
}
.card-sub{color:var(--text-muted);font-size:13.5px;line-height:1.5}

/* BADGES */
.badge{
  display:inline-flex;align-items:center;
  padding:3px 10px;background:var(--bg-2);
  border:1px solid var(--border);border-radius:20px;
  font-size:11.5px;font-weight:500;
  color:var(--text-muted);white-space:nowrap;
}
.badge-primary{background:rgba(20,184,166,0.1);border-color:rgba(20,184,166,0.3);color:var(--primary)}
.badge-success{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#059669}
.badge-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#DC2626}
.badge-warning{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:#D97706}

/* BUTTONS */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-sm{
  padding:8px 14px;
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:8px;color:var(--text);
  font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .15s ease;white-space:nowrap;
}
.btn-sm:hover{background:var(--bg-2);border-color:var(--border-2)}
.btn-sm:active{transform:scale(0.97)}
.btn-sm:disabled{opacity:0.5;cursor:not-allowed}
.btn-accent{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-accent:hover{filter:brightness(1.08)}
.btn-success{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3);color:#059669}
.btn-success:hover{background:rgba(16,185,129,0.2)}
.btn-danger{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#DC2626}
.btn-danger:hover{background:rgba(239,68,68,0.2)}
.btn-block{width:100%;justify-content:center;padding:12px}

/* BIG BUTTONS */
.big-btn{
  width:100%;padding:18px;border:none;
  border-radius:var(--radius-lg);
  font-family:inherit;font-size:16px;font-weight:600;
  color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:12px;transition:all .15s ease;
  background:var(--primary);
}
.big-btn:hover{filter:brightness(1.08)}
.big-btn:active{transform:scale(0.98)}
.big-btn-draw{background:#10B981}
.big-btn-emergency{background:#EF4444}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg-0);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px 10px;z-index:100;
  overflow-x:auto;
}
.nav-item{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  padding:6px 6px;min-width:52px;
  color:var(--text-dim);font-size:10px;font-weight:500;
  cursor:pointer;border-radius:8px;
  transition:all .15s ease;flex-shrink:0;
}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item.active{color:var(--primary);background:rgba(20,184,166,0.1)}

/* TOAST */
.toast{
  position:fixed;top:70px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  min-width:240px;max-width:90vw;
  padding:12px 18px;
  background:var(--text);color:var(--bg-0);
  border-radius:10px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);z-index:3000;
  opacity:0;pointer-events:none;
  transition:all .2s ease;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#10B981;color:#fff}
.toast.error{background:#EF4444;color:#fff}
.toast.warning{background:#F59E0B;color:#fff}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.5);
  z-index:1000;display:none;
  align-items:flex-end;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal-sheet{
  width:100%;max-width:640px;max-height:92vh;
  overflow-y:auto;background:var(--bg-0);
  border-radius:20px 20px 0 0;
  padding:20px 18px 30px;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0.8}to{transform:translateY(0);opacity:1}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:16px;
}
.modal-header h2{font-size:18px;font-weight:600;flex:1}
.modal-close{
  width:36px;height:36px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:50%;color:var(--text-muted);
  font-size:16px;cursor:pointer;font-family:inherit;
}
.modal-close:hover{background:var(--bg-2);color:var(--text)}

/* SEARCH */
.search-bar{
  width:100%;padding:11px 14px;
  background:var(--bg-0);border:1px solid var(--border);
  border-radius:40px;color:var(--text);
  font-size:13.5px;font-family:inherit;
  outline:none;margin-bottom:12px;
}
.search-bar:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}

/* TABS */
.tab-bar{
  display:flex;gap:6px;overflow-x:auto;
  padding:4px 0 10px;margin-bottom:8px;
  scrollbar-width:none;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:40px;color:var(--text-muted);
  font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;
  white-space:nowrap;
}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* PROGRESS */
.progress-bar{
  height:6px;background:var(--bg-2);
  border-radius:6px;overflow:hidden;margin:8px 0;
}
.progress-fill{
  height:100%;background:var(--primary);
  border-radius:6px;transition:width .3s ease;
}

/* LIST */
.list-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 14px;
  background:var(--bg-0);border:1px solid var(--border);
  border-radius:10px;margin-bottom:8px;
  transition:all .15s ease;
}
.list-row:hover{background:var(--bg-1);border-color:var(--border-2)}

/* STAT */
.stat-box{
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:12px;padding:14px 10px;text-align:center;
}
.stat-box .num{font-size:24px;font-weight:700;line-height:1.1}
.stat-box .lbl{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em}

/* STEP */
.step-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.step-item:last-child{border-bottom:none}
.step-check{
  width:24px;height:24px;flex-shrink:0;
  border:2px solid var(--border-2);border-radius:8px;
  background:transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;cursor:pointer;
}
.step-check.done{background:var(--success);border-color:var(--success);color:#fff}
.step-content{flex:1}
.step-title{font-size:14px;font-weight:500}
.step-time{font-size:11px;color:var(--success);margin-top:3px}

/* EMERGENCY */
.emergency-card{
  background:var(--bg-0);border:1px solid var(--border);
  border-left:3px solid #EF4444;
  border-radius:10px;padding:14px;margin-bottom:10px;
}
.emergency-card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.emergency-steps{list-style:none;color:var(--text-muted);font-size:13px;line-height:1.6}
.emergency-steps li{padding-left:14px;position:relative;margin-bottom:4px}
.emergency-steps li::before{content:'●';position:absolute;left:0;color:#EF4444;font-size:7px;top:6px}

/* EMPTY */
.empty-state{
  text-align:center;padding:30px 16px;
  color:var(--text-muted);
}
.empty-state .icon{font-size:40px;margin-bottom:10px;opacity:0.4}

/* AVATAR */
.avatar{
  width:38px;height:38px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:50%;font-weight:600;font-size:13px;
}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:14px 0}

/* ROSTER TABLE */
.roster-table{width:100%;border-collapse:collapse;font-size:11px}
.roster-table th{padding:8px 4px;color:var(--text-dim);font-weight:600;font-size:10px;text-transform:uppercase;text-align:center}
.roster-table th:first-child{text-align:left}
.roster-table td{padding:6px 4px;text-align:center;border-top:1px solid var(--border);font-size:11px}
.roster-table td:first-child{text-align:left;font-weight:500;white-space:nowrap}
.shift-pill{display:inline-block;padding:3px 6px;border-radius:5px;font-size:9.5px;font-weight:600;color:#fff;min-width:22px}
.shift-M{background:#10B981}
.shift-E{background:#6366F1}
.shift-N{background:#8B5CF6}
.shift-N12{background:#EC4899}
.shift-E4{background:#3B82F6}
.shift-D{background:#F43F5E}
.shift-D2{background:#F43F5E}
.shift-X{background:#6B7280}
.shift-OFF{background:#374151}
.shift-PH{background:#F59E0B}
.shift-CPL{background:#8B5CF6}
.shift-EL{background:#EC4899}
.shift-CL{background:#14B8A6}
.shift-ME{background:#DC2626}
.shift-EN{background:#7C3AED}
.shift-ME{background:#DC2626}
.shift-DX{background:#8B5CF6}
.shift-XE{background:#F59E0B}
.shift-MX{background:#10B981}

/* DESKTOP */
@media (min-width:1024px){
  body{padding-bottom:0}
  .app-header{padding:12px 24px}
  .bottom-nav{display:none !important}
  .app-content{
    margin-left:220px !important;
    max-width:calc(100% - 220px) !important;
    width:calc(100% - 220px) !important;
    padding:20px 28px !important;
  }
  .app-header .header-left{margin-left:220px}
  .app-header .header-logo{display:none}
  .kih-sidebar{
    display:flex !important;
    position:fixed;top:60px;left:0;bottom:0;width:220px;
    background:var(--bg-0);border-right:1px solid var(--border);
    flex-direction:column;padding:16px 10px;
    z-index:90;overflow-y:auto;
  }
  .kih-sidebar-logo{
    display:flex;align-items:center;gap:10px;
    padding:6px 10px 16px;border-bottom:1px solid var(--border);
    margin-bottom:10px;
  }
  .kih-sidebar-logo-icon{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:var(--primary);border-radius:8px;
    font-size:18px;color:#fff;overflow:hidden;
  }
  .kih-sidebar-logo-icon img{width:100%;height:100%;object-fit:contain}
  .kih-sidebar-logo-text{font-size:14px;font-weight:700;line-height:1.2}
  .kih-sidebar-logo-text small{display:block;font-size:10px;font-weight:400;color:var(--text-muted);margin-top:1px}
  .kih-sidebar-nav{display:flex;flex-direction:column;gap:2px}
  .kih-nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;border-radius:8px;
    color:var(--text-muted);font-size:13.5px;font-weight:500;
    cursor:pointer;transition:all .15s ease;
  }
  .kih-nav-item:hover{background:var(--bg-1);color:var(--text)}
  .kih-nav-item.active{background:var(--primary);color:#fff}
  .kih-nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
  .kih-nav-label{flex:1}
  .kih-sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
  .kih-user-card{
    display:flex;align-items:center;gap:10px;
    padding:10px;background:var(--bg-1);
    border:1px solid var(--border);border-radius:10px;margin-bottom:6px;
  }
  .kih-user-avatar{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:var(--primary);border-radius:50%;
    font-weight:600;font-size:12px;color:#fff;flex-shrink:0;
  }
  .kih-user-info{flex:1;min-width:0}
  .kih-user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    const d = JSON.parse(raw);

  if (!mobileInput || !passwordInput) return;
  
  const mobile = normalizeMobile(mobileInput.value.trim());
  const password = passwordInput.value.trim();
  
  if (!mobile || mobile.length < 10) { toast('Enter valid mobile', 'error'); return; }
  if (!password) { toast('Enter password', 'error'); return; }
  
  if (btn) { btn.disabled = true; btn.innerHTML = '<span>⏳</span><span>Signing in...</span>'; }
  
  let staffList = LocalDB.get('staff', []);
  if (staffList.length === 0) {
    LocalDB.set('staff', [DEFAULT_ADMIN]);
    staffList = [DEFAULT_ADMIN];
  }
  
  const user = staffList.find(s => 
    normalizeMobile(s.mobile) === mobile && 
    s.password === password && 
    s.active !== false
  );
  
  if (!user) {
    toast('Invalid mobile or password', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '<span>🔓</span><span>Sign In</span>'; }
    return;
  }
  
  State.user = user;
  if (keep && keep.checked) saveSession(user);
  else clearSession();
  
  if (btn) { btn.disabled = false; btn.innerHTML = '<span>🔓</span><span>Sign In</span>'; }
  showApp();
  toast(`Welcome, ${user.name.split(' ')[0]}!`, 'success');
}

function openModal(html) {
  const sheet = $('modalSheet');
  const overlay = $('modalOverlay');
  if (!sheet || !overlay) return;
  sheet.innerHTML = html;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const overlay = $('modalOverlay');
  if (!overlay) return;
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

/* ─── RENDER ─── */
function render() {
  const main = $('appContent');
  if (!main) return;
  
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === State.activeTab));
  
  const renderers = {
    home: renderHome, tests: renderTests, protocols: renderProtocols,
    roster: renderRoster, swap: renderSwap, learn: renderLearn,
    attend: renderAttend, cpl: renderCPL, more: renderMore
  };
  
  const fn = renderers[State.activeTab] || renderHome;
  main.innerHTML = fn();
  attachHandlers();
  window.scrollTo(0, 0);
}

function attachHandlers() {
  $$('.nav-item').forEach(el => {
    el.onclick = () => {
      State.activeTab = el.dataset.tab;
      render();
      const sidebar = document.getElementById('kihSidebar');
      if (sidebar) {
        sidebar.querySelectorAll('.kih-nav-item').forEach(x => 
          x.classList.toggle('active', x.dataset.tab === State.activeTab)
        );
      }
    };
  });
  $$('[data-quick]').forEach(el => {
    el.onclick = () => {
      State.activeTab = 'protocols';
      State.protocolTab = el.dataset.quick;
      render();
    };
  });
  $$('[data-ptab]').forEach(el => {
    el.onclick = () => { State.protocolTab = el.dataset.ptab; render(); };
  });
}

function filterItems(cls, q) {
  const query = q.toLowerCase();
  $$('.' + cls).forEach(el => {
    el.style.display = el.dataset.name.includes(query) ? 'block' : 'none';
  });
}

function getTubeIcon(tubeName) {
  const name = (tubeName || '').toLowerCase();
  const tubeSVG = (capColor, bodyColor = '#f0f0f0') => `
    <svg width="28" height="56" viewBox="0 0 32 64" fill="none">
      <rect x="4" y="0" width="24" height="10" rx="3" fill="${capColor}"/>
      <rect x="4" y="10" width="24" height="52" rx="4" stroke="#4B5563" stroke-width="1.5" fill="rgba(255,255,255,0.05)"/>
      <rect x="6" y="32" width="20" height="28" rx="3" fill="${bodyColor}" opacity="0.7"/>
      <rect x="7" y="14" width="3" height="40" rx="1.5" fill="rgba(255,255,255,0.15)"/>
    </svg>
  `;
  if (name.includes('edta') || name.includes('lavender')) return tubeSVG('#A78BFA', '#C4B5FD');
  if (name.includes('citrate') || name.includes('blue')) return tubeSVG('#60A5FA', '#93C5FD');
  if (name.includes('sst') || name.includes('gold')) return tubeSVG('#FBBF24', '#FDE68A');
  if (name.includes('heparin') || name.includes('green')) return tubeSVG('#10B981', '#6EE7B7');
  if (name.includes('fluoride') || name.includes('grey') || name.includes('gray')) return tubeSVG('#9CA3AF', '#D1D5DB');
  if (name.includes('culture')) return tubeSVG('#F3F4F6', '#FEF3C7');
  return tubeSVG('#6B7280', '#9CA3AF');
}

    <div class="input-group">
      <label>Send to *</label>
      <div style="background:var(--bg-1);border:1px solid var(--border);border-radius:10px;padding:12px;max-height:200px;overflow-y:auto">
        <label class="checkbox-row" style="margin:0 0 8px 0">
          <input type="checkbox" id="sn_all" onchange="toggleAllRecipients(this.checked)">
          <span style="font-weight:600">📢 All Staff (${staffList.length})</span>
        </label>
        <div class="divider" style="margin:8px 0"></div>
        ${staffList.map(s => {
          const des = DESIGNATIONS.find(d => d.id === s.designation);
          return `<label class="checkbox-row" style="margin:0 0 6px 0">
            <input type="checkbox" class="sn-recipient" value="${s._id}" data-mobile="${esc(s.mobile)}" data-name="${esc(s.name)}">
            <span>${des ? des.icon : '👤'} ${esc(s.name)} <span style="color:var(--text-dim);font-size:12px">${esc(formatMobile(s.mobile))}</span></span>
          </label>`;
        }).join('')}
      </div>
    </div>
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px" onclick="sendNotification()">📤 Send via WhatsApp</button>
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function toggleAllRecipients(checked) { $$('.sn-recipient').forEach(el => el.checked = checked); }

function sendNotification() {
  const title = $('sn_title').value.trim();
  const body = $('sn_body').value.trim();
  if (!title || !body) { toast('Fill title and message', 'error'); return; }
  
  const recipients = Array.from($$('.sn-recipient:checked')).map(el => ({
    id: el.value, mobile: el.dataset.mobile, name: el.dataset.name
  }));
  
  if (recipients.length === 0) { toast('Select recipients', 'error'); return; }
  
  LocalDB.push('notifications', {
    _id: uid(), title, body,
    recipients: recipients.map(r => r.id),
    sentBy: State.user?.name || 'Admin',
    createdAt: Date.now(), read: false
  });
  
  recipients.forEach((r, i) => {
    setTimeout(() => {
      const mobile = normalizeMobile(r.mobile);
      const full = mobile.startsWith('0') ? '92' + mobile.slice(1) : mobile;
      const msg = `*🏥 KIH Phlebotomy*\n\n*${title}*\n\n${body}\n\n_Sent by: ${State.user?.name || 'Admin'}_`;
      window.open(`https://wa.me/${full}?text=${encodeURIComponent(msg)}`, '_blank');
    }, i * 500);
  });
  
  toast(`Sending to ${recipients.length} staff`, 'success');
  closeModal();
  State.notifications = LocalDB.get('notifications', []);
  State.unreadCount = State.notifications.filter(n => !n.read).length;
  updateBell();
  render();
}

function saveTemplate() {
  const name = $('ht_name').value.trim();
  const description = $('ht_desc').value.trim();
  const category = $('ht_category').value;
  const fileInput = $('ht_file');
  
  if (!name) { toast('Enter name', 'error'); return; }
  if (!fileInput.files || !fileInput.files[0]) { toast('Select file', 'error'); return; }
  
  const file = fileInput.files[0];
  if (file.size > 5 * 1024 * 1024) { toast('File too large', 'error'); return; }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const form = {
      _id: uid(), name, description, category,
      fileName: file.name, fileType: file.type, fileSize: file.size,
      fileData: e.target.result,
      uploadedBy: State.user?.name || 'Admin', createdAt: Date.now()
    };
    LocalDB.push('historyForms', form);
    State.historyForms.push(form);
    toast('Template saved', 'success');
    openHistoryFormsModal();
  };
  reader.readAsDataURL(file);
}

function downloadForm(id) {
  const form = State.historyForms.find(f => f._id === id);
  if (!form) return;
  const a = document.createElement('a');
  a.href = form.fileData;
  a.download = form.fileName || (form.name + '.pdf');
  a.click();
  toast('Downloading...', 'success');
}

function printFormTemplate(id) {
  const form = State.historyForms.find(f => f._id === id);
  if (!form) return;
  const isPDF = form.fileType === 'application/pdf';
  const win = window.open('', '_blank');
  win.document.write(`
    <!DOCTYPE html><html><head><title>Print — ${form.name}</title>
    <style>
      @page { margin: 12mm; }
      body { font-family: system-ui, sans-serif; padding: 20px; }
      .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
      .header h1 { font-size: 20px; margin-bottom: 4px; }
      .header p { font-size: 12px; color: #555; }
      .content { text-align: center; }
      .content img { max-width: 100%; }
      .content iframe { width: 100%; height: 90vh; border: none; }
    </style></head><body>
      <div class="header"><h1>KULSUM INTERNATIONAL HOSPITAL</h1><p>PHLEBOTOMY</p></div>
      <div class="content">${isPDF ? `<iframe src="${form.fileData}"></iframe>` : `<img src="${form.fileData}" onload="setTimeout(()=>window.print(),400)">`}</div>
      <script>${isPDF ? 'window.onload = () => setTimeout(() => window.print(), 600);' : ''}<\/script>
    </body></html>
  `);
  win.document.close();
}

function deleteForm(id) {
  if (!confirm('Delete?')) return;
  LocalDB.remove('historyForms', id);
  State.historyForms = State.historyForms.filter(f => f._id !== id);
  toast('Deleted', 'success');
  openHistoryFormsModal();
}

function openSwapModal() {
  openModal(`
    <div class="modal-header"><h2>🔄 New Swap Request</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="input-group"><label>Your current shift</label><input id="sw_from" placeholder="e.g. Mon Morning"></div>
    <div class="input-group"><label>Requested shift</label><input id="sw_to" placeholder="e.g. Tue Evening"></div>
    <div class="input-group"><label>Swap with</label><input id="sw_with" placeholder="Colleague"></div>
    <div class="input-group"><label>Reason</label><textarea id="sw_reason" rows="2"></textarea></div>
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px" onclick="submitSwap()">📤 Submit</button>
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function submitSwap() {
  const from = $('sw_from').value.trim();
  const to = $('sw_to').value.trim();
  const withWho = $('sw_with').value.trim();
  if (!from || !to || !withWho) { toast('Fill all fields', 'error'); return; }
  
  const swap = {
    _id: uid(), from, to, with: withWho,
    reason: $('sw_reason').value.trim(),
    status: 'pending',
    requestedBy: State.user?.name || 'User',
    requestedById: State.user?._id,
    createdAt: Date.now()
  };
  LocalDB.push('swaps', swap);
  State.swapRequests.push(swap);
  LocalDB.push('notifications', { _id: uid(), title: 'New Swap Request', body: `${State.user?.name}: ${from} → ${to}`, read: false, createdAt: Date.now() });
  State.notifications = LocalDB.get('notifications', []);
  toast('Swap submitted', 'success');
  closeModal();
  if (State.activeTab === 'swap') render();
}

function approveSwap(id) {
  if (!confirm('Approve?')) return;
  LocalDB.update('swaps', id, { status: 'approved', approvedBy: State.user?.name, approvedAt: Date.now() });
  const idx = State.swapRequests.findIndex(s => s._id === id);
  if (idx >= 0) State.swapRequests[idx].status = 'approved';
  toast('Approved', 'success');
  render();
}

function rejectSwap(id) {
  if (!confirm('Reject?')) return;
  LocalDB.update('swaps', id, { status: 'rejected', rejectedBy: State.user?.name, rejectedAt: Date.now() });
  const idx = State.swapRequests.findIndex(s => s._id === id);
  if (idx >= 0) State.swapRequests[idx].status = 'rejected';
  toast('Rejected', 'warning');
  render();
}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
function openPoliciesModal() {
  const ackd = JSON.parse(localStorage.getItem('kih_ack_policies') || '[]');
  openModal(`
    <div class="modal-header"><h2>📜 Policies & Acknowledgment</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    ${canManage() ? `<button class="btn-sm btn-block mb12" onclick="openAckTracker()">📊 Acknowledgment Tracker</button>` : ''}
    ${State.policies.map(p => `
      <div class="card" style="margin-bottom:10px">
        <div class="flex-between">
          <div style="font-weight:600;font-size:14px">${esc(p.title)}</div>
          ${ackd.includes(p.title) ? '<span class="badge badge-success">✓ Ack</span>' : '<span class="badge badge-warning">Pending</span>'}
        </div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:8px;line-height:1.6">${esc(p.body)}</div>
        ${!ackd.includes(p.title) ? `<button class="btn-sm btn-accent mt12" onclick="ackPolicy('${esc(p.title).replace(/'/g,"\\'")}')">✓ Acknowledge</button>` : ''}
      </div>
    `).join('')}
  `);
}

function ackPolicy(title) {
  const policy = State.policies.find(p => p.title === title);
  if (!policy) return;
  
  // Check if already acked
  const all = LocalDB.get('policyAcks', []);
  const exists = all.find(a => a.policyId === policy._id && a.staffId === State.user?._id);
  if (exists) { toast('Already acknowledged', 'warning'); return; }
  
  const ack = {
    _id: uid(),
    policyId: policy._id,
    policyTitle: policy.title,
    staffId: State.user?._id,
    staffName: State.user?.name || 'Unknown',
    staffMobile: State.user?.mobile || '',
    staffDesignation: State.user?.designation || '',
    acknowledgedAt: Date.now(),
    date: fmtDate(),
    time: fmtTime(),
    device: /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop'
  };
  
  LocalDB.push('policyAcks', ack);
  
  const ackd = JSON.parse(localStorage.getItem('kih_ack_policies') || '[]');
  if (!ackd.includes(title)) ackd.push(title);
  localStorage.setItem('kih_ack_policies', JSON.stringify(ackd));
  
  // In-app notification for admin
  LocalDB.push('notifications', {
    _id: uid(),
    title: '✅ Policy Acknowledged',

    forAdmins: true,
    createdAt: Date.now(),
    read: false

  State.unreadCount = State.notifications.filter(n => !n.read).length;
  updateBell();
  
  // WhatsApp to admin (auto)
  const admins = State.staff.filter(s => s.role === 'admin' && s.active !== false);
  if (admins.length > 0) {
    const adminMobile = normalizeMobile(admins[0].mobile);
    const full = adminMobile.startsWith('0') ? '92' + adminMobile.slice(1) : adminMobile;
    const msg = `*🏥 KIH Phlebotomy*\n━━━━━━━━━━━━━━\n✅ *Policy Acknowledged*\n\n👤 *Staff:* ${ack.staffName}\n📱 *Mobile:* ${formatMobile(ack.staffMobile)}\n📜 *Policy:* ${policy.title}\n📅 *Date:* ${ack.date} at ${ack.time}\n📱 *Device:* ${ack.device}`;
    setTimeout(() => window.open(`https://wa.me/${full}?text=${encodeURIComponent(msg)}`, '_blank'), 500);
  }
  
  toast('✅ Acknowledged! Admin notified.', 'success');
  openPoliciesModal();
}

function openAckTracker() {

                <div style="padding:6px 10px;background:rgba(16,185,129,0.06);border-radius:8px;margin-bottom:4px;font-size:12px">

          ` : ''}
          ${pending.length > 0 ? `
            <div style="margin-top:10px">
              <div style="font-size:11.5px;color:var(--warning);font-weight:600;margin-bottom:6px">⏳ Pending (${pending.length})</div>
              ${pending.map(s => `
                <div style="padding:6px 10px;background:rgba(245,158,11,0.06);border-radius:8px;margin-bottom:4px;font-size:12px">
                  <div class="flex-between">
                    <span>${esc(s.name)}</span>
                    <span style="color:var(--text-muted);font-size:11px">${esc(formatMobile(s.mobile))}</span>
                  </div>
                </div>
              `).join('')}
              <button class="btn-sm btn-accent btn-block mt8" onclick="remindPending('${p._id}')">📤 Remind Pending</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('')}
    <button class="btn-sm btn-block mt12" onclick="exportAckCSV()">📥 Export CSV</button>
  `);
}

function remindPending(policyId) {
  const policy = State.policies.find(p => p._id === policyId);
  if (!policy) return;
  const allAcks = LocalDB.get('policyAcks', []);
  const ackedIds = allAcks.filter(a => a.policyId === policyId).map(a => a.staffId);
  const pending = State.staff.filter(s => 
    s.active !== false && s.role !== 'admin' && !ackedIds.includes(s._id)
  );
  if (pending.length === 0) { toast('No pending', 'success'); return; }
  if (!confirm(`Send reminder to ${pending.length} staff?`)) return;
  
  const msg = `*🏥 KIH Phlebotomy*\n━━━━━━━━━━━━━━\n⚠️ *Policy Pending*\n\n📜 *Policy:* ${policy.title}\n\nPlease acknowledge this policy in the app.\n\n_Open KIH Phlebotomy App → More → Policies_`;
  
  pending.forEach((s, i) => {
    setTimeout(() => {
      const mobile = normalizeMobile(s.mobile);
      const full = mobile.startsWith('0') ? '92' + mobile.slice(1) : mobile;
      window.open(`https://wa.me/${full}?text=${encodeURIComponent(msg)}`, '_blank');
    }, i * 600);
  });
  toast(`Sending ${pending.length} reminders`, 'success');
}

function exportAckCSV() {
  const acks = LocalDB.get('policyAcks', []);
  if (acks.length === 0) { toast('No records', 'warning'); return; }
  const headers = ['Policy', 'Staff Name', 'Mobile', 'Date', 'Time', 'Device'];
  const rows = acks.map(a => [a.policyTitle, a.staffName, a.staffMobile, a.date, a.time, a.device]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kih-acknowledgments-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported', 'success');
}

function openQuizModal() {
  const questions = [
    { q: 'Correct order of draw?', opts: ['EDTA → SST → Citrate', 'Blood Culture → Citrate → SST → Heparin → EDTA → Fluoride', 'SST → EDTA → Citrate', 'Fluoride → EDTA → SST'], ans: 1 },
    { q: 'Tourniquet max time?', opts: ['30 sec', '1 minute', '2 minutes', '5 minutes'], ans: 1 },
    { q: 'Which tube for CBC?', opts: ['SST Gold', 'EDTA Lavender', 'Citrate Blue', 'Fluoride Grey'], ans: 1 },
    { q: 'Venipuncture angle?', opts: ['5-10°', '15-30°', '45°', '90°'], ans: 1 },
    { q: 'Needle stick: first action?', opts: ['Report', 'Wash with soap+water 5 min', 'PEP', 'Fill form'], ans: 1 }
  ];
  let idx = 0, score = 0;
  function renderQ() {
    if (idx >= questions.length) {
      $('modalSheet').innerHTML = `
        <div class="modal-header"><h2>Quiz Complete</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div style="text-align:center;padding:28px 0">
          <div style="font-size:56px">${score >= questions.length * 0.7 ? '🎉' : '📚'}</div>
          <h2 style="margin:16px 0;font-size:32px">${score} / ${questions.length}</h2>
        </div>
        <button class="btn-primary" onclick="closeModal()">Close</button>
      `;
      return;
    }
    const q = questions[idx];
    $('modalSheet').innerHTML = `
      <div class="modal-header"><h2>Q${idx + 1}/${questions.length}</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="font-size:15px;font-weight:500;margin-bottom:16px">${esc(q.q)}</div>
      ${q.opts.map((o, i) => `<button class="btn-sm btn-block mb8" style="justify-content:flex-start;padding:12px" onclick="window._quizAns(${i},${q.ans})">${esc(o)}</button>`).join('')}
      <div class="progress-bar mt16"><div class="progress-fill" style="width:${(idx / questions.length) * 100}%"></div></div>
    `;
  }
  window._quizAns = (chosen, correct) => {
    if (chosen === correct) score++;
    idx++;
    renderQ();
  };
  renderQ();
}

function selectShiftColor(color) {

function saveNewShift() {
  const code = $('sh_code').value.trim().toUpperCase();
  const name = $('sh_name').value.trim();
  if (!code || !name) { toast('Fill required fields', 'error'); return; }
  if (!/^[A-Z0-9_+]{1,5}$/.test(code)) { toast('Code: 1-5 chars (A-Z, 0-9, _, +)', 'error'); return; }
  
  const shifts = getShifts();
  if (shifts.find(s => s.code === code)) { toast('Code exists', 'error'); return; }

function updateShift(id) {
  const shifts = getShifts();
  const idx = shifts.findIndex(x => x._id === id);
  if (idx === -1) return;
  
  const code = $('sh_code').value.trim().toUpperCase();
  const name = $('sh_name').value.trim();
  if (!code || !name) { toast('Fill required', 'error'); return; }
  if (shifts.find(s => s.code === code && s._id !== id)) { toast('Code exists', 'error'); return; }
  
  const startH = parseInt($('sh_start').value.split(':')[0]);
  const endH = parseInt($('sh_end').value.split(':')[0]);
  const duration = endH > startH ? endH - startH : (24 - startH) + endH;
  
  shifts[idx] = {
    ...shifts[idx],
    code, name,
    start: $('sh_start').value, end: $('sh_end').value, duration,
    color: $('sh_color').value, gender: $('sh_gender').value,
    staffMonFri: parseInt($('sh_staffMonFri').value) || 0,
    staffSat: parseInt($('sh_staffSat').value) || 0,
    staffSun: parseInt($('sh_staffSun').value) || 0,
    isSpecial: $('sh_special').checked,
    updatedAt: Date.now()
  };
  
  saveShifts(shifts);
  toast('✅ Updated', 'success');
  openShiftManagement();
}

function deleteShift(id) {
  if (!confirm('Delete this shift?')) return;
  let shifts = getShifts();
  shifts = shifts.filter(x => x._id !== id);
  saveShifts(shifts);
  toast('Deleted', 'success');
  openShiftManagement();
}

function resetShifts() {
  if (!confirm('Reset all shifts to default?')) return;
  saveShifts(JSON.parse(JSON.stringify(DEFAULT_SHIFTS)));
  toast('✅ Reset', 'success');
  openShiftManagement();
}

  const dataMap = {

  };

      <div class="input-group"><label>Volume</label><input id="f_volume" value="${esc(item?.volume || '')}"></div>

      <div class="input-group"><label>Urgent TAT</label><input id="f_urgent" value="${esc(item?.urgent || '')}"></div>
      <div class="input-group"><label>Category</label><input id="f_category" value="${esc(item?.category || '')}"></div>
    `;
  } else if (type === 'emergency') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}"></div>
      <div class="input-group"><label>Steps (one per line)</label><textarea id="f_steps" rows="6">${esc((item?.steps || []).join('\n'))}</textarea></div>
    `;
  } else if (type === 'difficult') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}"></div>
      <div class="input-group"><label>Problem</label><textarea id="f_problem" rows="2">${esc(item?.problem || '')}</textarea></div>
      <div class="input-group"><label>Solution</label><textarea id="f_solution" rows="3">${esc(item?.solution || '')}</textarea></div>
    `;
  } else if (type === 'scripts') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}"></div>
      <div class="input-group"><label>English</label><textarea id="f_en" rows="4">${esc(item?.en || '')}</textarea></div>
      <div class="input-group"><label>Urdu</label><textarea id="f_ur" rows="4" style="direction:rtl">${esc(item?.ur || '')}</textarea></div>
    `;
  } else if (type === 'policies') {
    fieldsHTML = `
      <div class="input-group"><label>Title *</label><input id="f_title" value="${esc(item?.title || '')}"></div>
      <div class="input-group"><label>Body</label><textarea id="f_body" rows="6">${esc(item?.body || '')}</textarea></div>
    `;
  }
  
  openModal(`
    <div class="modal-header"><h2>${isNew ? '+ Add' : '✏️ Edit'}</h2><button class="modal-close" onclick="openManageList('${type}','')">✕</button></div>
    ${fieldsHTML}
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px" onclick="saveItem('${type}', '${id || ''}')">💾 Save</button>
      <button class="btn-sm" onclick="openManageList('${type}','')">Cancel</button>
    </div>
  `);
}

function saveItem(type, id) {
  const isNew = !id;
  const v = (id) => { const el = $(id); return el ? el.value.trim() : ''; };
  const item = { _id: id || uid(), updatedAt: Date.now() };
  if (isNew) item.createdAt = Date.now();
  
  if (type === 'tests') {
    item.name = v('f_name'); item.tube = v('f_tube'); item.order = +v('f_order') || 1;
    item.volume = v('f_volume'); item.tat = v('f_tat'); item.urgent = v('f_urgent'); item.category = v('f_category');
    if (!item.name || !item.tube) { toast('Fill required', 'error'); return; }
  } else if (type === 'emergency') {
    item.title = v('f_title'); item.steps = v('f_steps').split('\n').map(s => s.trim()).filter(Boolean);
    if (!item.title || item.steps.length === 0) { toast('Fill required', 'error'); return; }
  } else if (type === 'difficult') {
    item.title = v('f_title'); item.problem = v('f_problem'); item.solution = v('f_solution');
    if (!item.title) { toast('Fill title', 'error'); return; }
  } else if (type === 'scripts') {
    item.title = v('f_title'); item.en = v('f_en'); item.ur = v('f_ur');
    if (!item.title || !item.en) { toast('Fill required', 'error'); return; }
  } else if (type === 'policies') {
    item.title = v('f_title'); item.body = v('f_body');
    if (!item.title || !item.body) { toast('Fill required', 'error'); return; }
  }
  
  const key = type;
  let arr = LocalDB.get(key, []);
  if (isNew) arr.push(item);
  else {
    const idx = arr.findIndex(x => x._id === id);
    if (idx >= 0) arr[idx] = { ...arr[idx], ...item };
  }
  LocalDB.set(key, arr);
  
  if (type === 'tests') State.tests = arr;
  else if (type === 'emergency') State.emergencyCards = arr;
  else if (type === 'difficult') State.difficultDraws = arr;
  else if (type === 'scripts') State.scripts = arr;
  else if (type === 'policies') State.policies = arr;
  
  toast(isNew ? 'Added' : 'Updated', 'success');
  openManageList(type, '');
}

function deleteItem(type, id) {
  if (!confirm('Delete?')) return;
  let arr = LocalDB.get(type, []);
  arr = arr.filter(x => x._id !== id);
  LocalDB.set(type, arr);
  if (type === 'tests') State.tests = arr;
  else if (type === 'emergency') State.emergencyCards = arr;
  else if (type === 'difficult') State.difficultDraws = arr;
  else if (type === 'scripts') State.scripts = arr;
  else if (type === 'policies') State.policies = arr;
  toast('Deleted', 'success');
  openManageList(type, '');
}

    <div class="input-group mt12">
      <label>Special Off Dates</label>
      <div style="display:flex;gap:8px">
        <input type="date" id="s_specialDate" style="flex:1">
        <button class="btn-sm btn-accent" onclick="addSpecialOffDate()">+ Add</button>
      </div>
      <div id="s_specialDatesList" style="margin-top:8px"></div>
    </div>
    
    <div class="input-group"><label>Station</label><input id="s_station" value="${esc(s.station || '')}"></div>
    <label class="checkbox-row"><input type="checkbox" id="s_notifications" ${s.notifications?'checked':''}><span>Enable notifications</span></label>
    ${canManage() ? `<label class="checkbox-row"><input type="checkbox" id="s_admin" ${s.role==='admin'?'checked':''}><span>Admin panel access</span></label>` : ''}
    
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px" onclick="saveStaffV4('${s.designation}','${id}')">💾 Save</button>
      <button class="btn-sm" onclick="openDesignationSection('${s.designation}')">Cancel</button>
    </div>
  `);
  
  setTimeout(() => { updateSecondaryOptions(); updateShiftPreview(); renderSpecialOffDates(); }, 50);
}

/* POINT 2: Priority by Click Order */
function onSecondaryClick(code, checked) {
  if (!window._priorityOrder) window._priorityOrder = [];
  if (checked) {
    if (!window._priorityOrder.includes(code)) window._priorityOrder.push(code);
  } else {
    window._priorityOrder = window._priorityOrder.filter(c => c !== code);
  }
  updateShiftPreview();
}

function updateSecondaryOptions() {
  const primary = $('s_primaryShift')?.value;
  if (!primary) return;
  const shifts = getShifts().filter(s => !['X','OFF','PH','CPL','EL','CL'].includes(s.code));
  
  // Remove primary from priority order
  if (window._priorityOrder) {
    window._priorityOrder = window._priorityOrder.filter(c => c !== primary);
  }
  
  $$('.secondary-shift-row').forEach(row => {
    const code = row.dataset.shift;
    const cb = row.querySelector('input');
    const badge = row.querySelector('.priority-badge');
    
    if (code === primary) {
      cb.checked = false;
      cb.disabled = true;
      row.style.opacity = '0.4';
      if (badge) { badge.style.display = 'none'; }
    } else {
      cb.disabled = false;
      row.style.opacity = '1';
    }
  });
  updateShiftPreview();
}

function updateShiftPreview() {
  const primary = $('s_primaryShift')?.value || 'M';
  const shifts = getShifts();
  const primaryShift = shifts.find(s => s.code === primary);
  
  // Fix priority order
  if (!window._priorityOrder) window._priorityOrder = [];
  window._priorityOrder = window._priorityOrder.filter(c => {
    const cb = document.querySelector(`.s-secondary[value="${c}"]`);
    return cb && cb.checked && c !== primary;
  });
  
  let html = `<div style="font-weight:600;color:var(--primary);margin-bottom:8px">📋 Shift Priority</div>
    <div style="padding:8px 10px;background:rgba(20,184,166,0.12);border:1px solid var(--primary);border-radius:8px;margin-bottom:6px">
      <strong style="color:var(--primary)">1st:</strong> ${primaryShift ? primaryShift.name + ' (' + primaryShift.code + ')' : primary}
    </div>`;
  
  window._priorityOrder.forEach((code, i) => {
    const s = shifts.find(x => x.code === code);
    if (!s) return;
    const ord = i === 0 ? '2nd' : i === 1 ? '3rd' : (i + 2) + 'th';
    html += `<div style="padding:8px 10px;background:var(--bg-0);border:1px solid var(--border);border-radius:8px;margin-bottom:6px"><strong>${ord}:</strong> ${s.name} (${s.code})</div>`;
    
    // Update badge
    const badge = document.querySelector(`.priority-badge[data-code="${code}"]`);
    if (badge) { badge.textContent = ord; badge.style.display = 'inline-block'; }
  });
  
  // Hide badges for unchecked
  $$('.priority-badge').forEach(b => {
    const code = b.dataset.code;
    if (!window._priorityOrder.includes(code)) b.style.display = 'none';
  });
  
  if (window._priorityOrder.length === 0) {
    html += `<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px">No secondary shifts — click checkboxes in priority order</div>`;
  }
  
  const previewEl = $('s_shiftPreview');
  if (previewEl) previewEl.innerHTML = html;
}

function addSpecialOffDate() {
  const date = $('s_specialDate')?.value;
  if (!date) { toast('Select date', 'error'); return; }
  if (!window._specialOffDates) window._specialOffDates = [];
  if (window._specialOffDates.includes(date)) { toast('Already added', 'warning'); return; }
  window._specialOffDates.push(date);
  renderSpecialOffDates();
  $('s_specialDate').value = '';
}

function removeSpecialOffDate(date) {
  window._specialOffDates = window._specialOffDates.filter(d => d !== date);
  renderSpecialOffDates();
}

function renderSpecialOffDates() {
  const el = $('s_specialDatesList');
  if (!el) return;
  const dates = window._specialOffDates || [];
  if (dates.length === 0) { el.innerHTML = '<div style="font-size:11.5px;color:var(--text-dim)">None</div>'; return; }
  el.innerHTML = dates.sort().map(d => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg-1);border-radius:8px;margin-bottom:4px;font-size:12.5px">
      <span>📅 ${fmtDisplay(d)}</span>
      <button onclick="removeSpecialOffDate('${d}')" style="background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:16px">✕</button>
    </div>
  `).join('');
}

function saveStaffV4(desId, id) {
  const isNew = !id;
  const name = $('s_name').value.trim();
  const mobile = normalizeMobile($('s_mobile').value.trim());
  const password = $('s_password').value.trim();
  const gender = $('s_gender').value;
  const designation = $('s_designation').value;
  const primaryShift = $('s_primaryShift').value;
  const secondaryShifts = window._priorityOrder ? [...window._priorityOrder] : [];
  const station = $('s_station').value.trim();
  const notifications = $('s_notifications').checked;
  const adminEl = $('s_admin');
  const isAdmin = adminEl ? adminEl.checked : false;
  const specialOffDates = window._specialOffDates || [];
  
  if (!name) { toast('Enter name', 'error'); return; }
  if (!mobile || mobile.length !== 11) { toast('Enter valid 11-digit mobile', 'error'); return; }
  if (!gender) { toast('Select gender', 'error'); return; }
  if (!primaryShift) { toast('Select primary shift', 'error'); return; }
  
  const existing = State.staff.find(s => normalizeMobile(s.mobile) === mobile && s._id !== id);
  if (existing) { toast('Mobile already registered', 'error'); return; }
  
  if (isNew && (!password || password.length < 6)) { toast('Password 6+ chars', 'error'); return; }
  
  let staff = LocalDB.get('staff', []);
  
  const staffData = {
    name, mobile, gender,
    designation,
    role: isAdmin ? 'admin' : 'staff',
    fixedShift: primaryShift,
    shift: primaryShift,
    multiShifts: secondaryShifts,
    specialOffDates,
    station,
    notifications,
    active: true
  };
  
  if (isNew) {
    const newStaff = { _id: uid(), ...staffData, password, createdAt: Date.now() };
    staff.push(newStaff);
    State.staff.push(newStaff);
  } else {
    const idx = staff.findIndex(x => x._id === id);
    const updates = { ...staffData };
    if (password && password.length >= 6) updates.password = password;
    if (idx >= 0) staff[idx] = { ...staff[idx], ...updates };
    const sidx = State.staff.findIndex(x => x._id === id);
    if (sidx >= 0) State.staff[sidx] = { ...State.staff[sidx], ...updates };
  }
  
  LocalDB.set('staff', staff);
  toast(isNew ? `✅ ${name} added` : `✅ Updated`, 'success');
  openDesignationSection(designation);
}

function deleteStaff(id, desId) {
  if (!confirm('Delete this staff?')) return;
  if (id === State.user?._id) { toast('Cannot delete yourself', 'error'); return; }
  let staff = LocalDB.get('staff', []);
  staff = staff.filter(x => x._id !== id);
  LocalDB.set('staff', staff);
  State.staff = State.staff.filter(x => x._id !== id);
  toast('Deleted', 'success');
  openDesignationSection(desId);
}

/* ═══════════════════════════════════════════════════════════
   EXCEL / CSV IMPORT
   ═══════════════════════════════════════════════════════════ */
function openImportModal() {
  if (!canManage()) { toast('Admin only', 'error'); return; }
  
  openModal(`
    <div class="modal-header"><h2>📤 Import Roster</h2><button class="modal-close" onclick="closeModal()">✕</button></div>
    
    <div style="background:var(--bg-1);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12.5px;color:var(--text-muted);line-height:1.6">
      <strong>Format:</strong><br>
      • Column 1: "Name" (full staff name)<br>
      • Columns 2-32: Dates (26, 27, ... 25)<br>
      • Cells: M, E, N, OFF, PH, X, etc.
    </div>
    
    <div class="input-group">
      <label>Select File (.xlsx, .xls, .csv)</label>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" style="padding:10px">
    </div>
    
    <div class="btn-row mt16">
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px" onclick="processImport()">📤 Upload</button>
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function processImport() {
  const fileInput = $('importFile');
  if (!fileInput.files || !fileInput.files[0]) { toast('Select file', 'error'); return; }
  
  const file = fileInput.files[0];
  const reader = new FileReader();
  
  reader.onload = (e) => {
    try {
      let rows;
      if (file.name.endsWith('.csv')) {
        const result = Papa.parse(e.target.result, { skipEmptyLines: true });
        rows = result.data;
      } else {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      }
      
      parseRosterRows(rows);
    } catch (err) {
      console.error('Import error:', err);
      toast('Failed to parse: ' + err.message, 'error');
    }
  };
  
  if (file.name.endsWith('.csv')) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

function parseRosterRows(rows) {
  if (rows.length < 5) { toast('File too short', 'error'); return; }
  
  // Find header row (contains "Name" or "Sr.")
  let headerIdx = -1;
  for (let i = 0; i < Math.min(10, rows.length); i++) {
    const row = rows[i];
    if (row.some(c => String(c).toLowerCase().trim() === 'name')) {
      headerIdx = i;
      break;
    }
  }
  
  if (headerIdx === -1) { toast('Cannot find "Name" column', 'error'); return; }
  
  const header = rows[headerIdx];
  const nameColIdx = header.findIndex(c => String(c).toLowerCase().trim() === 'name');
  
  // Extract dates
  const dates = [];
  for (let i = nameColIdx + 1; i < header.length; i++) {
    const val = header[i];
    if (val !== '' && !isNaN(parseInt(val))) {
      dates.push(parseInt(val));
    } else if (val === '') break;
  }
  
  if (dates.length === 0) { toast('No dates found in header', 'error'); return; }
  
  // Determine period
  const periodStartMonth = dates[0] > 20 ? 4 : 5; // April if first date > 20, else May (adjust)
  const year = new Date().getFullYear();
  const periodStart = `${year}-${String(periodStartMonth).padStart(2,'0')}-${String(dates[0]).padStart(2,'0')}`;
  
  // Parse staff data
  const roster = {};
  const staffMap = {};
  let matchedCount = 0;
  
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const name = String(row[nameColIdx] || '').trim();
    if (!name) continue;
    
    // Find staff by exact name
    const staff = State.staff.find(s => 
      s.name.toLowerCase() === name.toLowerCase()
    );
    
    if (!staff) { continue; }
    matchedCount++;
    staffMap[staff._id] = staff;
    
    for (let j = 0; j < dates.length; j++) {
      const day = dates[j];
      const cell = String(row[nameColIdx + 1 + j] || '').trim();
      if (!cell) continue;
      
      // Build date
      const d = new Date(year, periodStartMonth - 1, day);
      const dateStr = d.toISOString().split('T')[0];
      
      // Convert cell value
      let code = cell.toUpperCase().replace(/\s+/g, '');
      const codeMap = {
        'M': 'M', 'MORNING': 'M',
        'E': 'E', 'EVENING': 'E',
        'N': 'N', 'NIGHT': 'N',
        'N12': 'N12',
        'E4': 'E4',
        'D': 'D', 'D2': 'D2',
        'X': 'X',
        'O': 'OFF', 'OFF': 'OFF',
        'PH': 'PH', 'GH': 'PH',
        'CPL': 'CPL', 'CL': 'CL',
        'EL': 'EL',
        'ME': 'ME', 'EN': 'EN',
        'M+E': 'M+E', 'DX': 'DX', 'XE': 'XE', 'MX': 'MX'
      };
      code = codeMap[code] || code;
      
      if (!roster[dateStr]) roster[dateStr] = {};
      roster[dateStr][staff._id] = code;
    }
  }
  
  if (matchedCount === 0) { toast('No staff names matched. Check spelling.', 'error'); return; }
  
  // Save
  State.rosterData = roster;
  State.rosterPeriod = { start: periodStart, end: `${year}-05-25` };
  LocalDB.set('rosterData', roster);
  LocalDB.set('rosterPeriod', State.rosterPeriod);
  
  toast(`✅ Imported ${matchedCount} staff`, 'success');
  closeModal();
  State.activeTab = 'roster';
  render();
}

   <script>
/* ═══════════════════════════════════════════════════════════
   KIH PHLEBOTOMY v4.0 — PART 4 (FINAL)
   ROSTER ALGORITHM + VALIDATION + SAVE + BOOT
   ═══════════════════════════════════════════════════════════ */

/* WIZ STATE */
const WIZ = {
  step: 1,
  periodStart: null,
  periodEnd: null,
  holidays: [],
  mode: 'auto',
  grid: {},
  locked: {},
  offCount: {},
  phCount: {},
  cplConversions: [],
  conflictLog: [],
  warnings: [],
  staffList: [],
  periodDates: []
};

function calcPeriod(refDate = new Date()) {
  const startDay = 26, endDay = 25;
  const today = refDate.getDate();
  let start, end;
  if (today >= startDay) {
    start = new Date(refDate.getFullYear(), refDate.getMonth(), startDay);
    end = new Date(refDate.getFullYear(), refDate.getMonth() + 1, endDay);
  } else {
    start = new Date(refDate.getFullYear(), refDate.getMonth() - 1, startDay);
    end = new Date(refDate.getFullYear(), refDate.getMonth(), endDay);
  }
  return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
}

/* Get roster-eligible staff (POINT 4: admin excluded) */
function getRosterStaff() {
  return State.staff.filter(s => 
    s.active !== false && 
    !s.guest && 
    s.role !== 'admin'  // POINT 4
  );
}

/* Day classification (POINT 2) */
function classifyDay(date) {
  if (isSunday(date)) return 'SUNDAY';
  if (isHoliday(date, WIZ.holidays)) return 'HOLIDAY';
  if (isSaturday(date)) return 'SATURDAY';
  return 'WEEKDAY';
}

function getRelaxLimit(date) {
  const cls = classifyDay(date);
  if (cls === 'SUNDAY' || cls === 'HOLIDAY') return 7;
  if (cls === 'SATURDAY') return 2;
  return 1;
}

function isRelaxCode(code) {
  return ['OFF','PH','D','X','L','CPL','EL','CL'].includes(code);
}

function getDayRelaxCount(date) {
  let count = 0;
  for (const id in WIZ.grid[date]) {
    if (isRelaxCode(WIZ.grid[date][id])) count++;
  }
  return count;
}

function canAssignRelax(date) {
  return getDayRelaxCount(date) < getRelaxLimit(date);
}

function calcOffTarget() {
  return WIZ.periodDates.filter(d => isSunday(d)).length;
}

function calcHolidayCount() {
  return WIZ.holidays.length;
}

/* Get shift requirements (3 categories) */
function getShiftReq(date) {
  const shifts = getShifts();
  const cls = classifyDay(date);
  let category = 'staffMonFri';
  if (cls === 'SUNDAY' || cls === 'HOLIDAY') category = 'staffSun';
  else if (cls === 'SATURDAY') category = 'staffSat';
  
  const req = {};
  shifts.forEach(s => {
    if (['X','OFF','PH','CPL','EL','CL'].includes(s.code)) return;
    const count = s[category] || 0;
    if (count > 0) req[s.code] = count;
  });
  return req;
}

function logDecision(date, staff, code, reason) {
  WIZ.conflictLog.push({ date, note: `${staff.name}: ${code} (${reason})` });
}

/* ═══ STEP A: INIT GRID ═══ */
function initGrid() {
  WIZ.grid = {};
  WIZ.locked = {};
  WIZ.offCount = {};
  WIZ.phCount = {};
  
  WIZ.staffList.forEach(s => {
    WIZ.offCount[s._id] = 0;
    WIZ.phCount[s._id] = 0;
  });
  
  WIZ.periodDates.forEach(date => {
    WIZ.grid[date] = {};
    WIZ.locked[date] = {};
    WIZ.staffList.forEach(s => {
      WIZ.grid[date][s._id] = '';
      WIZ.locked[date][s._id] = false;
    });
  });
}

/* ═══ STEP B: LOCKED ENTRIES ═══ */
function applyLockedEntries() {
  // Special off dates
  WIZ.staffList.forEach(staff => {
    (staff.specialOffDates || []).forEach(date => {
      if (WIZ.grid[date] && WIZ.grid[date][staff._id] !== undefined) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
      }
    });
  });
  
  // Approved leaves
  State.leaveRequests.filter(l => l.status === 'approved').forEach(leave => {
    const dates = dateRange(leave.from, leave.to);
    dates.forEach(date => {
      if (WIZ.grid[date] && WIZ.grid[date][leave.staffId] !== undefined && !WIZ.locked[date][leave.staffId]) {
        WIZ.grid[date][leave.staffId] = 'L';
        WIZ.locked[date][leave.staffId] = true;
      }
    });
  });
}

/* ═══ STEP C: ASSIGN OFF — STRICT (POINT 3, 6, 20, 21) ═══ */
function assignOFFToAllStaff() {
  const target = calcOffTarget();
  
  // Sort: lowest offCount first
  const sorted = [...WIZ.staffList].sort((a, b) => WIZ.offCount[a._id] - WIZ.offCount[b._id]);
  
  // ═══ POINT 6 & 21: Female staff equal Sunday OFF distribution (round-robin) ═══
  const females = sorted.filter(s => s.gender === 'Female');
  const sundays = WIZ.periodDates.filter(d => classifyDay(d) === 'SUNDAY');
  
  if (females.length > 0 && sundays.length > 0) {
    const startIdx = State.sundayIndex || 0;
    sundays.forEach((date, i) => {
      // Rotate female index
      const fIdx = (startIdx + i) % females.length;
      const staff = females[fIdx];
      if (WIZ.locked[date][staff._id]) return;
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Sunday off (female rotation)');
    });
    // Save next index
    State.sundayIndex = (startIdx + sundays.length) % Math.max(1, females.length);
    LocalDB.set('sundayIndex', State.sundayIndex);
  }
  
  // Also assign Sundays to male staff (round-robin)
  const males = sorted.filter(s => s.gender === 'Male');
  if (males.length > 0 && sundays.length > 0) {
    const startIdx = LocalDB.get('sundayIndexMale', 0);
    sundays.forEach((date, i) => {
      if (WIZ.locked[date] && WIZ.grid[date]) {
        // Check if any male already assigned
        const already = males.find(m => WIZ.locked[date][m._id] && WIZ.grid[date][m._id] === 'OFF');
        if (already) return;
      }
      const mIdx = (startIdx + i) % males.length;
      const staff = males[mIdx];
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Sunday off');
    });
    LocalDB.set('sundayIndexMale', (startIdx + sundays.length) % Math.max(1, males.length));
  }
  
  // C2. Holidays → PH
  const holidayDates = WIZ.holidays.map(h => h.date);
  sorted.forEach(staff => {
    holidayDates.forEach(date => {
      if (!WIZ.grid[date] || WIZ.locked[date][staff._id]) return;
      if (WIZ.phCount[staff._id] >= calcHolidayCount()) return;
      WIZ.grid[date][staff._id] = 'PH';
      WIZ.locked[date][staff._id] = true;
      WIZ.phCount[staff._id]++;
      logDecision(date, staff, 'PH', 'Holiday');
    });
  });
  
  // C3. Saturdays
  const saturdays = WIZ.periodDates.filter(d => classifyDay(d) === 'SATURDAY');
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    saturdays.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Saturday off');
    });
  });
  
  // C4. Weekdays — STRICT (POINT 3 & 20: never exceed target)
  const weekdays = WIZ.periodDates.filter(d => classifyDay(d) === 'WEEKDAY');
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    weekdays.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;  // POINT 3 strict
      if (!canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Weekday off');
    });
  });
  
  // C5. Final pass — STRICT: no extra OFF
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    WIZ.periodDates.forEach(date => {
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.offCount[staff._id] >= target) return;  // POINT 3
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Final pass');
    });
  });
}

/* ═══ STEP D: PROCESS DAYS ═══ */
function processAllDays() {
  WIZ.periodDates.forEach((date, idx) => {
    processDay(date, idx === 0 ? null : WIZ.periodDates[idx - 1]);
  });
}

function processDay(date, prevDate) {
  applyN12PriorityRest(date, prevDate);
  fillDayShifts(date);
  autoFixMissingShifts(date);
  assignXIfNeeded(date);  // POINT 22-23
  // Fill remaining with X
  WIZ.staffList.forEach(staff => {
    if (!WIZ.grid[date][staff._id]) {
      WIZ.grid[date][staff._id] = 'X';
    }
  });
}

/* POINT 9: N/N12 ke baad — OFF → M → D → X → E4 → E */
function applyN12PriorityRest(date, prevDate) {
  if (!prevDate) return;
  WIZ.staffList.forEach(staff => {
    if (WIZ.locked[date][staff._id]) return;
    const prevCode = WIZ.grid[prevDate][staff._id];
    if (prevCode === 'N' || prevCode === 'N12') {
      // Priority 1: OFF
      if (canAssignRelax(date) && WIZ.offCount[staff._id] < calcOffTarget()) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
        logDecision(date, staff, 'OFF', 'Post N/N12 → OFF');
        return;
      }
      // Priority 2: M
      const req = getShiftReq(date);
      if ((req.M || 0) > countCode(date, 'M')) {
        WIZ.grid[date][staff._id] = 'M';
        WIZ.locked[date][staff._id] = true;
        logDecision(date, staff, 'M', 'Post N/N12 → M (OFF not available)');
        return;
      }
      // Priority 3: D
      if ((req.D || 0) > countCode(date, 'D')) {
        WIZ.grid[date][staff._id] = 'D';
        WIZ.locked[date][staff._id] = true;
        logDecision(date, staff, 'D', 'Post N/N12 → D');
        return;
      }
      // Priority 4: X (fallback, will be handled)
      WIZ.grid[date][staff._id] = 'X';
      WIZ.locked[date][staff._id] = true;
      logDecision(date, staff, 'X', 'Post N/N12 → X (standby)');
    }
  });
}

function countCode(date, code) {
  return Object.values(WIZ.grid[date] || {}).filter(c => c === code).length;
}

/* POINT 7: Female staff — no N/N12 */
function isCodeAllowedForStaff(staff, code) {
  if (staff.gender === 'Female' && (code === 'N' || code === 'N12')) return false;
  return true;
}

function fillDayShifts(date) {
  const req = getShiftReq(date);
  const codes = Object.keys(req).filter(c => req[c] > 0);
  
  // Sort by priority: M, E, then others
  codes.sort((a, b) => {
    const order = { M: 1, E: 2, N: 3, D: 4, D2: 5, E4: 6, N12: 7 };
    return (order[a] || 99) - (order[b] || 99);
  });
  
  codes.forEach(shiftCode => {
    let need = req[shiftCode] || 0;
    if (need <= 0) return;
    
    const free = WIZ.staffList.filter(s => 
      !WIZ.locked[date][s._id] && 
      !WIZ.grid[date][s._id] &&
      isCodeAllowedForStaff(s, shiftCode)  // POINT 7
    );
    
    // Priority: primary shift first, then secondary order
    const sorted = free.map(s => {
      let priority = 99;
      const primary = s.fixedShift || s.shift;
      const multi = s.multiShifts || [];
      if (primary === shiftCode) priority = 0;
      else if (multi.includes(shiftCode)) priority = 1 + multi.indexOf(shiftCode);
      return { staff: s, priority };
    }).sort((a, b) => a.priority - b.priority);
    
    for (const { staff } of sorted) {
      if (need <= 0) break;
      WIZ.grid[date][staff._id] = shiftCode;
      WIZ.locked[date][staff._id] = true;
      need--;
      logDecision(date, staff, shiftCode, `Fill ${shiftCode}`);
    }
  });
}

function autoFixMissingShifts(date) {
  const req = getShiftReq(date);
  const codes = Object.keys(req).filter(c => req[c] > 0);
  
  codes.forEach(shiftCode => {
    const need = req[shiftCode] || 0;
    if (need <= 0) return;
    const current = countCode(date, shiftCode);
    let missing = need - current;
    if (missing <= 0) return;
    
    WIZ.staffList.forEach(staff => {
      if (missing <= 0) return;
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.grid[date][staff._id] === 'X' || WIZ.grid[date][staff._id] === 'E4') {
        if (!isCodeAllowedForStaff(staff, shiftCode)) return;
        WIZ.grid[date][staff._id] = shiftCode;
        missing--;
        logDecision(date, staff, shiftCode, 'Fix from standby');
      }
    });
  });
}


/* ═══ STEP E: PH ADJUSTMENT ═══ */
function adjustPHForDutyStaff() {
  if (WIZ.holidays.length === 0) return;
  WIZ.staffList.forEach(staff => {
    WIZ.holidays.forEach(holiday => {
      const hDate = holiday.date;
      const code = WIZ.grid[hDate]?.[staff._id];
      if (code && !isRelaxCode(code)) {
        const candidates = WIZ.periodDates.filter(d => 
          d !== hDate && !WIZ.locked[d][staff._id] &&
          !isRelaxCode(WIZ.grid[d][staff._id]) && canAssignRelax(d)
        );
        candidates.sort((a, b) => Math.abs(new Date(a) - new Date(hDate)) - Math.abs(new Date(b) - new Date(hDate)));
        if (candidates.length > 0) {
          const target = candidates[0];
          WIZ.grid[target][staff._id] = 'PH';
          WIZ.locked[target][staff._id] = true;
          WIZ.phCount[staff._id]++;
          logDecision(target, staff, 'PH', `PH for holiday ${hDate}`);
        } else {
          const cpl = {
            _id: uid(), staffId: staff._id, staffName: staff.name,
            type: 'PH_TO_CPL', amount: 1,
            originalHolidayDate: hDate, holidayName: holiday.name,
            status: 'pending', pendingInNextRoster: true,
            createdAt: Date.now()
          };
          WIZ.cplConversions.push(cpl);
          LocalDB.push('cplRecords', cpl);
          logDecision(hDate, staff, 'CPL', 'PH→CPL');
        }
      }
    });
  });
}

/* ═══ STEP F: FINALIZE + VALIDATE (STRICT) ═══ */
function finalizeGeneration() {
  const offTarget = calcOffTarget();
  const holidayCount = calcHolidayCount();
  
  WIZ.offCount = {}; WIZ.phCount = {};
  WIZ.staffList.forEach(s => { WIZ.offCount[s._id] = 0; WIZ.phCount[s._id] = 0; });
  
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      const code = WIZ.grid[date][staff._id];
      if (code === 'OFF') WIZ.offCount[staff._id]++;
      if (code === 'PH') WIZ.phCount[staff._id]++;
    });
  });
  
  WIZ.warnings = [];
  
  // V1: OFF target STRICT (POINT 3 & 20)
  WIZ.staffList.forEach(staff => {
    const actual = WIZ.offCount[staff._id];
    if (actual > offTarget) WIZ.warnings.push(`${staff.name}: EXTRA OFF ${actual}/${offTarget}`);
    else if (actual < offTarget) WIZ.warnings.push(`${staff.name}: OFF kam ${actual}/${offTarget}`);
  });
  
  // V2: PH count
  WIZ.staffList.forEach(staff => {
    const actual = WIZ.phCount[staff._id];
    const cplAdj = WIZ.cplConversions.filter(c => c.staffId === staff._id).length;
    if (actual + cplAdj !== holidayCount) {
      WIZ.warnings.push(`${staff.name}: PH ${actual + cplAdj}/${holidayCount}`);
    }
  });
  
  // V3: Relax limit
  WIZ.periodDates.forEach(date => {
    const relax = getDayRelaxCount(date);
    const limit = getRelaxLimit(date);
    if (relax > limit) WIZ.warnings.push(`${date}: relax ${relax}/${limit}`);
  });
  
  // V4: N/N12 → next day (POINT 9)
  for (let i = 1; i < WIZ.periodDates.length; i++) {
    const prevDate = WIZ.periodDates[i - 1];
    const currDate = WIZ.periodDates[i];
    WIZ.staffList.forEach(staff => {
      const prevCode = WIZ.grid[prevDate][staff._id];
      const currCode = WIZ.grid[currDate][staff._id];
      if ((prevCode === 'N' || prevCode === 'N12') && !['OFF','M','D','X','E4','E'].includes(currCode)) {
        WIZ.warnings.push(`${staff.name}: N/N12 → ${currCode} on ${currDate}`);
      }
    });
  }
  
  // V5: Empty cells
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      if (!WIZ.grid[date][staff._id]) WIZ.warnings.push(`${staff.name} empty on ${date}`);
    });
  });
  
  // V6: POINT 7 — Female N/N12
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      if (staff.gender === 'Female') {
        const code = WIZ.grid[date][staff._id];
        if (code === 'N' || code === 'N12') {
          WIZ.warnings.push(`${staff.name} (Female) on ${code} on ${date}`);
        }
      }
    });
  });
  
  return WIZ.warnings.length === 0;
}

/* MAIN RUNNER */
function wizRunGeneration() {
  if (WIZ.staffList.length === 0) { toast('No active staff', 'error'); return; }
  WIZ.periodDates = dateRange(WIZ.periodStart, WIZ.periodEnd);
  if (WIZ.periodDates.length === 0) { toast('Invalid period', 'error'); return; }
  
  WIZ.step = 5;
  renderWizard();
  toast('⏳ Generating...', 'warning');
  
  setTimeout(() => {
    try {
      initGrid();
      applyLockedEntries();
      assignOFFToAllStaff();
      processAllDays();
      adjustPHForDutyStaff();
      const valid = finalizeGeneration();
      toast(valid ? '✅ Roster generated!' : `⚠️ ${WIZ.warnings.length} warnings`, valid ? 'success' : 'error');
      WIZ.step = 6;
      renderWizard();
    } catch (e) {
      console.error('Generation error:', e);
      toast('Failed: ' + e.message, 'error');
      WIZ.step = 4;
      renderWizard();
    }
  }, 200);
}

function wizSaveRoster() {
  if (WIZ.warnings.length > 0) { toast('Fix warnings first', 'error'); return; }
  if (!confirm('Save this roster?')) return;
  
  const periodId = `${WIZ.periodStart}_${WIZ.periodEnd}`;
  const roster = {
    _id: periodId,
    periodStart: WIZ.periodStart,
    periodEnd: WIZ.periodEnd,
    generatedAt: Date.now(),
    generatedBy: State.user?.name || 'Admin',
    staffCount: WIZ.staffList.length,
    grid: WIZ.grid,
    offCount: WIZ.offCount,
    phCount: WIZ.phCount,
    cplConversions: WIZ.cplConversions,
    log: WIZ.conflictLog,
    holidays: WIZ.holidays
  };
  
  try {
    let allRosters = LocalDB.get('rosters', []);
    const idx = allRosters.findIndex(r => r._id === periodId);
    if (idx >= 0) allRosters[idx] = roster;
    else allRosters.push(roster);
    LocalDB.set('rosters', allRosters);
    LocalDB.set('rosterData', WIZ.grid);
    LocalDB.set('rosterPeriod', { start: WIZ.periodStart, end: WIZ.periodEnd });
    
    State.rosterData = WIZ.grid;
    State.rosterPeriod = { start: WIZ.periodStart, end: WIZ.periodEnd };
    
    LocalDB.push('notifications', {
      _id: uid(), title: '✅ Roster Published',
      body: `Period: ${fmtDisplay(WIZ.periodStart)} → ${fmtDisplay(WIZ.periodEnd)}`,
      read: false, createdAt: Date.now()
    });
    State.notifications = LocalDB.get('notifications', []);
    State.unreadCount = State.notifications.filter(n => !n.read).length;
    updateBell();
    
    toast('✅ Roster saved!', 'success');
    closeModal();
    State.activeTab = 'roster';
    render();
  } catch (e) {
    console.error('Save error:', e);
    toast('Save failed: ' + e.message, 'error');
  }
}

function exportCSV() {
  if (!State.rosterData || !State.rosterPeriod) return;
  const dates = dateRange(State.rosterPeriod.start, State.rosterPeriod.end);
  const staffList = getRosterStaff();
  const headers = ['Staff', 'Gender', 'Mobile', ...dates.map(d => `${d} (${dayShort(d)})`)];
  const rows = [headers];
  staffList.forEach(staff => {
    const row = [staff.name, staff.gender || '', staff.mobile || ''];
    dates.forEach(date => { row.push(State.rosterData[date]?.[staff._id] || 'X'); });
    rows.push(row);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kih-roster-${State.rosterPeriod.start}-to-${State.rosterPeriod.end}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ CSV exported', 'success');
}

  reader.onload = e => {
    localStorage.setItem('kih_hospital_logo', e.target.result);
    applyLogo();
    toast('Logo uploaded', 'success');
    openHospitalModal();
  };
  reader.readAsDataURL(file);
}

/* Resize */
(function() {
  function check() {
    if (window.innerWidth >= 1024) { if (!document.getElementById('kihSidebar')) buildSidebar(); }
    else { const sb = document.getElementById('kihSidebar'); if (sb) sb.remove(); }
  }
  setTimeout(check, 100);
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(check, 250); });
})();

  // Ensure admin
  let staff = LocalDB.get('staff', []);
  if (staff.length === 0 || !staff.find(s => s.mobile === '03001234567')) {
    staff = staff.filter(s => s.mobile !== '03001234567');
    staff.push(DEFAULT_ADMIN);
    LocalDB.set('staff', staff);
  }
  
  // Auth handlers
  const loginBtn = $('loginBtn');
  const guestBtn = $('guestBtn');
  const logoutBtn = $('logoutBtn');
  const bell = $('notificationBell');
  
  if (loginBtn) loginBtn.onclick = doLogin;
  if (guestBtn) guestBtn.onclick = doGuestLogin;
  if (logoutBtn) logoutBtn.onclick = doLogout;
  if (bell) bell.onclick = openNotificationsModal;
  
  const pwd = $('loginPassword');
  if (pwd) pwd.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  
  const mob = $('loginMobile');
  if (mob) mob.addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 11) v = v.slice(0, 11);
    e.target.value = v;
  });
  
  window.addEventListener('online', () => toast('Back online', 'success'));
  window.addEventListener('offline', () => toast('Offline', 'warning'));
  
  // Auto-login
  const session = loadSession();
  if (session && session.user) {
    const all = LocalDB.get('staff', [DEFAULT_ADMIN]);
    const exists = all.find(s => s._id === session.user._id);
    if (exists) { State.user = exists; showApp(); return; }
    else clearSession();
  }
  
  $('loginScreen').style.display = 'flex';
  
  console.log('%c🩸 KIH Phlebotomy Companion v4.0', 'color:#14B8A6;font-weight:bold;font-size:14px');
  console.log('%c✅ All 24 POINTS implemented', 'color:#10B981;font-size:12px');
  console.log('%c🔐 Login: 03001234567 / admin123', 'color:#6B7280;font-size:11px');
})();
</script>
</body>
</html>
   
</script>

  purple:  { name: 'Purple',  grad: 'linear-gradient(135deg,#8B5CF6,#6D28D9)' }
};
const FONTSIZES = { xs:'13px', s:'14px', m:'15px', l:'16px', xl:'17px', xxl:'18px' };
const BG_PRESETS = {
  none:   { name: 'None',   css: 'none' },
  ocean:  { name: 'Ocean',  css: 'linear-gradient(135deg,#0B0F1A 0%,#1E3A8A 50%,#0B0F1A 100%)' },
  sunset: { name: 'Sunset', css: 'linear-gradient(135deg,#0B0F1A 0%,#7C2D12 50%,#0B0F1A 100%)' },
  space:  { name: 'Space',  css: 'radial-gradient(circle at 20% 20%,#1E1B4B 0%,#0B0F1A 70%)' },
  forest: { name: 'Forest', css: 'linear-gradient(135deg,#0B0F1A 0%,#064E3B 50%,#0B0F1A 100%)' },
  cherry: { name: 'Cherry', css: 'linear-gradient(135deg,#0B0F1A 0%,#831843 50%,#0B0F1A 100%)' }
};

window.applyThemeV2 = function(themeName) {
  const t = THEMES_V2[themeName];
  if (!t) return;
  if (themeName === 'auto') {
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const actual = isDark ? THEMES_V2.dark : THEMES_V2.light;
    document.documentElement.style.setProperty('--bg-0', actual.bg);
    document.documentElement.style.setProperty('--text', actual.text);
    document.body.style.background = actual.bg;
  } else {
    document.documentElement.style.setProperty('--bg-0', t.bg);
    document.documentElement.style.setProperty('--text', t.text);
    document.body.style.background = t.bg;
  }
  localStorage.setItem('kih_theme_v2', themeName);
  State.settings.theme = themeName;
};

window.applyAccentV2 = function(accentName) {
  const a = ACCENTS_V2[accentName];
  if (!a) return;
  document.documentElement.style.setProperty('--primary-grad', a.grad);
  localStorage.setItem('kih_accent_v2', accentName);
  State.settings.accent = accentName;
};

window.applyFontSizeV2 = function(size) {
  document.documentElement.style.fontSize = FONTSIZES[size] || '15px';
  localStorage.setItem('kih_fontsize_v2', size);
  State.settings.fontSize = size;
};

window.applyFontFamily = function(family) {
  const families = {
    inter: "'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif",
    jetbrains: "'JetBrains Mono', monospace",
    system: "-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
  };
  document.body.style.fontFamily = families[family] || families.inter;
  localStorage.setItem('kih_fontfamily', family);
  State.settings.fontFamily = family;
};

window.applyBackgroundFile = function(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { toast('Image too large (max 3MB)', 'error'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      localStorage.setItem('kih_bg_image', e.target.result);
      applyBackgroundCSS(e.target.result);
      toast('Background applied', 'success');
      openDisplaySettings();
    } catch (err) { toast('Storage full', 'error'); }
  };
  reader.readAsDataURL(file);
};

window.applyBackgroundUrl = function(url) {
  if (!url || !url.startsWith('http')) { toast('Invalid URL', 'error'); return; }
  localStorage.setItem('kih_bg_image', url);
  applyBackgroundCSS(url);
  toast('Background applied', 'success');
  openDisplaySettings();
};

window.applyBackgroundPreset = function(presetId) {
  const preset = BG_PRESETS[presetId];
  if (!preset) return;
  if (presetId === 'none') {
    localStorage.removeItem('kih_bg_image');
    localStorage.removeItem('kih_bg_preset');
    document.body.style.backgroundImage = 'none';
    document.body.style.background = 'var(--bg-0)';
    toast('Background removed', 'success');
  } else {
    localStorage.setItem('kih_bg_preset', presetId);
    localStorage.removeItem('kih_bg_image');
    document.body.style.background = preset.css;
    document.body.style.backgroundAttachment = 'fixed';
    toast(`${preset.name} applied`, 'success');
  }
  openDisplaySettings();
};

function applyBackgroundCSS(url) {
  document.body.style.backgroundImage = `url('${url}')`;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  document.body.style.backgroundAttachment = 'fixed';
  document.body.style.backgroundRepeat = 'no-repeat';
}

window.applyDensity = function(density) {
  const d = { compact:'13px', comfortable:'16px', spacious:'20px' };
  document.documentElement.style.setProperty('--density-padding', d[density] || '16px');
  localStorage.setItem('kih_density', density);
  State.settings.density = density;
  toast('Density updated', 'success');
};

window.applyAnimations = function(mode) {
  let el = document.getElementById('kih-anim-style');
  if (!el) { el = document.createElement('style'); el.id = 'kih-anim-style'; document.head.appendChild(el); }
  const styles = { full:'', minimal:'*{transition-duration:.05s!important;animation:none!important}', off:'*{transition:none!important;animation:none!important}' };
  el.textContent = styles[mode] || '';
  localStorage.setItem('kih_animations', mode);
  State.settings.animations = mode;
  toast(`Animations: ${mode}`, 'success');
};

window.applySound = function(on) {
  localStorage.setItem('kih_sound', on ? 'on' : 'off');
  State.settings.sound = on;
  toast(`Sound ${on ? 'ON' : 'OFF'}`, 'success');
};

window.applyVibration = function(on) {
  localStorage.setItem('kih_vibration', on ? 'on' : 'off');
  State.settings.vibration = on;
  if (on && navigator.vibrate) navigator.vibrate(50);
  toast(`Vibration ${on ? 'ON' : 'OFF'}`, 'success');
};

window.resetDisplaySettings = function() {
  if (!confirm('Reset all display settings?')) return;
  ['kih_theme_v2','kih_accent_v2','kih_fontsize_v2','kih_fontfamily','kih_bg_image','kih_bg_preset','kih_density','kih_animations','kih_sound','kih_vibration'].forEach(k => localStorage.removeItem(k));
  document.body.style.background = '';
  document.body.style.backgroundImage = '';
  document.body.style.fontFamily = '';
  document.documentElement.style.fontSize = '15px';
  toast('Reset complete', 'success');
  setTimeout(() => location.reload(), 800);
};

(function loadDisplaySettings() {
  const theme = localStorage.getItem('kih_theme_v2') || 'dark';
  const accent = localStorage.getItem('kih_accent_v2') || 'indigo';
  const fontSize = localStorage.getItem('kih_fontsize_v2') || 'm';
  const fontFamily = localStorage.getItem('kih_fontfamily') || 'inter';
  const density = localStorage.getItem('kih_density') || 'comfortable';
  const animations = localStorage.getItem('kih_animations') || 'full';
  const bgImage = localStorage.getItem('kih_bg_image');
  const bgPreset = localStorage.getItem('kih_bg_preset');
  
  if (theme) applyThemeV2(theme);
  if (accent) applyAccentV2(accent);
  if (fontSize) applyFontSizeV2(fontSize);
  if (fontFamily) applyFontFamily(fontFamily);
  if (density) applyDensity(density);
  if (animations) applyAnimations(animations);
  
  if (bgImage) applyBackgroundCSS(bgImage);
  else if (bgPreset && bgPreset !== 'none') {
    const preset = BG_PRESETS[bgPreset];
    if (preset) { document.body.style.background = preset.css; document.body.style.backgroundAttachment = 'fixed'; }
  }
})();

/* ─── C1. ROSTER RULES v2 (N/N12 → OFF/E4/E, PH → CPL) ── */

window.applyN12PriorityRest = function(date, prevDate) {
  if (!prevDate) return;
  WIZ.staffList.forEach(staff => {
    if (WIZ.locked[date][staff._id]) return;
    const prevCode = WIZ.grid[prevDate][staff._id];
    if (prevCode === 'N' || prevCode === 'N12') {
      // Priority 1: OFF
      if (canAssignRelax(date)) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
        logDecision(date, staff, 'OFF', 'Post-night rest (N/N12 → OFF)');
        return;
      }
      // Priority 2: E4
      if (!WIZ.grid[date][staff._id]) {
        WIZ.grid[date][staff._id] = 'E4';
        WIZ.locked[date][staff._id] = true;
        logDecision(date, staff, 'E4', 'Post-night fallback (no OFF → E4)');
        return;
      }
      // Priority 3: E
      WIZ.grid[date][staff._id] = 'E';
      WIZ.locked[date][staff._id] = true;
      logDecision(date, staff, 'E', 'Post-night fallback (no OFF/E4 → E)');
    }
  });
};

window.adjustPHForDutyStaff = function() {
  const holidays = WIZ.holidays;
  if (holidays.length === 0) return;
  
  WIZ.staffList.forEach(staff => {
    holidays.forEach(holiday => {
      const hDate = holiday.date;
      const code = WIZ.grid[hDate]?.[staff._id];
      if (code && !isRelaxCode(code)) {
        const candidates = WIZ.periodDates.filter(d => 
          d !== hDate && !WIZ.locked[d][staff._id] &&
          !isRelaxCode(WIZ.grid[d][staff._id]) && canAssignRelax(d)
        );
        candidates.sort((a, b) => 
          Math.abs(new Date(a) - new Date(hDate)) - Math.abs(new Date(b) - new Date(hDate))
        );
        if (candidates.length > 0) {
          const targetDate = candidates[0];
          WIZ.grid[targetDate][staff._id] = 'PH';
          WIZ.locked[targetDate][staff._id] = true;
          WIZ.phCount[staff._id]++;
          logDecision(targetDate, staff, 'PH', `PH for worked holiday ${hDate}`);
        } else {
          const cplRecord = {
            _id: uid(), staffId: staff._id, staffName: staff.name,
            staffMobile: staff.mobile, designation: staff.designation,
            type: 'PH_TO_CPL', amount: 1,
            originalHolidayDate: hDate, holidayName: holiday.name || 'Holiday',
            reason: 'No PH slot in current period',
            status: 'pending',
            currentPeriodStart: WIZ.periodStart, currentPeriodEnd: WIZ.periodEnd,
            carryForward: true, pendingInNextRoster: true,
            createdBy: State.user?.name, createdAt: Date.now()
          };
          WIZ.cplConversions.push(cplRecord);
          LocalDB.push('cplRecords', cplRecord);
          logDecision(hDate, staff, 'CPL', `PH→CPL (no slot) → next roster`);
        }
      }
    });
  });
};

window.applyPendingCPLFromPrevious = function() {
  const allCPL = LocalDB.get('cplRecords', []);
  const pendingCPL = allCPL.filter(c => c.status === 'pending' && c.pendingInNextRoster === true);
  if (pendingCPL.length === 0) return;
  
  pendingCPL.forEach(cpl => {
    const staff = WIZ.staffList.find(s => s._id === cpl.staffId);
    if (!staff) return;
    const candidates = WIZ.periodDates.filter(d => 
      !WIZ.locked[d][staff._id] &&
      !isRelaxCode(WIZ.grid[d][staff._id]) && canAssignRelax(d)
    );
    candidates.sort((a, b) => {
      const dayA = new Date(a).getDay();
      const dayB = new Date(b).getDay();
      const scoreA = (dayA >= 1 && dayA <= 5) ? 0 : 1;
      const scoreB = (dayB >= 1 && dayB <= 5) ? 0 : 1;
      return scoreA - scoreB;
    });
    if (candidates.length > 0) {
      const targetDate = candidates[0];
      WIZ.grid[targetDate][staff._id] = 'OFF';
      WIZ.locked[targetDate][staff._id] = true;
      WIZ.offCount[staff._id]++;
      LocalDB.update('cplRecords', cpl._id, {
        status: 'applied',
        appliedInPeriodStart: WIZ.periodStart,
        appliedInPeriodEnd: WIZ.periodEnd,
        appliedOnDate: targetDate, appliedAt: Date.now()
      });
      logDecision(targetDate, staff, 'OFF', `CPL from ${cpl.currentPeriodStart} → compensated`);
    }
  });
};

window.wizStartGeneration = function() {
  if (WIZ.staffList.length === 0) { toast('No active staff', 'error'); return; }
  WIZ.periodDates = getPeriodDates(WIZ.periodStart, WIZ.periodEnd);
  if (WIZ.periodDates.length === 0) { toast('Invalid period', 'error'); return; }
  toast('⏳ Generating roster...', 'warning');
  setTimeout(() => {
    try {
      initGrid();
      applyLockedEntries();
      applyPendingCPLFromPrevious();
      assignOFFToAllStaff();
      processAllDays();
      adjustPHForDutyStaff();
      const valid = finalizeGeneration();
      toast(valid ? '✅ Roster generated!' : `⚠️ ${WIZ.warnings.length} warnings`, valid ? 'success' : 'error');
      WIZ.step = 6;
      renderWizard();
    } catch (e) {
      console.error('Generation error:', e);
      toast('Generation failed: ' + e.message, 'error');
    }
  }, 100);
};

window.finalizeGeneration = function() {
  const offTarget = calcOffTarget();
  const holidayCount = calcHolidayCount();
  WIZ.offCount = {}; WIZ.phCount = {};
  WIZ.staffList.forEach(s => { WIZ.offCount[s._id] = 0; WIZ.phCount[s._id] = 0; });
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      const code = WIZ.grid[date][staff._id];
      if (code === 'OFF') WIZ.offCount[staff._id]++;
      if (code === 'PH') WIZ.phCount[staff._id]++;
    });
  });
  WIZ.warnings = [];
  
  WIZ.staffList.forEach(staff => {
    const actual = WIZ.offCount[staff._id];
    const cplComp = WIZ.cplConversions.filter(c => c.staffId === staff._id && c.type === 'PH_TO_CPL').length;
    if (actual < offTarget) WIZ.warnings.push(`${staff.name}: OFF ${actual}/${offTarget}`);
    const phActual = WIZ.phCount[staff._id];
    const phCpl = WIZ.cplConversions.filter(c => c.staffId === staff._id && c.type === 'PH_TO_CPL').length;
    if (phActual + phCpl !== holidayCount) WIZ.warnings.push(`${staff.name}: PH ${phActual + phCpl}/${holidayCount}`);
  });
  
  WIZ.periodDates.forEach(date => {
    const relax = getDayRelaxCount(date);
    const limit = getRelaxLimit(date);
    if (relax > limit) WIZ.warnings.push(`${date}: relax ${relax}/${limit}`);
  });
  
  for (let i = 1; i < WIZ.periodDates.length; i++) {
    const prevDate = WIZ.periodDates[i - 1];
    const currDate = WIZ.periodDates[i];
    WIZ.staffList.forEach(staff => {
      const prevCode = WIZ.grid[prevDate][staff._id];
      const currCode = WIZ.grid[currDate][staff._id];
      if ((prevCode === 'N' || prevCode === 'N12') && !['OFF', 'E4', 'E'].includes(currCode)) {
        WIZ.warnings.push(`${staff.name}: N/N12 → ${currCode} on ${currDate}`);
      }
    });
  }
  
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      if (!WIZ.grid[date][staff._id]) WIZ.warnings.push(`${staff.name} empty on ${date}`);
    });
  });
  return WIZ.warnings.length === 0;
};

window.updateSecondaryOptions = function() {
  const primary = $('s_primaryShift')?.value;
  if (!primary) return;
  
  $$('.secondary-shift-row').forEach(row => {
    const shift = row.dataset.shift;
    const checkbox = row.querySelector('input');
    const label = row.querySelector('span');
    
    if (shift === primary) {
      checkbox.checked = false;
      checkbox.disabled = true;
      row.style.opacity = '0.4';
      label.innerHTML = `${SHIFT_OPTIONS.find(s => s.id === shift).label} <span style="color:var(--text-dim);font-size:10px">(Primary)</span>`;
    } else {
      checkbox.disabled = false;
      row.style.opacity = '1';
      label.innerHTML = SHIFT_OPTIONS.find(s => s.id === shift).label;
    }
  });
  updateShiftPreview();
};

/* ─── UPDATE PRIORITY PREVIEW ────────────────────────── */
window.updateShiftPreview = function() {
  const primary = $('s_primaryShift')?.value || 'Morning';
  const secondary = Array.from($$('.s-secondary:checked'))
    .map(el => el.value)
    .filter(v => v !== primary);
  
  const primaryDes = SHIFT_OPTIONS.find(s => s.id === primary);
  
  let html = `
    <div style="font-weight:600;color:var(--primary);margin-bottom:8px">📋 Shift Priority Preview</div>
    <div style="padding:6px 10px;background:rgba(99,102,241,0.12);border-radius:8px;margin-bottom:4px">
      <strong>1st (Primary):</strong> ${primaryDes ? primaryDes.label : primary}
    </div>
  `;
  
  secondary.forEach((shift, i) => {
    const s = SHIFT_OPTIONS.find(x => x.id === shift);
    const ordinal = i === 0 ? '2nd' : i === 1 ? '3rd' : (i + 2) + 'th';
    html += `
      <div style="padding:6px 10px;background:var(--bg-glass);border-radius:8px;margin-bottom:4px">
        <strong>${ordinal} (Secondary):</strong> ${s ? s.label : shift}
      </div>
    `;
  });
  
  if (secondary.length === 0) {
    html += `<div style="font-size:11.5px;color:var(--text-dim);margin-top:8px">No secondary shifts selected</div>`;
  }
  
  const previewEl = $('s_shiftPreview');
  if (previewEl) previewEl.innerHTML = html;
};

/* ─── SAVE STAFF V2 ──────────────────────────────────── */
window.saveStaffV2 = function(desId, id) {
  const isNew = !id;
  const name = $('s_name').value.trim();
  const mobile = normalizeMobile($('s_mobile').value.trim());
  const password = $('s_password').value.trim();
  const primaryShift = $('s_primaryShift').value;
  const secondaryShifts = Array.from($$('.s-secondary:checked'))
    .map(el => el.value)
    .filter(v => v !== primaryShift);
  const station = $('s_station').value.trim();
  const notifications = $('s_notifications').checked;
  const adminEl = $('s_admin');
  const isAdmin = adminEl ? adminEl.checked : false;
  
  if (!name) { toast('Enter name', 'error'); return; }
  if (!mobile || mobile.length !== 11) { toast('Enter valid 11-digit mobile', 'error'); return; }
  if (!primaryShift) { toast('Select primary shift', 'error'); return; }
  
  const existing = State.staff.find(s => normalizeMobile(s.mobile) === mobile && s._id !== id);
  if (existing) { toast('Mobile already registered', 'error'); return; }
  
  if (isNew && (!password || password.length < 6)) {
    toast('Password must be 6+ chars', 'error'); return;
  }
  
  let staff = LocalDB.get('staff', []);
  
  const staffData = {
    name, mobile, designation: desId,
    role: isAdmin ? 'admin' : 'staff',
    fixedShift: primaryShift,
    shift: primaryShift,
    multiShifts: secondaryShifts,
    station, notifications, active: true
  };
  
  if (isNew) {
    const newStaff = { _id: uid(), ...staffData, password, createdAt: Date.now() };
    staff.push(newStaff);
    State.staff.push(newStaff);
  } else {
    const idx = staff.findIndex(x => x._id === id);
    const updates = { ...staffData };
    if (password && password.length >= 6) updates.password = password;
    if (idx >= 0) staff[idx] = { ...staff[idx], ...updates };
    
    const sidx = State.staff.findIndex(x => x._id === id);
    if (sidx >= 0) State.staff[sidx] = { ...State.staff[sidx], ...updates };
  }
  
  LocalDB.set('staff', staff);
  toast(isNew ? `✅ ${name} added` : `✅ Updated`, 'success');
  openDesignationSection(desId);
};

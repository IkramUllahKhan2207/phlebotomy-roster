    ` : `
      <div class="card" style="border-left:4px solid #10B981;background:rgba(16,185,129,0.05)">
        <div class="card-title" style="font-size:15px;color:#059669">✅ Validations Passed</div>
      </div>
    `}
    
    <div class="card">
      <div style="font-size:13px;line-height:1.9">
        <div class="flex-between"><span style="color:var(--text-muted)">Days</span><strong>${WIZ.periodDates.length}</strong></div>
        <div class="flex-between"><span style="color:var(--text-muted)">Staff</span><strong>${WIZ.staffList.length}</strong></div>
        <div class="flex-between"><span style="color:var(--text-muted)">OFF target</span><strong>${offTarget}</strong></div>
        <div class="flex-between"><span style="color:var(--text-muted)">Log entries</span><strong>${WIZ.conflictLog.length}</strong></div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title" style="font-size:14px">📊 Preview</div>
      <div style="max-height:340px;overflow:auto;margin-top:10px">
        ${renderRosterPreviewFull()}
      </div>
    </div>
    
    <div class="btn-row mt16">
      <button class="btn-sm" onclick="WIZ.step=3;renderWizard()">← Reconfigure</button>
      <button class="btn-sm btn-accent" style="flex:1;justify-content:center;padding:12px;${!canSave ? 'opacity:0.5' : ''}" ${!canSave ? 'disabled' : ''} onclick="wizSaveRoster()">💾 Save Roster</button>
    </div>
  `;
}

function renderRosterPreviewFull() {
  if (!WIZ.periodDates || WIZ.periodDates.length === 0) return '<div style="text-align:center;padding:20px">No data</div>';
  
  return `
    <table style="width:100%;border-collapse:collapse;font-size:10.5px;min-width:${WIZ.periodDates.length * 28 + 100}px">
      <thead>
        <tr style="background:var(--bg-1)">
          <th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);font-size:11px;position:sticky;left:0;background:var(--bg-1)">Staff</th>
          ${WIZ.periodDates.map(d => `<th style="padding:4px 2px;border-bottom:1px solid var(--border);font-size:9.5px;text-align:center;min-width:26px">${new Date(d).getDate()}<br><span style="font-size:8px;color:var(--text-dim)">${dayShort(d).slice(0,2)}</span></th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${WIZ.staffList.map(staff => `
          <tr style="border-bottom:1px solid var(--border)">
            <td style="padding:5px 6px;font-size:11px;position:sticky;left:0;background:var(--bg-0);font-weight:500;white-space:nowrap">${esc(staff.name.split(' ')[0])}</td>
            ${WIZ.periodDates.map(date => {
              const code = WIZ.grid[date]?.[staff._id] || 'X';
              const colors = { M: '#10B981', E: '#6366F1', N: '#8B5CF6', N12: '#EC4899', E4: '#3B82F6', D: '#EC4899', X: '#6B7280', OFF: '#374151', PH: '#F59E0B', L: '#F43F5E' };
              const color = colors[code] || '#6B7280';
              return `<td style="padding:3px 1px;text-align:center"><span style="display:inline-block;padding:2px 4px;border-radius:4px;background:${color};color:#fff;font-size:9px;font-weight:600;min-width:20px">${code}</span></td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
</script>
<script>
/* ═══════════════════════════════════════════════════════════
   PART 4 — GENERATION + VALIDATION + SAVE + BOOT (FINAL)
   ═══════════════════════════════════════════════════════════ */

/* ─── DAY CLASSIFICATION ─── */
function classifyDay(date) {
  if (isSunday(date)) return 'SUNDAY';
  if (isHoliday(date, WIZ.holidays)) return 'HOLIDAY';
  if (new Date(date).getDay() === 6) return 'SATURDAY';
  return 'WEEKDAY';
}

function getRelaxLimit(date) {
  const cls = classifyDay(date);
  if (cls === 'SUNDAY' || cls === 'HOLIDAY') return 7;
  if (cls === 'SATURDAY') return 2;
  return 1;
}

function isRelaxCode(code) {
  return code === 'OFF' || code === 'PH' || code === 'D' || code === 'X' || code === 'L';
}

function getDayRelaxCount(date) {
  let count = 0;
  for (const staffId in WIZ.grid[date]) {
    if (isRelaxCode(WIZ.grid[date][staffId])) count++;
  }
  return count;
}

function canAssignRelax(date) {
  return getDayRelaxCount(date) < getRelaxLimit(date);
}

function calcOffTarget() { return WIZ.periodDates.filter(d => isSunday(d)).length; }
function calcHolidayCount() { return WIZ.holidays.length; }

function getShiftReq(date) {
  const shifts = State.shiftsSimple || loadShiftsSimple();
  const cls = classifyDay(date);
  
  let category = 'staffMonFri';
  if (cls === 'SUNDAY' || cls === 'HOLIDAY') category = 'staffSun';
  else if (cls === 'SATURDAY') category = 'staffSat';
  
  const req = {};
  shifts.forEach(s => {
    if (['X','OFF','PH'].includes(s.code)) return;
    req[s.code] = s[category] || 0;
  });
  return req;
}

function logDecision(date, staff, code, reason) {
  WIZ.conflictLog.push({ date, note: `${staff.name}: ${code} (${reason})` });
}

/* ═══ STEP A: INIT GRID ═══ */
function initGrid() {
  WIZ.grid = {};
  WIZ.locked = {};
  WIZ.offCount = {};
  WIZ.phCount = {};
  
  WIZ.staffList.forEach(s => {
    WIZ.offCount[s._id] = 0;
    WIZ.phCount[s._id] = 0;
  });
  
  WIZ.periodDates.forEach(date => {
    WIZ.grid[date] = {};
    WIZ.locked[date] = {};
    WIZ.staffList.forEach(s => {
      WIZ.grid[date][s._id] = '';
      WIZ.locked[date][s._id] = false;
    });
  });
}

/* ═══ STEP B: LOCKED ENTRIES ═══ */
function applyLockedEntries() {
  WIZ.staffList.forEach(staff => {
    (staff.specialOffDates || []).forEach(date => {
      if (WIZ.grid[date] && WIZ.grid[date][staff._id] !== undefined) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
      }
    });
  });
  
  State.leaveRequests.filter(l => l.status === 'approved').forEach(leave => {
    const dates = dateRange(leave.from, leave.to);
    dates.forEach(date => {
      if (WIZ.grid[date] && WIZ.grid[date][leave.staffId] !== undefined && !WIZ.locked[date][leave.staffId]) {
        WIZ.grid[date][leave.staffId] = 'L';
        WIZ.locked[date][leave.staffId] = true;
      }
    });
  });
}

/* ═══ STEP C: ASSIGN OFF ═══ */
function assignOFFToAllStaff() {
  const target = calcOffTarget();
  const sorted = [...WIZ.staffList].sort((a, b) => WIZ.offCount[a._id] - WIZ.offCount[b._id]);
  
  // C1. Sundays
  const sundays = WIZ.periodDates.filter(d => classifyDay(d) === 'SUNDAY');
  sorted.forEach(staff => {
    sundays.forEach(date => {
      if (WIZ.locked[date][staff._id] || WIZ.offCount[staff._id] >= target || !canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Sunday off');
    });
  });
  
  // C2. Holidays → PH
  const holidayDates = WIZ.holidays.map(h => h.date);
  sorted.forEach(staff => {
    holidayDates.forEach(date => {
      if (!WIZ.grid[date] || WIZ.locked[date][staff._id] || WIZ.phCount[staff._id] >= calcHolidayCount()) return;
      WIZ.grid[date][staff._id] = 'PH';
      WIZ.locked[date][staff._id] = true;
      WIZ.phCount[staff._id]++;
      logDecision(date, staff, 'PH', 'Holiday');
    });
  });
  
  // C3. Saturdays
  const saturdays = WIZ.periodDates.filter(d => classifyDay(d) === 'SATURDAY');
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    saturdays.forEach(date => {
      if (WIZ.locked[date][staff._id] || WIZ.offCount[staff._id] >= target || !canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Saturday off');
    });
  });
  
  // C4. Weekdays
  const weekdays = WIZ.periodDates.filter(d => classifyDay(d) === 'WEEKDAY');
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    weekdays.forEach(date => {
      if (WIZ.locked[date][staff._id] || WIZ.offCount[staff._id] >= target || !canAssignRelax(date)) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Weekday off');
    });
  });
  
  // C5. Final pass
  sorted.forEach(staff => {
    if (WIZ.offCount[staff._id] >= target) return;
    WIZ.periodDates.forEach(date => {
      if (WIZ.locked[date][staff._id] || WIZ.offCount[staff._id] >= target) return;
      WIZ.grid[date][staff._id] = 'OFF';
      WIZ.locked[date][staff._id] = true;
      WIZ.offCount[staff._id]++;
      logDecision(date, staff, 'OFF', 'Final pass');
    });
  });
}

/* ═══ STEP D: PROCESS DAYS ═══ */
function processAllDays() {
  WIZ.periodDates.forEach((date, idx) => {
    processDay(date, idx === 0 ? null : WIZ.periodDates[idx - 1]);
  });
}

function processDay(date, prevDate) {
  applyN12PriorityRest(date, prevDate);
  fillDayShifts(date);
  autoFixMissingShifts(date);
  WIZ.staffList.forEach(staff => {
    if (!WIZ.grid[date][staff._id]) {
      WIZ.grid[date][staff._id] = 'X';
      logDecision(date, staff, 'X', 'Standby');
    }
  });
}

function applyN12PriorityRest(date, prevDate) {
  if (!prevDate) return;
  WIZ.staffList.forEach(staff => {
    if (WIZ.locked[date][staff._id]) return;
    const prevCode = WIZ.grid[prevDate][staff._id];
    if (prevCode === 'N' || prevCode === 'N12') {
      if (canAssignRelax(date)) {
        WIZ.grid[date][staff._id] = 'OFF';
        WIZ.locked[date][staff._id] = true;
        WIZ.offCount[staff._id]++;
        logDecision(date, staff, 'OFF', 'Post-night rest');
        return;
      }
      WIZ.grid[date][staff._id] = 'E4';
      WIZ.locked[date][staff._id] = true;
      logDecision(date, staff, 'E4', 'Post-night fallback');
    }
  });
}

function fillDayShifts(date) {
  const req = getShiftReq(date);
  const shiftCodes = Object.keys(req).filter(c => req[c] > 0);
  
  shiftCodes.forEach(shiftCode => {
    let need = req[shiftCode] || 0;
    if (need <= 0) return;
    
    const free = WIZ.staffList.filter(s => !WIZ.locked[date][s._id] && !WIZ.grid[date][s._id]);
    
    const sorted = free.map(s => {
      let priority = 99;
      const primary = s.fixedShift || s.shift;
      const multi = s.multiShifts || [];
      if (primary === shiftCode) priority = 0;
      else if (multi.includes(shiftCode)) priority = 1 + multi.indexOf(shiftCode);
      return { staff: s, priority };
    }).sort((a, b) => a.priority - b.priority);
    
    for (const { staff } of sorted) {
      if (need <= 0) break;
      WIZ.grid[date][staff._id] = shiftCode;
      WIZ.locked[date][staff._id] = true;
      need--;
      logDecision(date, staff, shiftCode, `Fill ${shiftCode}`);
    }
  });
}

function autoFixMissingShifts(date) {
  const req = getShiftReq(date);
  const shiftCodes = Object.keys(req).filter(c => req[c] > 0);
  
  shiftCodes.forEach(shiftCode => {
    const need = req[shiftCode] || 0;
    if (need <= 0) return;
    const current = Object.values(WIZ.grid[date]).filter(c => c === shiftCode).length;
    let missing = need - current;
    if (missing <= 0) return;
    
    WIZ.staffList.forEach(staff => {
      if (missing <= 0) return;
      if (WIZ.locked[date][staff._id]) return;
      if (WIZ.grid[date][staff._id] === 'X') {
        WIZ.grid[date][staff._id] = shiftCode;
        missing--;
        logDecision(date, staff, shiftCode, `Fix from X`);
      }
    });
    
    if (missing > 0) {
      WIZ.staffList.forEach(staff => {
        if (missing <= 0) return;
        if (WIZ.locked[date][staff._id]) return;
        if (WIZ.grid[date][staff._id] === 'E4') {
          WIZ.grid[date][staff._id] = shiftCode;
          missing--;
          logDecision(date, staff, shiftCode, `Fix from E4`);
        }
      });
    }
  });
}

/* ═══ STEP E: PH → CPL ═══ */
function adjustPHForDutyStaff() {
  if (WIZ.holidays.length === 0) return;
  
  WIZ.staffList.forEach(staff => {
    WIZ.holidays.forEach(holiday => {
      const hDate = holiday.date;
      const code = WIZ.grid[hDate]?.[staff._id];
      
      if (code && !isRelaxCode(code)) {
        const candidates = WIZ.periodDates.filter(d => 
          d !== hDate && !WIZ.locked[d][staff._id] &&
          !isRelaxCode(WIZ.grid[d][staff._id]) && canAssignRelax(d)
        );
        candidates.sort((a, b) => Math.abs(new Date(a) - new Date(hDate)) - Math.abs(new Date(b) - new Date(hDate)));
        
        if (candidates.length > 0) {
          const targetDate = candidates[0];
          WIZ.grid[targetDate][staff._id] = 'PH';
          WIZ.locked[targetDate][staff._id] = true;
          WIZ.phCount[staff._id]++;
          logDecision(targetDate, staff, 'PH', `PH for holiday ${hDate}`);
        } else {
          const cplRecord = {
            _id: uid(),
            staffId: staff._id, staffName: staff.name, staffMobile: staff.mobile,
            type: 'PH_TO_CPL', amount: 1,
            originalHolidayDate: hDate, holidayName: holiday.name || 'Holiday',
            reason: 'No PH slot',
            status: 'pending',
            currentPeriodStart: WIZ.periodStart, currentPeriodEnd: WIZ.periodEnd,
            carryForward: true, pendingInNextRoster: true,
            createdBy: State.user?.name, createdAt: Date.now()
          };
          WIZ.cplConversions.push(cplRecord);
          LocalDB.push('cplRecords', cplRecord);
          logDecision(hDate, staff, 'CPL', `PH→CPL`);
        }
      }
    });
  });
}

function applyPendingCPLFromPrevious() {
  const allCPL = LocalDB.get('cplRecords', []);
  const pendingCPL = allCPL.filter(c => c.status === 'pending' && c.pendingInNextRoster === true);
  if (pendingCPL.length === 0) return;
  
  pendingCPL.forEach(cpl => {
    const staff = WIZ.staffList.find(s => s._id === cpl.staffId);
    if (!staff) return;
    
    const candidates = WIZ.periodDates.filter(d => 
      !WIZ.locked[d][staff._id] && !isRelaxCode(WIZ.grid[d][staff._id]) && canAssignRelax(d)
    );
    candidates.sort((a, b) => {
      const dayA = new Date(a).getDay();
      const dayB = new Date(b).getDay();
      return ((dayA >= 1 && dayA <= 5) ? 0 : 1) - ((dayB >= 1 && dayB <= 5) ? 0 : 1);
    });
    
    if (candidates.length > 0) {
      const targetDate = candidates[0];
      WIZ.grid[targetDate][staff._id] = 'OFF';
      WIZ.locked[targetDate][staff._id] = true;
      WIZ.offCount[staff._id]++;
      LocalDB.update('cplRecords', cpl._id, {
        status: 'applied',
        appliedInPeriodStart: WIZ.periodStart,
        appliedInPeriodEnd: WIZ.periodEnd,
        appliedOnDate: targetDate,
        appliedAt: Date.now()
      });
      logDecision(targetDate, staff, 'OFF', `CPL from ${cpl.currentPeriodStart}`);
    }
  });
}

/* ═══ STEP F: FINALIZE + VALIDATE ═══ */
function finalizeGeneration() {
  const offTarget = calcOffTarget();
  const holidayCount = calcHolidayCount();
  
  WIZ.offCount = {}; WIZ.phCount = {};
  WIZ.staffList.forEach(s => { WIZ.offCount[s._id] = 0; WIZ.phCount[s._id] = 0; });
  
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      const code = WIZ.grid[date][staff._id];
      if (code === 'OFF') WIZ.offCount[staff._id]++;
      if (code === 'PH') WIZ.phCount[staff._id]++;
    });
  });
  
  WIZ.warnings = [];
  WIZ.validationDetails = {
    offTarget: { passed: 0, failed: 0, items: [] },
    phCount: { passed: 0, failed: 0, items: [] },
    relaxLimit: { passed: 0, failed: 0, items: [] },
    n12Rule: { passed: 0, failed: 0, items: [] },
    emptyCells: { passed: 0, failed: 0, items: [] }
  };
  
  // V1: OFF target
  WIZ.staffList.forEach(staff => {
    const actual = WIZ.offCount[staff._id];
    if (actual === offTarget) WIZ.validationDetails.offTarget.passed++;
    else {
      WIZ.validationDetails.offTarget.failed++;
      WIZ.validationDetails.offTarget.items.push({ staff: staff.name, actual, expected: offTarget });
      WIZ.warnings.push(`${staff.name}: OFF ${actual}/${offTarget}`);
    }
  });
  
  // V2: PH count
  WIZ.staffList.forEach(staff => {
    const actual = WIZ.phCount[staff._id];
    const cplAdj = WIZ.cplConversions.filter(c => c.staffId === staff._id).length;
    if (actual + cplAdj === holidayCount) WIZ.validationDetails.phCount.passed++;
    else {
      WIZ.validationDetails.phCount.failed++;
      WIZ.warnings.push(`${staff.name}: PH ${actual + cplAdj}/${holidayCount}`);
    }
  });
  
  // V3: Relax limit
  WIZ.periodDates.forEach(date => {
    const relax = getDayRelaxCount(date);
    const limit = getRelaxLimit(date);
    if (relax <= limit) WIZ.validationDetails.relaxLimit.passed++;
    else {
      WIZ.validationDetails.relaxLimit.failed++;
      WIZ.warnings.push(`${date}: relax ${relax}/${limit}`);
    }
  });
  
  // V4: N/N12 rule
  for (let i = 1; i < WIZ.periodDates.length; i++) {
    const prevDate = WIZ.periodDates[i - 1];
    const currDate = WIZ.periodDates[i];
    WIZ.staffList.forEach(staff => {
      const prevCode = WIZ.grid[prevDate][staff._id];
      const currCode = WIZ.grid[currDate][staff._id];
      if (prevCode === 'N' || prevCode === 'N12') {
        if (['OFF', 'E4', 'E'].includes(currCode)) WIZ.validationDetails.n12Rule.passed++;
        else {
          WIZ.validationDetails.n12Rule.failed++;
          WIZ.warnings.push(`${staff.name}: N/N12 → ${currCode} on ${currDate}`);
        }
      }
    });
  }
  
  // V5: Empty cells
  WIZ.periodDates.forEach(date => {
    WIZ.staffList.forEach(staff => {
      if (WIZ.grid[date][staff._id]) WIZ.validationDetails.emptyCells.passed++;
      else {
        WIZ.validationDetails.emptyCells.failed++;
        WIZ.warnings.push(`${staff.name} empty on ${date}`);
      }
    });
  });
  
  WIZ.finalStats = {
    totalShifts: WIZ.periodDates.length * WIZ.staffList.length,
    totalOff: Object.values(WIZ.offCount).reduce((a, b) => a + b, 0),
    totalPH: Object.values(WIZ.phCount).reduce((a, b) => a + b, 0),
    totalCPL: WIZ.cplConversions.length,
    warnings: WIZ.warnings.length
  };
  
  return WIZ.warnings.length === 0;
}

/* ═══ MAIN GENERATOR ═══ */
window.wizRunGeneration = function() {
  if (WIZ.staffList.length === 0) { toast('No active staff', 'error'); return; }
  WIZ.periodDates = dateRange(WIZ.periodStart, WIZ.periodEnd);
  if (WIZ.periodDates.length === 0) { toast('Invalid period', 'error'); return; }
  
  WIZ.step = 5;
  renderWizard();
  toast('⏳ Generating...', 'warning');
  
  setTimeout(() => {
    try {
      initGrid();
      applyLockedEntries();
      applyPendingCPLFromPrevious();
      assignOFFToAllStaff();
      processAllDays();
      adjustPHForDutyStaff();
      const valid = finalizeGeneration();
      
      toast(valid ? '✅ Roster generated!' : `⚠️ ${WIZ.warnings.length} warnings`, valid ? 'success' : 'error');
      WIZ.step = 6;
      renderWizard();
    } catch (e) {
      console.error('Generation error:', e);
      toast('Failed: ' + e.message, 'error');
      WIZ.step = 4;
      renderWizard();
    }
  }, 200);
};

/* ═══ SAVE ROSTER ═══ */
window.wizSaveRoster = function() {
  if (WIZ.warnings.length > 0) { toast('Fix warnings first', 'error'); return; }
  if (!confirm('Save this roster?')) return;
  
  const periodId = `${WIZ.periodStart}_${WIZ.periodEnd}`;
  const roster = {
    _id: periodId,
    periodStart: WIZ.periodStart, periodEnd: WIZ.periodEnd,
    generatedAt: Date.now(),
    generatedBy: State.user?.name || 'Admin',
    staffCount: WIZ.staffList.length,
    grid: WIZ.grid, offCount: WIZ.offCount, phCount: WIZ.phCount,
    cplConversions: WIZ.cplConversions, log: WIZ.conflictLog,
    holidays: WIZ.holidays, stats: WIZ.finalStats, validation: WIZ.validationDetails
  };
  
  try {
    let allRosters = LocalDB.get('rosters', []);
    const idx = allRosters.findIndex(r => r._id === periodId);
    if (idx >= 0) allRosters[idx] = roster;
    else allRosters.push(roster);
    LocalDB.set('rosters', allRosters);
    
    let holidays = LocalDB.get('holidays', []);
    WIZ.holidays.forEach(h => {
      if (!holidays.some(x => x.date === h.date)) holidays.push(h);
    });
    LocalDB.set('holidays', holidays);
    State.holidays = holidays;
    
    State.rosterData = WIZ.grid;
    State.rosterPeriod = { start: WIZ.periodStart, end: WIZ.periodEnd };
    State.currentRoster = roster;
    
    LocalDB.push('notifications', {
      _id: uid(), title: '✅ Roster Published',
      body: `Period: ${fmtDisplay(WIZ.periodStart)} → ${fmtDisplay(WIZ.periodEnd)}`,
      read: false, type: 'roster', createdAt: Date.now()
    });
    State.notifications = LocalDB.get('notifications', []);
    State.unreadCount = State.notifications.filter(n => !n.read).length;
    updateBell();
    
    toast('✅ Roster saved!', 'success');
    closeModal();
    State.activeTab = 'roster';
    render();
  } catch (e) {
    console.error('Save error:', e);
    toast('Save failed: ' + e.message, 'error');
  }
};

/* ═══ PRINT ROSTER ═══ */
window.printRoster = function() {
  if (!State.rosterData || !State.rosterPeriod) { toast('No roster', 'error'); return; }
  
  const dates = dateRange(State.rosterPeriod.start, State.rosterPeriod.end);
  const staffList = State.staff.filter(s => s.active !== false);
  const logo = localStorage.getItem('kih_hospital_logo');
  const hospitalName = State.settings?.hospitalName || 'Kulsum International Hospital';

/* ═══ EXPORT CSV ═══ */
window.exportRosterCSV = function() {
  if (!State.rosterData || !State.rosterPeriod) { toast('No roster', 'error'); return; }
  
  const dates = dateRange(State.rosterPeriod.start, State.rosterPeriod.end);
  const staffList = State.staff.filter(s => s.active !== false);
  const headers = ['Staff', 'Mobile', ...dates.map(d => `${d} (${dayShort(d)})`)];
  const rows = [headers];
  
  staffList.forEach(staff => {
    const row = [staff.name, staff.mobile || ''];
    dates.forEach(date => { row.push(State.rosterData[date]?.[staff._id] || 'X'); });
    rows.push(row);
  });
  
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `kih-roster-${State.rosterPeriod.start}-to-${State.rosterPeriod.end}.csv`;
  link.click();
  URL.revokeObjectURL(url);
  toast('✅ CSV exported', 'success');
};

window.toggleAllRecipients = function(checked) {
  $$('.sn-recipient').forEach(el => el.checked = checked);
};

window.sendNotification = function() {
  const title = $('sn_title').value.trim();
  const body = $('sn_body').value.trim();
  if (!title || !body) { toast('Fill title and message', 'error'); return; }
  
  const recipients = Array.from($$('.sn-recipient:checked')).map(el => ({
    id: el.value, mobile: el.dataset.mobile, name: el.dataset.name
  }));
  
  if (recipients.length === 0) { toast('Select recipients', 'error'); return; }
  
  LocalDB.push('notifications', {
    _id: uid(), title, body,
    type: $('sn_type').value,
    recipients: recipients.map(r => r.id),
    sentBy: State.user?.name || 'Admin',
    createdAt: Date.now(), read: false
  });
  
  recipients.forEach((r, i) => {
    setTimeout(() => {
      const mobile = normalizeMobile(r.mobile);
      const fullMobile = mobile.startsWith('0') ? '92' + mobile.slice(1) : mobile;
      const message = `*🏥 KIH Phlebotomy*\n\n*${title}*\n\n${body}\n\n_Sent by: ${State.user?.name || 'Admin'}_`;
      window.open(`https://wa.me/${fullMobile}?text=${encodeURIComponent(message)}`, '_blank');
    }, i * 500);
  });
  
  toast(`Sending to ${recipients.length} staff`, 'success');
  closeModal();
  State.notifications = LocalDB.get('notifications', []);
  State.unreadCount = State.notifications.filter(n => !n.read).length;
  updateBell();
  render();
};

window.saveTemplate = function() {
  const name = $('ht_name').value.trim();
  const description = $('ht_desc').value.trim();
  const category = $('ht_category').value;
  const fileInput = $('ht_file');
  
  if (!name) { toast('Enter name', 'error'); return; }
  if (!fileInput.files || !fileInput.files[0]) { toast('Select file', 'error'); return; }
  
  const file = fileInput.files[0];
  if (file.size > 5 * 1024 * 1024) { toast('File too large (max 5MB)', 'error'); return; }
  
  const reader = new FileReader();
  reader.onload = (e) => {
    const form = {
      _id: uid(), name, description, category,
      fileName: file.name, fileType: file.type, fileSize: file.size,
      fileData: e.target.result,
      uploadedBy: State.user?.name || 'Admin',
      createdAt: Date.now()
    };
    try {
      LocalDB.push('historyForms', form);
      State.historyForms.push(form);
      toast('Template saved', 'success');
      openHistoryFormsModal();
    } catch (err) { toast('Storage full', 'error'); }
  };
  reader.readAsDataURL(file);
};

window.downloadForm = function(id) {
  const form = State.historyForms.find(f => f._id === id);
  if (!form) return;
  const a = document.createElement('a');
  a.href = form.fileData;
  a.download = form.fileName || (form.name + '.pdf');
  a.click();
  toast('Downloading...', 'success');
};

/* Patch render to update sidebar */
(function patchRender() {
  const originalRender = window.render;
  window.render = function() {
    if (originalRender) originalRender();
    const sidebar = document.getElementById('kihSidebar');
    if (sidebar) {
      sidebar.querySelectorAll('.kih-nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === State.activeTab);
      });
    }
  };
})();

/* Handle window resize */
(function handleResize() {
  function check() {
    if (window.innerWidth >= 1024) {
      if (!document.getElementById('kihSidebar')) buildSidebar();
    } else {
      const sb = document.getElementById('kihSidebar');
      if (sb) sb.remove();
    }
  }
  setTimeout(check, 100);
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(check, 250);
  });
})();

(function boot() {
  // Ensure default admin exists
  let staff = LocalDB.get('staff', []);
  if (staff.length === 0 || !staff.find(s => s.mobile === '03001234567')) {
    staff = staff.filter(s => s.mobile !== '03001234567');
    staff.push(DEFAULT_ADMIN);
    LocalDB.set('staff', staff);
  }
  
  // Attach login handlers
  const loginBtn = $('loginBtn');
  const guestBtn = $('guestBtn');
  const logoutBtn = $('logoutBtn');
  const bellBtn = $('notificationBell');
  
  if (loginBtn) loginBtn.onclick = doLogin;
  if (guestBtn) guestBtn.onclick = doGuestLogin;
  if (logoutBtn) logoutBtn.onclick = doLogout;
  if (bellBtn) bellBtn.onclick = openNotificationsModal;
  
  // Enter key on login
  const pwd = $('loginPassword');
  if (pwd) pwd.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  
  // Mobile input formatting
  const mob = $('loginMobile');
  if (mob) {
    mob.addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      e.target.value = v;
    });
  }
  
  // Online/offline
  window.addEventListener('online', () => { State.online = true; updateOnlineDot(); toast('Back online', 'success'); });
  window.addEventListener('offline', () => { State.online = false; updateOnlineDot(); toast('Offline mode', 'warning'); });
  
  // Auto-login if session exists
  const session = loadSession();
  if (session && session.user) {
    const allStaff = LocalDB.get('staff', [DEFAULT_ADMIN]);
    const exists = allStaff.find(s => s._id === session.user._id);
    if (exists) {
      State.user = exists;
      showApp();
      return;
    } else {
      clearSession();
    }
  }
  
  // Show login screen
  const loginScreen = $('loginScreen');
  if (loginScreen) loginScreen.style.display = 'flex';
  
  console.log('%c🩸 KIH Phlebotomy Companion v3.0', 'color:#14B8A6;font-weight:bold;font-size:14px');

  console.log('%c🔐 Default Admin: 03001234567 / admin123', 'color:#10B981;font-size:11px');
})();

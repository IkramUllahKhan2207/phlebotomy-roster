<script>
/* ===== GLOBAL STATE ===== */
const DEFAULT_STAFF = [
    { id: 1, name: 'Waqas Aziz', gender: 'M', isNightPrimary: true },
    { id: 2, name: 'Muhammad Zakarya', gender: 'M', isNightPrimary: true },
    { id: 3, name: 'Bilal', gender: 'M', isNightPrimary: false },
    { id: 4, name: 'Aamir', gender: 'M', isNightPrimary: false },
    { id: 5, name: 'Sher Ali', gender: 'M', isNightPrimary: false },
    { id: 6, name: 'Asad', gender: 'M', isNightPrimary: false },
    { id: 7, name: 'Yasir', gender: 'M', isNightPrimary: false },
    { id: 8, name: 'Daniyal', gender: 'M', isNightPrimary: false },
    { id: 9, name: 'Haseeb', gender: 'M', isNightPrimary: false },
    { id: 10, name: 'Aqsa', gender: 'F', isNightPrimary: false },
    { id: 11, name: 'Naila', gender: 'F', isNightPrimary: false },
    { id: 12, name: 'Samia', gender: 'F', isNightPrimary: false }
];

let appState = {
    user: null,
    staff: [],
    roster: {},
    cycleDates: [],
    startDate: '2026-09-26',
    endDate: '2026-10-25'
};

/* ===== INITIALIZATION & SESSION PERSISTENCE ===== */
document.addEventListener('DOMContentLoaded', () => {
    checkAuthSession();
    initCycleDates();
    loadStaffData();
});

function checkAuthSession() {
    const savedSession = localStorage.getItem('kih_session');
    if (savedSession) {
        const session = JSON.parse(savedSession);
        const now = new Date().getTime();
        // Check 30-day expiry
        if (now - session.timestamp < 30 * 24 * 60 * 60 * 1000) {
            appState.user = session.user;
            hideLoginScreen();
            return;
        }
    }
    showLoginScreen();
}

function doLogin() {
    const mobile = document.getElementById('loginMobile').value;
    const pass = document.getElementById('loginPassword').value;
    const keepSigned = document.getElementById('keepSignedIn').checked;

    if (!mobile || !pass) {
        showToast('Please enter mobile number and password', 'error');
        return;
    }

    const user = { name: 'Admin User', role: 'Manager', mobile: mobile };
    appState.user = user;

    if (keepSigned) {
        localStorage.setItem('kih_session', JSON.stringify({
            user: user,
            timestamp: new Date().getTime()
        }));
    }

    hideLoginScreen();
    showToast('Signed in successfully!');
}

function doGuestLogin() {
    appState.user = { name: 'Guest User', role: 'Viewer' };
    hideLoginScreen();
    showToast('Logged in as Guest');
}

function showLoginScreen() {
    document.getElementById('loginScreen').style.display = 'flex';
}

function hideLoginScreen() {
    document.getElementById('loginScreen').style.display = 'none';
}

/* ===== DATE CALCULATIONS ===== */
function initCycleDates() {
    const start = new Date(appState.startDate);
    const end = new Date(appState.endDate);
    appState.cycleDates = [];

    let current = new Date(start);
    while (current <= end) {
        const dateStr = current.toISOString().split('T')[0];
        const dayOfWeek = current.getDay();
        appState.cycleDates.push({
            dateStr: dateStr,
            dayNum: current.getDate(),
            dayOfWeek: dayOfWeek,
            isSunday: dayOfWeek === 0,
            isSaturday: dayOfWeek === 6
        });
        current.setDate(current.getDate() + 1);
    }
}

function loadStaffData() {
    const savedStaff = localStorage.getItem('kih_staff');
    appState.staff = savedStaff ? JSON.parse(savedStaff) : DEFAULT_STAFF;
}

/* ===== ROSTER AUTO GENERATION ENGINE ===== */
function autoGenerateRosterEngine() {
    initCycleDates();
    appState.roster = {};
    
    appState.staff.forEach(s => { appState.roster[s.id] = {}; });

    appState.cycleDates.forEach((d, dateIdx) => {
        const prevDateStr = dateIdx > 0 ? appState.cycleDates[dateIdx - 1].dateStr : null;

        if (d.isSunday) {
            // STRICT SUNDAY RULE: 2M + 2E + 1N + 7 OFF
            let reqM = 2, reqE = 2, reqN = 1;

            // Females assigned Day shifts on Sunday
            appState.staff.forEach(s => {
                if (s.gender === 'F') {
                    if (reqM > 0) { appState.roster[s.id][d.dateStr] = 'M'; reqM--; }
                    else if (reqE > 0) { appState.roster[s.id][d.dateStr] = 'E'; reqE--; }
                    else { appState.roster[s.id][d.dateStr] = 'OFF'; }
                }
            });

            // Males assigned remaining duties with rest restriction check
            appState.staff.forEach(s => {
                if (s.gender === 'M') {
                    if (prevDateStr && (appState.roster[s.id][prevDateStr] === 'N' || appState.roster[s.id][prevDateStr] === 'N12')) {
                        appState.roster[s.id][d.dateStr] = 'OFF';
                        return;
                    }

                    if (reqN > 0 && s.isNightPrimary) {
                        appState.roster[s.id][d.dateStr] = 'N'; reqN--;
                    } else if (reqM > 0) {
                        appState.roster[s.id][d.dateStr] = 'M'; reqM--;
                    } else if (reqE > 0) {
                        appState.roster[s.id][d.dateStr] = 'E'; reqE--;
                    } else {
                        appState.roster[s.id][d.dateStr] = 'OFF';
                    }
                }
            });

        } else {
            // WEEKDAYS & SATURDAYS
            let req = d.isSaturday 
                ? { M: 3, E: 3, E4: 1, N12: 1, D: 1, X: 1 } 
                : { M: 4, E: 4, E4: 1, N12: 1, D: 1, X: 1 };

            // Female staff shifts
            appState.staff.forEach(s => {
                if (s.gender === 'F') {
                    if (req.M > 0) { appState.roster[s.id][d.dateStr] = 'M'; req.M--; }
                    else if (req.E > 0) { appState.roster[s.id][d.dateStr] = 'E'; req.E--; }
                    else if (req.D > 0) { appState.roster[s.id][d.dateStr] = 'D'; req.D--; }
                    else if (req.X > 0) { appState.roster[s.id][d.dateStr] = 'X'; req.X--; }
                    else { appState.roster[s.id][d.dateStr] = 'OFF'; }
                }
            });

            // Male staff shifts
            appState.staff.forEach(s => {
                if (s.gender === 'M') {
                    // Mandatory 36-Hour Rest Check After Night Duty
                    if (prevDateStr && (appState.roster[s.id][prevDateStr] === 'N' || appState.roster[s.id][prevDateStr] === 'N12')) {
                        appState.roster[s.id][d.dateStr] = 'OFF';
                        return;
                    }

                    if (req.N12 > 0 && s.isNightPrimary) {
                        appState.roster[s.id][d.dateStr] = 'N12'; req.N12--;
                    } else if (req.E4 > 0) {
                        appState.roster[s.id][d.dateStr] = 'E4'; req.E4--;
                    } else if (req.M > 0) {
                        appState.roster[s.id][d.dateStr] = 'M'; req.M--;
                    } else if (req.E > 0) {
                        appState.roster[s.id][d.dateStr] = 'E'; req.E--;
                    } else if (req.D > 0) {
                        appState.roster[s.id][d.dateStr] = 'D'; req.D--;
                    } else if (req.X > 0) {
                        appState.roster[s.id][d.dateStr] = 'X'; req.X--;
                    } else {
                        appState.roster[s.id][d.dateStr] = 'OFF';
                    }
                }
            });
        }
    });

    showToast('Conflict-free roster generated!', 'success');
}

/* ===== TOAST NOTIFICATION ===== */
function showToast(msg, type = 'info') {
    let toast = document.getElementById('appToast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'appToast';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.innerText = msg;
    toast.className = `toast show ${type}`;
    setTimeout(() => { toast.className = 'toast'; }, 3000);
}
</script>
